<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="auto" style="background: #06100c; border-radius: 12px; font-family: 'Figtree', sans-serif;">
  <defs>
    <linearGradient id="cleanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2b24" />
      <stop offset="100%" stop-color="#051410" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="480" fill="url(#cleanGrad)" rx="12" />
  <rect x="15" y="15" width="870" height="450" fill="none" stroke="#1b4d3e" stroke-width="1.5" rx="8" />

  <!-- En-tête -->
  <rect x="15" y="15" width="870" height="45" fill="#0d352b" rx="8" />
  <text x="35" y="44" fill="#3fae7a" font-size="16" font-weight="bold" letter-spacing="1">LE PIPELINE DE NETTOYAGE DE DONNÉES DE TERRAIN · TEAM SAHÉLIA</text>

  <!-- Bloc 1 : Données Brutes Polluées -->
  <rect x="35" y="85" width="240" height="260" fill="#061a14" stroke="#e8946a" stroke-width="1.5" rx="8" />
  <rect x="35" y="85" width="240" height="35" fill="#2a1208" rx="8" />
  <text x="50" y="108" fill="#e8946a" font-size="12" font-weight="bold">1. DONNÉES BRUTES POLLUÉES</text>
  <text x="50" y="145" fill="#f4faf7" font-size="11">Problèmes fréquents :</text>
  <text x="50" y="170" fill="#e8946a" font-size="11" font-family="monospace">"  Maïs   "</text>
  <text x="130" y="170" fill="#88b3a4" font-size="10">(espaces invisibles)</text>
  <text x="50" y="195" fill="#e8946a" font-size="11" font-family="monospace">"bio gounou"</text>
  <text x="140" y="195" fill="#88b3a4" font-size="10">(casse minuscule)</text>
  <text x="50" y="220" fill="#e8946a" font-size="11" font-family="monospace">"P001, Parakou"</text>
  <text x="160" y="220" fill="#88b3a4" font-size="10">(fusionné)</text>
  <text x="50" y="245" fill="#e8946a" font-size="11" font-family="monospace">"Ligne en double"</text>
  <text x="50" y="285" fill="#e8946a" font-size="11" font-weight="bold">Inexploitable pour RStudio,</text>
  <text x="50" y="305" fill="#e8946a" font-size="11" font-weight="bold">TCD ou statistiques.</text>

  <!-- Flèche 1 -> 2 -->
  <path d="M 285 215 L 305 215 M 295 205 L 305 215 L 295 225" stroke="#e8946a" stroke-width="2.5" stroke-linecap="round" />

  <!-- Bloc 2 : Outils d'Assainissement -->
  <rect x="315" y="85" width="270" height="260" fill="#061a14" stroke="#7fb0ee" stroke-width="1.5" rx="8" />
  <rect x="315" y="85" width="270" height="35" fill="#0d352b" rx="8" />
  <text x="330" y="108" fill="#7fb0ee" font-size="12" font-weight="bold">2. ARSENAL DE NETTOYAGE</text>
  <text x="330" y="145" fill="#3fae7a" font-size="11" font-weight="bold">=SUPPRESPACE(A1)</text>
  <text x="330" y="165" fill="#88b3a4" font-size="10">Élimine tous les espaces parasites.</text>
  <text x="330" y="195" fill="#3fae7a" font-size="11" font-weight="bold">=NOMPROPRE(A1)</text>
  <text x="330" y="215" fill="#88b3a4" font-size="10">Première lettre en majuscule.</text>
  <text x="330" y="245" fill="#3fae7a" font-size="11" font-weight="bold">Données &gt; Convertir</text>
  <text x="330" y="265" fill="#88b3a4" font-size="10">Sépare nom et commune en 2 colonnes.</text>
  <text x="330" y="295" fill="#3fae7a" font-size="11" font-weight="bold">Données &gt; Supprimer Doublons</text>
  <text x="330" y="315" fill="#88b3a4" font-size="10">Élimine les saisies répétées.</text>

  <!-- Flèche 2 -> 3 -->
  <path d="M 595 215 L 615 215 M 605 205 L 615 215 L 605 225" stroke="#3fae7a" stroke-width="2.5" stroke-linecap="round" />

  <!-- Bloc 3 : Base Finale Pro & Verrouillée -->
  <rect x="625" y="85" width="240" height="260" fill="#061a14" stroke="#3fae7a" stroke-width="1.5" rx="8" />
  <rect x="625" y="85" width="240" height="35" fill="#0d352b" rx="8" />
  <text x="640" y="108" fill="#3fae7a" font-size="12" font-weight="bold">3. BASE PROPRE &amp; SÉCURISÉE</text>
  <text x="640" y="145" fill="#f4faf7" font-size="11">Résultats obtenus :</text>
  <text x="640" y="170" fill="#3fae7a" font-size="11" font-family="monospace">"Maïs"</text>
  <text x="700" y="170" fill="#88b3a4" font-size="10">(Texte pur)</text>
  <text x="640" y="195" fill="#3fae7a" font-size="11" font-family="monospace">"Bio Gounou"</text>
  <text x="730" y="195" fill="#88b3a4" font-size="10">(Propre)</text>
  <text x="640" y="220" fill="#3fae7a" font-size="11" font-family="monospace">Col A: P001 | Col B: Parakou</text>
  <text x="640" y="245" fill="#3fae7a" font-size="11" font-family="monospace">0 doublon dans la table</text>
  <text x="640" y="285" fill="#7fb0ee" font-size="11" font-weight="bold">Validation des données :</text>
  <text x="640" y="305" fill="#88b3a4" font-size="10">Listes déroulantes pour bloquer</text>
  <text x="640" y="320" fill="#88b3a4" font-size="10">toute nouvelle erreur future !</text>

  <!-- Bandeau Inférieur : La règle d'or -->
  <rect x="35" y="365" width="830" height="95" fill="#0a2b24" stroke="#25604d" stroke-width="1" rx="8" />
  <text x="50" y="392" fill="#e8946a" font-size="13" font-weight="bold">LE SECRET DES FORMULES TEXTE : COPIER &gt; COLLER EN VALEURS</text>
  <text x="50" y="418" fill="#f4faf7" font-size="12">Après avoir nettoyé vos textes avec =SUPPRESPACE(), sélectionnez la colonne propre, faites <tspan fill="#3fae7a" font-weight="bold">Ctrl + C</tspan>, puis <tspan fill="#3fae7a" font-weight="bold">Clic droit &gt; Coller en Valeurs (123)</tspan>.</text>
  <text x="50" y="440" fill="#88b3a4" font-size="11">Cela fige définitivement le texte propre et vous permet de supprimer l'ancienne colonne polluée sans casser vos formules.</text>
</svg>