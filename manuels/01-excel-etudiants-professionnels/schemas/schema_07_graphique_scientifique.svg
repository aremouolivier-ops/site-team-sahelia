<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="auto" style="background: #06100c; border-radius: 12px; font-family: 'Figtree', sans-serif;">
  <defs>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2b24" />
      <stop offset="100%" stop-color="#051410" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="480" fill="url(#chartGrad)" rx="12" />
  <rect x="15" y="15" width="870" height="450" fill="none" stroke="#1b4d3e" stroke-width="1.5" rx="8" />

  <!-- En-tête -->
  <rect x="15" y="15" width="870" height="45" fill="#0d352b" rx="8" />
  <text x="35" y="44" fill="#3fae7a" font-size="16" font-weight="bold" letter-spacing="1">ANATOMIE D'UN GRAPHIQUE SCIENTIFIQUE POUR JURY DE MÉMOIRE · TEAM SAHÉLIA</text>

  <!-- Colonne Gauche : Erreur Amateur -->
  <rect x="35" y="80" width="400" height="310" fill="#061a14" stroke="#e8946a" stroke-width="1.5" rx="8" />
  <rect x="35" y="80" width="400" height="35" fill="#2a1208" rx="8" />
  <text x="50" y="103" fill="#e8946a" font-size="13" font-weight="bold">❌ LE GRAPHIQUE AMATEUR (POLLUÉ &amp; REJETÉ)</text>

  <!-- Faux graphique pollué -->
  <rect x="60" y="130" width="350" height="150" fill="#140905" stroke="#4a2214" />
  <!-- Quadrillage lourd inutile -->
  <line x1="60" y1="160" x2="410" y2="160" stroke="#444" stroke-width="1" />
  <line x1="60" y1="190" x2="410" y2="190" stroke="#444" stroke-width="1" />
  <line x1="60" y1="220" x2="410" y2="220" stroke="#444" stroke-width="1" />
  <line x1="60" y1="250" x2="410" y2="250" stroke="#444" stroke-width="1" />
  <!-- Barres multicolores 3D criardes -->
  <rect x="100" y="150" width="45" height="130" fill="#e11d48" />
  <rect x="170" y="210" width="45" height="70" fill="#06b6d4" />
  <rect x="240" y="200" width="45" height="80" fill="#eab308" />
  <rect x="310" y="240" width="45" height="40" fill="#a855f7" />

  <text x="50" y="305" fill="#e8946a" font-size="11" font-weight="bold">Défauts éliminatoires :</text>
  <text x="50" y="325" fill="#88b3a4" font-size="11">• Effet 3D déformant la lecture des barres.</text>
  <text x="50" y="345" fill="#88b3a4" font-size="11">• Quadrillage lourd qui fatigue l'œil.</text>
  <text x="50" y="365" fill="#88b3a4" font-size="11">• Pas de barres d'erreur (écart-type absent).</text>
  <text x="50" y="385" fill="#88b3a4" font-size="11">• Absence de nom d'axe clair avec l'unité (kg/ha).</text>

  <!-- Colonne Droite : Graphique Scientifique Pro -->
  <rect x="465" y="80" width="400" height="310" fill="#061a14" stroke="#3fae7a" stroke-width="1.5" rx="8" />
  <rect x="465" y="80" width="400" height="35" fill="#0d352b" rx="8" />
  <text x="480" y="103" fill="#3fae7a" font-size="13" font-weight="bold">✓ LE STANDARD SCIENTIFIQUE ACADÉMIQUE</text>

  <!-- Graphique Pro Sobre -->
  <rect x="490" y="130" width="350" height="150" fill="#08221a" stroke="#1b4d3e" />
  <!-- Axes nets sans quadrillage interne -->
  <line x1="530" y1="140" x2="530" y2="260" stroke="#88b3a4" stroke-width="1.5" />
  <line x1="530" y1="260" x2="820" y2="260" stroke="#88b3a4" stroke-width="1.5" />

  <!-- Barres harmonieuses vert forêt/émeraude avec barres d'erreur -->
  <rect x="555" y="160" width="45" height="100" fill="#3fae7a" rx="2" />
  <!-- Barre d'erreur Maïs (T) -->
  <line x1="577" y1="140" x2="577" y2="180" stroke="#f4faf7" stroke-width="1.5" />
  <line x1="570" y1="140" x2="584" y2="140" stroke="#f4faf7" stroke-width="1.5" />

  <rect x="625" y="205" width="45" height="55" fill="#3fae7a" rx="2" />
  <line x1="647" y1="195" x2="647" y2="215" stroke="#f4faf7" stroke-width="1.5" />
  <line x1="640" y1="195" x2="654" y2="195" stroke="#f4faf7" stroke-width="1.5" />

  <rect x="695" y="200" width="45" height="60" fill="#3fae7a" rx="2" />
  <line x1="717" y1="190" x2="717" y2="210" stroke="#f4faf7" stroke-width="1.5" />
  <line x1="710" y1="190" x2="724" y2="190" stroke="#f4faf7" stroke-width="1.5" />

  <rect x="765" y="225" width="45" height="35" fill="#3fae7a" rx="2" />
  <line x1="787" y1="218" x2="787" y2="232" stroke="#f4faf7" stroke-width="1.5" />
  <line x1="780" y1="218" x2="794" y2="218" stroke="#f4faf7" stroke-width="1.5" />

  <!-- Libellés sous axes -->
  <text x="560" y="275" fill="#88b3a4" font-size="10">Maïs</text>
  <text x="630" y="275" fill="#88b3a4" font-size="10">Soja</text>
  <text x="700" y="275" fill="#88b3a4" font-size="10">Coton</text>
  <text x="770" y="275" fill="#88b3a4" font-size="10">Sorgho</text>

  <text x="480" y="305" fill="#3fae7a" font-size="11" font-weight="bold">Points forts validés par les jurys :</text>
  <text x="480" y="325" fill="#f4faf7" font-size="11">✓ Fond sobre, zéro quadrillage inutile.</text>
  <text x="480" y="345" fill="#f4faf7" font-size="11">✓ Barres d'erreur (± Écart-type) rigoureusement tracées.</text>
  <text x="480" y="365" fill="#f4faf7" font-size="11">✓ Titre explicite et axes labellisés en clair.</text>
  <text x="480" y="385" fill="#f4faf7" font-size="11">✓ Couleur uniforme : les catégories sont sur l'axe X.</text>

  <!-- Bandeau Inférieur -->
  <rect x="35" y="410" width="830" height="65" fill="#0a2b24" stroke="#25604d" stroke-width="1" rx="8" />
  <text x="50" y="435" fill="#e8946a" font-size="13" font-weight="bold">RÈGLE DE TUFTE : LE RATIO ENCRE-DONNÉE MAXIMUM</text>
  <text x="50" y="460" fill="#f4faf7" font-size="12">« Chaque goutte d'encre sur un graphique doit servir à transmettre de l'information. Tout élément purement décoratif (ombres, 3D, bordures épaisses) nuit à la crédibilité scientifique. »</text>
</svg>