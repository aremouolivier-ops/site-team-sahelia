  <text x="235" y="212" fill="#7fb0ee" font-size="10">Aligné GAUCHE</text>

  <!-- Cellule active B2 -->
  <rect x="305" y="190" width="180" height="35" fill="#0b382c" stroke="#3fae7a" stroke-width="2.5" />
  <text x="445" y="212" fill="#3fae7a" font-size="13" font-weight="bold">2.50</text>
  <text x="315" y="212" fill="#7fb0ee" font-size="10">Aligné DROITE</text>

  <rect x="485" y="190" width="180" height="35" fill="#061a14" stroke="#1b4d3e" />
  <text x="575" y="212" fill="#f4faf7" font-size="13">15/06/2026</text>

  <rect x="665" y="190" width="200" height="35" fill="#061a14" stroke="#1b4d3e" />
  <text x="825" y="212" fill="#f4faf7" font-size="13">3 200</text>

  <!-- Ligne 3 (Données réelles) -->
  <rect x="35" y="225" width="50" height="35" fill="#061a14" stroke="#1b4d3e" />
  <text x="55" y="247" fill="#88b3a4" font-size="12">3</text>
  <rect x="85" y="225" width="220" height="35" fill="#061a14" stroke="#1b4d3e" />
  <text x="95" y="247" fill="#f4faf7" font-size="13">N'Dali</text>
  <rect x="305" y="225" width="180" height="35" fill="#061a14" stroke="#1b4d3e" />
  <text x="445" y="247" fill="#f4faf7" font-size="13">1.80</text>
  <rect x="485" y="225" width="180" height="35" fill="#061a14" stroke="#1b4d3e" />
  <text x="575" y="247" fill="#f4faf7" font-size="13">20/06/2026</text>
  <rect x="665" y="225" width="200" height="35" fill="#061a14" stroke="#1b4d3e" />
  <text x="825" y="247" fill="#f4faf7" font-size="13">1 650</text>

  <!-- Encadré explicatif en bas -->
  <rect x="35" y="280" width="830" height="165" fill="#0a241c" stroke="#25604d" stroke-width="1" rx="8" />
  <text x="55" y="310" fill="#e8946a" font-size="14" font-weight="bold">RÈGLE D'OR DE COMPORTEMENT D'EXCEL :</text>
  <text x="55" y="338" fill="#f4faf7" font-size="13">1. <tspan fill="#3fae7a" font-weight="bold">NOMBRES VRAIS :</tspan> S'alignent TOUJOURS automatiquement à DROITE. S'il s'aligne à gauche, Excel le traite comme du texte !</text>
  <text x="55" y="365" fill="#f4faf7" font-size="13">2. <tspan fill="#7fb0ee" font-weight="bold">TEXTES &amp; LIBELLÉS :</tspan> S'alignent automatiquement à GAUCHE.</text>
  <text x="55" y="392" fill="#f4faf7" font-size="13">3. <tspan fill="#e8946a" font-weight="bold">DATES VALIDES :</tspan> S'alignent à DROITE. Ne tapez jamais de texte comme "15 Juin 26", utilisez le format JJ/MM/AAAA.</text>
  <text x="55" y="420" fill="#88b3a4" font-size="12">Signature Officielle TEAM Sahélia · Manuel 01 : Excel pour les Étudiants &amp; Professionnels</text>
</svg>