<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="auto" style="background: #06100c; border-radius: 12px; font-family: 'Figtree', sans-serif;">
  <defs>
    <linearGradient id="koboGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2b24" />
      <stop offset="100%" stop-color="#051410" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="480" fill="url(#koboGrad)" rx="12" />
  <rect x="15" y="15" width="870" height="450" fill="none" stroke="#1b4d3e" stroke-width="1.5" rx="8" />

  <!-- En-tête -->
  <rect x="15" y="15" width="870" height="45" fill="#0d352b" rx="8" />
  <text x="35" y="44" fill="#3fae7a" font-size="16" font-weight="bold" letter-spacing="1">LE CYCLE DE VIE D'UNE ENQUÊTE NUMÉRIQUE KOBOTOOLBOX · TEAM SAHÉLIA</text>

  <!-- Étape 1 : Conception Web -->
  <rect x="35" y="85" width="250" height="150" fill="#061a14" stroke="#3fae7a" stroke-width="1.5" rx="8" />
  <rect x="35" y="85" width="250" height="30" fill="#0d352b" rx="8" />
  <text x="50" y="105" fill="#3fae7a" font-size="12" font-weight="bold">ÉTAPE 1 : CONCEPTION WEB</text>
  <text x="50" y="135" fill="#f4faf7" font-size="12" font-weight="bold">Sur Ordinateur / Navigateur</text>
  <text x="50" y="160" fill="#88b3a4" font-size="11">• Création du formulaire</text>
  <text x="50" y="180" fill="#88b3a4" font-size="11">• Types de questions (GPS, Text, Date)</text>
  <text x="50" y="200" fill="#88b3a4" font-size="11">• Sauts conditionnels &amp; Validations</text>
  <text x="50" y="222" fill="#e8946a" font-size="10">kobotoolbox.org</text>

  <!-- Flèche 1 -> 2 -->
  <path d="M 295 160 L 325 160 M 315 150 L 325 160 L 315 170" stroke="#3fae7a" stroke-width="2.5" stroke-linecap="round" />

  <!-- Étape 2 : Déploiement -->
  <rect x="335" y="85" width="230" height="150" fill="#061a14" stroke="#7fb0ee" stroke-width="1.5" rx="8" />
  <rect x="335" y="85" width="230" height="30" fill="#0d352b" rx="8" />
  <text x="350" y="105" fill="#7fb0ee" font-size="12" font-weight="bold">ÉTAPE 2 : DÉPLOIEMENT</text>
  <text x="350" y="135" fill="#f4faf7" font-size="12" font-weight="bold">Publication Serveur</text>
  <text x="350" y="160" fill="#88b3a4" font-size="11">• Validation du test pilote</text>
  <text x="350" y="180" fill="#88b3a4" font-size="11">• Génération de la version v1</text>
  <text x="350" y="200" fill="#88b3a4" font-size="11">• Attribution aux enquêteurs</text>

  <!-- Flèche 2 -> 3 -->
  <path d="M 575 160 L 605 160 M 595 150 L 605 160 L 595 170" stroke="#7fb0ee" stroke-width="2.5" stroke-linecap="round" />

  <!-- Étape 3 : Téléchargement sur Smartphone -->
  <rect x="615" y="85" width="250" height="150" fill="#061a14" stroke="#e8946a" stroke-width="1.5" rx="8" />
  <rect x="615" y="85" width="250" height="30" fill="#0d352b" rx="8" />
  <text x="630" y="105" fill="#e8946a" font-size="12" font-weight="bold">ÉTAPE 3 : KOBOCOLLECT</text>
  <text x="630" y="135" fill="#f4faf7" font-size="12" font-weight="bold">Application Android</text>
  <text x="630" y="160" fill="#88b3a4" font-size="11">• Connexion au compte</text>
  <text x="630" y="180" fill="#88b3a4" font-size="11">• Télécharger formulaire vierge</text>
  <text x="630" y="200" fill="#88b3a4" font-size="11">• Stockage local sur la puce</text>

  <!-- Grand Cadre Inférieur : Terrain Hors-Ligne & Synchronisation -->
  <rect x="35" y="260" width="830" height="190" fill="#061a14" stroke="#1b4d3e" stroke-width="1.5" rx="8" />
  <rect x="35" y="260" width="830" height="35" fill="#09261f" rx="8" />
  <text x="50" y="283" fill="#e8946a" font-size="13" font-weight="bold">ÉTAPE 4 : COLLECTE AU CHAMP (100% HORS-LIGNE) &amp; SYNCHRONISATION</text>

  <!-- Colonne Gauche : Terrain -->
  <rect x="50" y="310" width="370" height="120" fill="#0a2b24" stroke="#3fae7a" stroke-width="1" rx="6" />
  <text x="65" y="335" fill="#3fae7a" font-size="13" font-weight="bold">AU VILLAGE / DANS LES CHAMPS (ZÉRO CONNEXION)</text>
  <text x="65" y="360" fill="#f4faf7" font-size="11">• Remplissage rapide par glissement du doigt (swipe)</text>
  <text x="65" y="380" fill="#f4faf7" font-size="11">• Relevé de coordonnées GPS haute précision (&lt; 4 mètres)</text>
  <text x="65" y="400" fill="#f4faf7" font-size="11">• Prise de photos compressées de parcelles et ravageurs</text>

  <!-- Flèche Synchronisation -->
  <path d="M 435 370 L 465 370 M 455 360 L 465 370 L 455 380" stroke="#e8946a" stroke-width="2.5" stroke-linecap="round" />

  <!-- Colonne Droite : Retour & Export -->
  <rect x="480" y="310" width="370" height="120" fill="#0a2b24" stroke="#7fb0ee" stroke-width="1" rx="6" />
  <text x="495" y="335" fill="#7fb0ee" font-size="13" font-weight="bold">RETOUR EN ZONE RÉSEAU (4G / WI-FI)</text>
  <text x="495" y="360" fill="#f4faf7" font-size="11">• Envoi des formulaires finalisés en 30 secondes</text>
  <text x="495" y="380" fill="#f4faf7" font-size="11">• Exportation Excel / CSV sans ressaisie manuelle</text>
  <text x="495" y="400" fill="#3fae7a" font-size="11" font-weight="bold">✓ Prêt immédiatement pour analyse dans RStudio et QGIS !</text>
</svg>