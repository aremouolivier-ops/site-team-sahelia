<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="auto" style="background: #06100c; border-radius: 12px; font-family: 'Figtree', sans-serif;">
  <defs>
    <linearGradient id="odkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2b24" />
      <stop offset="100%" stop-color="#051410" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="480" fill="url(#odkGrad)" rx="12" />
  <rect x="15" y="15" width="870" height="450" fill="none" stroke="#1b4d3e" stroke-width="1.5" rx="8" />

  <!-- Titre -->
  <rect x="15" y="15" width="870" height="45" fill="#0d352b" rx="8" />
  <text x="35" y="44" fill="#3fae7a" font-size="16" font-weight="bold" letter-spacing="1">DÉPLOIEMENT MOBILE, CONFIGURATION QR CODE &amp; HORS-LIGNE · TEAM SAHÉLIA</text>

  <!-- Colonne Gauche : Configuration QR Code en 1 Clic -->
  <rect x="35" y="75" width="400" height="375" fill="#061a14" stroke="#7fb0ee" stroke-width="1.5" rx="8" />
  <text x="50" y="105" fill="#7fb0ee" font-size="15" font-weight="bold">Configuration Flotte par QR Code</text>
  <text x="50" y="125" fill="#88b3a4" font-size="12">Déployer sur 10 smartphones sans taper de mot de passe</text>

  <!-- Simulation QR Code Box -->
  <rect x="50" y="145" width="370" height="150" fill="#0d352b" rx="6" />
  <rect x="65" y="160" width="120" height="120" fill="#ffffff" rx="4" />
  <!-- Motif QR symbolique -->
  <rect x="75" y="170" width="35" height="35" fill="#06100c" />
  <rect x="140" y="170" width="35" height="35" fill="#06100c" />
  <rect x="75" y="235" width="35" height="35" fill="#06100c" />
  <rect x="120" y="215" width="20" height="20" fill="#06100c" />
  <rect x="145" y="240" width="30" height="30" fill="#06100c" />

  <!-- Texte Explicatif QR -->
  <text x="200" y="180" fill="#f4faf7" font-size="12" font-weight="bold">QR Code Projet Kobo :</text>
  <text x="200" y="200" fill="#88b3a4" font-size="11">• URL du serveur</text>
  <text x="200" y="220" fill="#88b3a4" font-size="11">• Identifiant enquêteur</text>
  <text x="200" y="240" fill="#88b3a4" font-size="11">• Jeton de sécurité chiffré</text>
  <text x="200" y="265" fill="#3fae7a" font-size="11" font-weight="bold">Scan immédiat en 2s ✓</text>

  <!-- Procédure Mobile -->
  <rect x="50" y="310" width="370" height="125" fill="#06100c" stroke="#1b4d3e" rx="6" />
  <text x="65" y="332" fill="#7fb0ee" font-size="12" font-weight="bold">Étapes sur l'application ODK / KoboCollect :</text>
  <text x="65" y="352" fill="#f4faf7" font-size="11">1. Télécharger 'KoboCollect' sur Google Play Store.</text>
  <text x="65" y="372" fill="#f4faf7" font-size="11">2. Ouvrir l'app > Sélectionner 'Configurer par code QR'.</text>
  <text x="65" y="392" fill="#f4faf7" font-size="11">3. Viser l'écran du PC : tous les formulaires sont chargés !</text>
  <text x="65" y="415" fill="#3fae7a" font-size="10" font-weight="bold">Zéro risque de faute de frappe sur le terrain.</text>

  <!-- Colonne Droite : Le Mode Hors-Ligne & Précision GPS -->
  <rect x="465" y="75" width="400" height="375" fill="#061a14" stroke="#3fae7a" stroke-width="1.5" rx="8" />
  <text x="480" y="105" fill="#3fae7a" font-size="15" font-weight="bold">Collecte Hors-Ligne &amp; Puce Satellite</text>
  <text x="480" y="125" fill="#88b3a4" font-size="12">Travailler au fond des champs sans aucun réseau internet</text>

  <!-- Carte Satellite Simulé -->
  <rect x="480" y="145" width="370" height="150" fill="#09291b" stroke="#3fae7a" rx="6" />
  <text x="495" y="170" fill="#3fae7a" font-size="13" font-weight="bold">📍 Acquisition du Point GPS Parcelle :</text>
  <text x="495" y="195" fill="#f4faf7" font-size="11">• La puce GPS du smartphone fonctionne sans réseau GSM.</text>
  <text x="495" y="215" fill="#f4faf7" font-size="11">• Se positionner au centre de la parcelle à ciel ouvert.</text>
  <text x="495" y="235" fill="#e8946a" font-size="11">• Attendre que la précision descende sous les 5 mètres.</text>
  
  <rect x="495" y="250" width="340" height="30" fill="#06100c" rx="4" />
  <text x="505" y="270" fill="#3fae7a" font-size="11" font-family="monospace">Latitude: 9.3371° N  |  Précision: 3.2 m ✓</text>

  <!-- Synchronisation Cloud -->
  <rect x="480" y="310" width="370" height="125" fill="#0d352b" rx="6" />
  <text x="495" y="332" fill="#7fb0ee" font-size="12" font-weight="bold">Synchronisation au Retour à la Station :</text>
  <text x="495" y="352" fill="#f4faf7" font-size="11">1. Dans le champ : les enquêtes sont stockées en local.</text>
  <text x="495" y="372" fill="#f4faf7" font-size="11">2. De retour au bureau ou village : activer les données / Wi-Fi.</text>
  <text x="495" y="392" fill="#f4faf7" font-size="11">3. Cliquer sur 'Envoyer formulaires finalisés'.</text>
  <text x="495" y="415" fill="#e8946a" font-size="10" font-weight="bold">Les données se déversent en temps réel dans votre base centrale.</text>
</svg>
