<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="auto" style="background: #06100c; border-radius: 12px; font-family: 'Figtree', sans-serif;">
  <defs>
    <linearGradient id="mediaGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2b24" />
      <stop offset="100%" stop-color="#051410" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="480" fill="url(#mediaGrad4)" rx="12" />
  <rect x="15" y="15" width="870" height="450" fill="none" stroke="#1b4d3e" stroke-width="1.5" rx="8" />

  <!-- Titre -->
  <rect x="15" y="15" width="870" height="45" fill="#0d352b" rx="8" />
  <text x="35" y="44" fill="#3fae7a" font-size="16" font-weight="bold" letter-spacing="1">TOURNAGE MOBILE SUR LE TERRAIN : CADRAGE, LUMIÈRE ET CAPTATION AUDIO</text>

  <!-- Colonne 1 : Cadrage & Règle des Tiers (Format 9:16) -->
  <rect x="35" y="75" width="260" height="375" fill="#061a14" stroke="#7fb0ee" stroke-width="1.5" rx="8" />
  <text x="50" y="105" fill="#7fb0ee" font-size="14" font-weight="bold">1. Cadrage &amp; Grille des Tiers</text>
  
  <!-- Smartphone frame 9:16 miniature -->
  <rect x="75" y="125" width="180" height="250" fill="#030806" stroke="#3fae7a" stroke-width="2" rx="10" />
  <!-- Lignes des tiers -->
  <line x1="135" y1="125" x2="135" y2="375" stroke="#1b4d3e" stroke-dasharray="3,3" stroke-width="1" />
  <line x1="195" y1="125" x2="195" y2="375" stroke="#1b4d3e" stroke-dasharray="3,3" stroke-width="1" />
  <line x1="75" y1="208" x2="255" y2="208" stroke="#1b4d3e" stroke-dasharray="3,3" stroke-width="1" />
  <line x1="75" y1="291" x2="255" y2="291" stroke="#1b4d3e" stroke-dasharray="3,3" stroke-width="1" />
  <!-- Yeux sur ligne supérieure -->
  <circle cx="135" cy="208" r="6" fill="#d89f3c" />
  <text x="145" y="212" fill="#d89f3c" font-size="10" font-weight="bold">Yeux sujet (tiers sup.)</text>
  <!-- Sujet stylisé -->
  <circle cx="135" cy="200" r="16" fill="#3fae7a" opacity="0.8" />
  <path d="M 105 270 Q 135 220 165 270" fill="#1b4d3e" />

  <text x="50" y="395" fill="#f4faf7" font-size="10" font-weight="bold">• Coudes calés contre le torse (stabilité)</text>
  <text x="50" y="413" fill="#f4faf7" font-size="10">• Smartphone à hauteur des yeux (pas de plongée)</text>
  <text x="50" y="431" fill="#88b3a4" font-size="9">Règle des 3 secondes : plan fixe sans bouger</text>

  <!-- Colonne 2 : Gestion de la Lumière Naturelle -->
  <rect x="315" y="75" width="270" height="375" fill="#061a14" stroke="#d89f3c" stroke-width="1.5" rx="8" />
  <text x="330" y="105" fill="#d89f3c" font-size="14" font-weight="bold">2. Lumière Naturelle &amp; Soleil</text>

  <!-- Schéma lumière zénithale vs Golden hour -->
  <rect x="330" y="125" width="240" height="135" fill="#06100c" stroke="#1b4d3e" rx="6" />
  <circle cx="450" cy="155" r="18" fill="#d89f3c" />
  <text x="450" y="190" text-anchor="middle" fill="#d89f3c" font-size="11" font-weight="bold">Soleil à 45° ou dans le dos</text>
  <text x="450" y="208" text-anchor="middle" fill="#f4faf7" font-size="10">Jamais de contre-jour aveuglant</text>
  <text x="450" y="225" text-anchor="middle" fill="#e86a6a" font-size="10" font-weight="bold">Éviter 12h-14h (ombres dures sous les yeux)</text>
  <text x="450" y="243" text-anchor="middle" fill="#3fae7a" font-size="9">Privilégier 7h-9h et 16h-18h (Golden Hour)</text>

  <rect x="330" y="275" width="240" height="150" fill="#06100c" stroke="#1b4d3e" rx="6" />
  <text x="345" y="300" fill="#7fb0ee" font-size="11" font-weight="bold">Réflecteur de Fortune au Champ :</text>
  <text x="345" y="322" fill="#f4faf7" font-size="10">• Un carton blanc ou un sac d'engrais blanc propre</text>
  <text x="345" y="342" fill="#f4faf7" font-size="10">• Débouche les ombres sous le menton et le chapeau</text>
  <text x="345" y="365" fill="#d89f3c" font-size="11" font-weight="bold">Verrouillage Exposition (AE/AF Lock) :</text>
  <text x="345" y="385" fill="#f4faf7" font-size="10">• Appui long 2s sur le visage de l'intervenant</text>
  <text x="345" y="405" fill="#88b3a4" font-size="9">Empêche les scintillements dus aux nuages passants</text>

  <!-- Colonne 3 : Prise de Son & Gestion du Vent -->
  <rect x="605" y="75" width="260" height="375" fill="#061a14" stroke="#3fae7a" stroke-width="1.5" rx="8" />
  <text x="620" y="105" fill="#3fae7a" font-size="14" font-weight="bold">3. Prise de Son &amp; Vent Harmattan</text>

  <!-- Box Micro-Cravate -->
  <rect x="620" y="125" width="230" height="135" fill="#0d352b" stroke="#3fae7a" rx="6" />
  <text x="635" y="150" fill="#3fae7a" font-size="12" font-weight="bold">Micro-Cravate Sans Fil :</text>
  <text x="635" y="172" fill="#f4faf7" font-size="11">Distance bouche : <tspan fill="#d89f3c" font-weight="bold">15 à 20 cm</tspan></text>
  <text x="635" y="194" fill="#f4faf7" font-size="11">Fixation : Revers chemise / col</text>
  <text x="635" y="216" fill="#3fae7a" font-size="10" font-weight="bold">Bonnette "Deadcat" (Fourrure) OBLIGATOIRE</text>
  <text x="635" y="236" fill="#88b3a4" font-size="9">Coupe 95 % des rafales d'air et du souffle</text>

  <!-- Les 3 Ennemis du Son au Sahel -->
  <rect x="620" y="275" width="230" height="150" fill="#06100c" stroke="#e86a6a" rx="6" />
  <text x="635" y="300" fill="#e86a6a" font-size="11" font-weight="bold">Les 3 Pièges Audio au Village :</text>
  <text x="635" y="322" fill="#f4faf7" font-size="10">1. Motos (Jakarta / Sanili) qui passent</text>
  <text x="635" y="342" fill="#f4faf7" font-size="10">2. Chant du coq ou aboiements proches</text>
  <text x="635" y="362" fill="#f4faf7" font-size="10">3. Frottement du micro contre le tissu</text>
  <text x="635" y="390" fill="#d89f3c" font-size="10" font-weight="bold">Règle : "Si l'audio est inaudible, la vidéo est morte."</text>
  <text x="635" y="410" fill="#88b3a4" font-size="9">TEAM Sahélia · Recommandation Boya / Hollyland</text>
</svg>