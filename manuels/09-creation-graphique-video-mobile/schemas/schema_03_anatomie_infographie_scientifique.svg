<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="auto" style="background: #06100c; border-radius: 12px; font-family: 'Figtree', sans-serif;">
  <defs>
    <linearGradient id="mediaGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2b24" />
      <stop offset="100%" stop-color="#051410" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="480" fill="url(#mediaGrad3)" rx="12" />
  <rect x="15" y="15" width="870" height="450" fill="none" stroke="#1b4d3e" stroke-width="1.5" rx="8" />

  <!-- Titre -->
  <rect x="15" y="15" width="870" height="45" fill="#0d352b" rx="8" />
  <text x="35" y="44" fill="#3fae7a" font-size="16" font-weight="bold" letter-spacing="1">ANATOMIE D'UNE INFOGRAPHIE AGRONOMIQUE &amp; VULGARISATION VISUELLE</text>

  <!-- Colonne Gauche : Stat Blocks & Chiffres Géants -->
  <rect x="35" y="75" width="400" height="375" fill="#061a14" stroke="#7fb0ee" stroke-width="1.5" rx="8" />
  <text x="50" y="105" fill="#7fb0ee" font-size="15" font-weight="bold">1. Les "Stat Blocks" (Chiffres Clés Géants)</text>
  <text x="50" y="125" fill="#88b3a4" font-size="12">Remplacer un tableau aride par un choc visuel mémorable</text>

  <!-- 2 Cartes de Stat Blocks -->
  <rect x="50" y="145" width="175" height="110" fill="#0d2538" stroke="#7fb0ee" stroke-width="1" rx="6" />
  <text x="65" y="190" fill="#3fae7a" font-size="34" font-weight="bold">+38 %</text>
  <text x="65" y="215" fill="#f4faf7" font-size="11" font-weight="bold">Gain de Rendement</text>
  <text x="65" y="235" fill="#88b3a4" font-size="9">Essai variétal Ina (Bénin)</text>

  <rect x="245" y="145" width="175" height="110" fill="#09291b" stroke="#3fae7a" stroke-width="1" rx="6" />
  <text x="260" y="190" fill="#d89f3c" font-size="34" font-weight="bold">-65 %</text>
  <text x="260" y="215" fill="#f4faf7" font-size="11" font-weight="bold">Pertes de Bouillie</text>
  <text x="260" y="235" fill="#88b3a4" font-size="9">Grâce au drone pulvérisateur</text>

  <!-- Règle d'Or de Vulgarisation -->
  <rect x="50" y="275" width="370" height="160" fill="#06100c" stroke="#1b4d3e" rx="6" />
  <text x="65" y="300" fill="#d89f3c" font-size="12" font-weight="bold">Règles d'Or de la Vulgarisation Scientifique :</text>
  <text x="65" y="322" fill="#f4faf7" font-size="11">• <tspan fill="#3fae7a" font-weight="bold">1 Idée = 1 Visuel :</tspan> Ne surchargez jamais une seule image.</text>
  <text x="65" y="344" fill="#f4faf7" font-size="11">• <tspan fill="#7fb0ee" font-weight="bold">Vocabulaire Paysan :</tspan> "Sacs de 50 kg" plutôt que "quintaux".</text>
  <text x="65" y="366" fill="#f4faf7" font-size="11">• <tspan fill="#e86a6a" font-weight="bold">Pas de Jargon :</tspan> Évitez "p-value &lt; 0.05", dites "Différence prouvée".</text>
  <text x="65" y="392" fill="#3fae7a" font-size="10" font-weight="bold">Le paysan ou le bailleur doit comprendre en 5 secondes.</text>
  <text x="65" y="412" fill="#88b3a4" font-size="9">Source : Faculté d'Agronomie de Parakou · TEAM Sahélia</text>

  <!-- Colonne Droite : L'Infographie Étape par Étape -->
  <rect x="465" y="75" width="400" height="375" fill="#061a14" stroke="#3fae7a" stroke-width="1.5" rx="8" />
  <text x="480" y="105" fill="#3fae7a" font-size="15" font-weight="bold">2. Le Protocole en 3 Étapes Illustrées</text>
  <text x="480" y="125" fill="#88b3a4" font-size="12">Guider l'agriculteur pas à pas pour traiter un ravageur</text>

  <!-- Étape 1 -->
  <rect x="480" y="145" width="370" height="65" fill="#0d2538" stroke="#7fb0ee" rx="4" />
  <circle cx="505" cy="177" r="14" fill="#7fb0ee" />
  <text x="500" y="182" fill="#06100c" font-size="12" font-weight="bold">1</text>
  <text x="530" y="170" fill="#7fb0ee" font-size="11" font-weight="bold">Repérer les Foyers Larvaires :</text>
  <text x="530" y="190" fill="#f4faf7" font-size="10">Inspecter le cornet du maïs tôt le matin (sciure et trous).</text>

  <!-- Étape 2 -->
  <rect x="480" y="220" width="370" height="65" fill="#09291b" stroke="#3fae7a" rx="4" />
  <circle cx="505" cy="252" r="14" fill="#3fae7a" />
  <text x="500" y="257" fill="#06100c" font-size="12" font-weight="bold">2</text>
  <text x="530" y="245" fill="#3fae7a" font-size="11" font-weight="bold">Préparer l'Extrait Bio de Neem :</text>
  <text x="530" y="265" fill="#f4faf7" font-size="10">500 g de feuilles broyées macérées 24h dans 10 L d'eau.</text>

  <!-- Étape 3 -->
  <rect x="480" y="295" width="370" height="65" fill="#0d2e24" stroke="#d89f3c" rx="4" />
  <circle cx="505" cy="327" r="14" fill="#d89f3c" />
  <text x="500" y="332" fill="#06100c" font-size="12" font-weight="bold">3</text>
  <text x="530" y="320" fill="#d89f3c" font-size="11" font-weight="bold">Pulvériser au Cœur du Plant :</text>
  <text x="530" y="340" fill="#f4faf7" font-size="10">Traiter en fin de journée (17h) pour éviter l'évaporation.</text>

  <!-- Cartouche Auteur -->
  <rect x="480" y="375" width="370" height="60" fill="#06100c" stroke="#1b4d3e" rx="4" />
  <text x="495" y="395" fill="#f4faf7" font-size="10">Conception : <tspan fill="#3fae7a" font-weight="bold">Sègla Bio KPEROU &amp; Olivier AREMOU</tspan></text>
  <text x="495" y="415" fill="#88b3a4" font-size="9">Diffusion libre sous licence Creative Commons · TEAM Sahélia</text>
</svg>