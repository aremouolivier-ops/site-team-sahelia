<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="auto" style="background: #09090b; border-radius: 12px; font-family: 'Figtree', sans-serif;">
  <defs>
    <linearGradient id="gradBg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#080a0f" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="900" height="480" fill="url(#gradBg6)" rx="12" />
  <rect x="15" y="15" width="870" height="450" fill="none" stroke="#a855f7" stroke-width="1.5" rx="8" />
  <rect x="15" y="15" width="870" height="45" fill="#581c87" rx="8" />
  <text x="35" y="44" fill="#d8b4fe" font-size="16" font-weight="bold" letter-spacing="1">WORKFLOW DE PRODUCTION VIDÉO DE BOUT EN BOUT PAR IA · TEAM SAHÉLIA</text>

  <!-- Les 5 Étapes du Pipeline -->
  <g transform="translate(35, 80)">
    <!-- Étape 1 -->
    <rect x="0" y="0" width="155" height="220" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" rx="8" />
    <circle cx="25" cy="30" r="14" fill="#6366f1" />
    <text x="21" y="35" fill="#fff" font-size="12" font-weight="bold">1</text>
    <text x="48" y="35" fill="#818cf8" font-size="13" font-weight="bold">Script &amp; Story</text>
    <text x="15" y="65" fill="#cbd5e1" font-size="11">• Idée forte &amp; Hook</text>
    <text x="15" y="85" fill="#cbd5e1" font-size="11">• Découpage 5 plans</text>
    <text x="15" y="105" fill="#cbd5e1" font-size="11">• Voix off timée (60s)</text>
    <rect x="10" y="140" width="135" height="65" fill="#0f172a" rx="4" />
    <text x="15" y="165" fill="#a5b4fc" font-size="10">Outils :</text>
    <text x="15" y="185" fill="#e2e8f0" font-size="10">ChatGPT / Claude</text>

    <!-- Étape 2 -->
    <rect x="170" y="0" width="155" height="220" fill="#311042" stroke="#d946ef" stroke-width="1.5" rx="8" />
    <circle cx="195" cy="30" r="14" fill="#d946ef" />
    <text x="191" y="35" fill="#fff" font-size="12" font-weight="bold">2</text>
    <text x="218" y="35" fill="#f472b6" font-size="13" font-weight="bold">Audio &amp; Voix</text>
    <text x="185" y="65" fill="#cbd5e1" font-size="11">• Voix off ElevenLabs</text>
    <text x="185" y="85" fill="#cbd5e1" font-size="11">• Réduction bruit</text>
    <text x="185" y="105" fill="#cbd5e1" font-size="11">• Export WAV propre</text>
    <rect x="180" y="140" width="135" height="65" fill="#0f172a" rx="4" />
    <text x="185" y="165" fill="#f472b6" font-size="10">Outils :</text>
    <text x="185" y="185" fill="#e2e8f0" font-size="10">ElevenLabs / Audacity</text>

    <!-- Étape 3 -->
    <rect x="340" y="0" width="155" height="220" fill="#064e3b" stroke="#10b981" stroke-width="1.5" rx="8" />
    <circle cx="365" cy="30" r="14" fill="#10b981" />
    <text x="361" y="35" fill="#fff" font-size="12" font-weight="bold">3</text>
    <text x="388" y="35" fill="#34d399" font-size="13" font-weight="bold">Génération IA</text>
    <text x="355" y="65" fill="#cbd5e1" font-size="11">• Image-to-Video (I2V)</text>
    <text x="355" y="85" fill="#cbd5e1" font-size="11">• Prompts caméra précis</text>
    <text x="355" y="105" fill="#cbd5e1" font-size="11">• Upscaling HD</text>
    <rect x="350" y="140" width="135" height="65" fill="#0f172a" rx="4" />
    <text x="355" y="165" fill="#34d399" font-size="10">Outils :</text>
    <text x="355" y="185" fill="#e2e8f0" font-size="10">Midjourney / Runway / Kling</text>

    <!-- Étape 4 -->
    <rect x="510" y="0" width="155" height="220" fill="#431407" stroke="#f97316" stroke-width="1.5" rx="8" />
    <circle cx="535" cy="30" r="14" fill="#f97316" />
    <text x="531" y="35" fill="#fff" font-size="12" font-weight="bold">4</text>
    <text x="558" y="35" fill="#fb923c" font-size="13" font-weight="bold">Montage Pro</text>
    <text x="525" y="65" fill="#cbd5e1" font-size="11">• Calage sur la voix</text>
    <text x="525" y="85" fill="#cbd5e1" font-size="11">• Sous-titres animés</text>
    <text x="525" y="105" fill="#cbd5e1" font-size="11">• Sound design (SFX)</text>
    <rect x="520" y="140" width="135" height="65" fill="#0f172a" rx="4" />
    <text x="525" y="165" fill="#fb923c" font-size="10">Outils :</text>
    <text x="525" y="185" fill="#e2e8f0" font-size="10">CapCut PC / DaVinci</text>

    <!-- Étape 5 -->
    <rect x="680" y="0" width="150" height="220" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5" rx="8" />
    <circle cx="705" cy="30" r="14" fill="#38bdf8" />
    <text x="701" y="35" fill="#fff" font-size="12" font-weight="bold">5</text>
    <text x="728" y="35" fill="#7dd3fc" font-size="13" font-weight="bold">Publication</text>
    <text x="695" y="65" fill="#cbd5e1" font-size="11">• Export 1080x1920</text>
    <text x="695" y="85" fill="#cbd5e1" font-size="11">• Affiche de couverture</text>
    <text x="695" y="105" fill="#cbd5e1" font-size="11">• Diffusion WhatsApp / YT</text>
    <rect x="690" y="140" width="130" height="65" fill="#0f172a" rx="4" />
    <text x="695" y="165" fill="#7dd3fc" font-size="10">Formats :</text>
    <text x="695" y="185" fill="#e2e8f0" font-size="10">Shorts / Reels / YouTube</text>
