  <!-- Boîte Résumé Capstone -->
  <rect x="35" y="325" width="830" height="125" fill="#020617" stroke="#a855f7" stroke-width="1.5" rx="8" />
  <text x="55" y="355" fill="#d8b4fe" font-size="14" font-weight="bold">OBJECTIF DU PROJET CAPSTONE (MANUEL 12) :</text>
  <text x="55" y="380" fill="#cbd5e1" font-size="12">Produire un mini-documentaire percutant de 60 secondes sur l'agriculture intelligente au Sahel + une affiche promotionnelle HD avec titre typographique net, éligible à la certification Open Badge 3.0 Platine TEAM Sahélia.</text>
  <rect x="55" y="400" width="790" height="35" fill="#1e1b4b" rx="4" />
  <text x="70" y="422" fill="#c084fc" font-size="11">🎓 Livrables : Vidéo finale MP4 (9:16 ou 16:9), Storyboard PDF, Fiche technique des prompts C.R.E.D. et Affiche PNG.</text>
</svg>