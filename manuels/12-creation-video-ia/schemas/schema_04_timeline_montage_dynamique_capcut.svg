<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="auto" style="background: #09090b; border-radius: 12px; font-family: 'Figtree', sans-serif;">
  <defs>
    <linearGradient id="gradBg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#08080a" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="900" height="480" fill="url(#gradBg4)" rx="12" />
  <rect x="15" y="15" width="870" height="450" fill="none" stroke="#38bdf8" stroke-width="1.5" rx="8" />
  <rect x="15" y="15" width="870" height="45" fill="#0c4a6e" rx="8" />
  <text x="35" y="44" fill="#7dd3fc" font-size="16" font-weight="bold" letter-spacing="1">STRUCTURE D'UNE TIMELINE MULTIPISTE DYNAMIQUE (CAPCUT / RESOLVE)</text>

  <!-- Timeline Interface -->
  <g transform="translate(35, 75)">
    <!-- Piste 4 : Textes & Sous-titres dynamiques -->
    <rect x="0" y="0" width="160" height="45" fill="#1e293b" rx="4" />
    <text x="15" y="28" fill="#fbbf24" font-size="12" font-weight="bold">T · Sous-titres (Captions)</text>
    <rect x="170" y="0" width="660" height="45" fill="#0f172a" stroke="#334155" rx="4" />
    <rect x="180" y="8" width="140" height="30" fill="#b45309" stroke="#fbbf24" rx="3" />
    <text x="195" y="28" fill="#fef3c7" font-size="11" font-weight="bold">"AUJOURD'HUI..."</text>
    <rect x="330" y="8" width="150" height="30" fill="#b45309" stroke="#fbbf24" rx="3" />
    <text x="345" y="28" fill="#fef3c7" font-size="11" font-weight="bold">"L'AGRICULTURE..."</text>
    <rect x="490" y="8" width="160" height="30" fill="#b45309" stroke="#fbbf24" rx="3" />
    <text x="505" y="28" fill="#fef3c7" font-size="11" font-weight="bold">"CHANGE AVEC L'IA !"</text>
    <rect x="660" y="8" width="160" height="30" fill="#b45309" stroke="#fbbf24" rx="3" />
    <text x="675" y="28" fill="#fef3c7" font-size="11" font-weight="bold">"DÉCOUVREZ COMMENT"</text>

    <!-- Piste 3 : B-Rolls & Visuels Incrustés -->
    <rect x="0" y="55" width="160" height="45" fill="#1e293b" rx="4" />
    <text x="15" y="83" fill="#f472b6" font-size="12" font-weight="bold">V2 · Incrustations &amp; B-Rolls</text>
    <rect x="170" y="55" width="660" height="45" fill="#0f172a" stroke="#334155" rx="4" />
    <rect x="220" y="63" width="180" height="30" fill="#831843" stroke="#f472b6" rx="3" />
    <text x="235" y="83" fill="#fce7f3" font-size="11">[ Drone Survol Maïs ]</text>
    <rect x="440" y="63" width="190" height="30" fill="#831843" stroke="#f472b6" rx="3" />
    <text x="455" y="83" fill="#fce7f3" font-size="11">[ Graphique Statistique IA ]</text>
    <rect x="650" y="63" width="170" height="30" fill="#831843" stroke="#f472b6" rx="3" />
    <text x="665" y="83" fill="#fce7f3" font-size="11">[ Carte NDVI Parakou ]</text>

    <!-- Piste 2 : Vidéo Principale (A-Roll / Avatar / Sujet) -->
    <rect x="0" y="110" width="160" height="65" fill="#1e293b" rx="4" />
    <text x="15" y="145" fill="#38bdf8" font-size="12" font-weight="bold">V1 · Sujet Principal (A-Roll)</text>
    <text x="15" y="162" fill="#94a3b8" font-size="10">(Avatar ou Face Caméra)</text>
    <rect x="170" y="110" width="660" height="65" fill="#0f172a" stroke="#334155" rx="4" />
    <rect x="175" y="116" width="200" height="52" fill="#0369a1" stroke="#38bdf8" rx="3" />
    <text x="190" y="147" fill="#f0f9ff" font-size="11" font-weight="bold">Plan 1 : Hook (0 à 3s)</text>
    <rect x="380" y="116" width="230" height="52" fill="#0369a1" stroke="#38bdf8" rx="3" />
    <text x="395" y="147" fill="#f0f9ff" font-size="11" font-weight="bold">Plan 2 : Problème &amp; Solution</text>
    <rect x="615" y="116" width="210" height="52" fill="#0369a1" stroke="#38bdf8" rx="3" />
    <text x="630" y="147" fill="#f0f9ff" font-size="11" font-weight="bold">Plan 3 : Call To Action</text>

    <!-- Piste 1 : Audio Voix Off Principal -->
    <rect x="0" y="185" width="160" height="45" fill="#1e293b" rx="4" />
    <text x="15" y="213" fill="#34d399" font-size="12" font-weight="bold">A1 · Voix Off (Dialogue)</text>
    <rect x="170" y="185" width="660" height="45" fill="#0f172a" stroke="#334155" rx="4" />
    <rect x="175" y="192" width="645" height="30" fill="#065f46" stroke="#34d399" rx="3" />
    <text x="190" y="212" fill="#ecfdf5" font-size="11">[ Onde Sonore Voix ElevenLabs / Micro Cravate ] — Niveau : -6 dB à -3 dB Crête</text>

    <!-- Piste 0 : Musique & Effets SFX -->
    <rect x="0" y="240" width="160" height="45" fill="#1e293b" rx="4" />
    <text x="15" y="268" fill="#c084fc" font-size="12" font-weight="bold">A2 · Musique &amp; SFX</text>
    <rect x="170" y="240" width="660" height="45" fill="#0f172a" stroke="#334155" rx="4" />
    <rect x="175" y="247" width="645" height="30" fill="#581c87" stroke="#c084fc" rx="3" />
    <text x="190" y="267" fill="#faf5ff" font-size="11">[ Musique Ambiance ] -22 dB  |  (Pop!)  |  (Whoosh Transition)  |  (Cloche Validation)</text>
  </g>

  <!-- Guide de Rythme Inférieur -->
  <rect x="35" y="375" width="830" height="75" fill="#020617" stroke="#64748b" stroke-width="1" rx="6" />
  <text x="55" y="400" fill="#f8fafc" font-size="13" font-weight="bold">LES 3 RÈGLES DU MONTAGE COURT (TIKTOK / REELS / SHORTS 9:16) :</text>
  <text x="55" y="420" fill="#94a3b8" font-size="11">1. <tspan fill="#fbbf24" font-weight="bold">Cut serré :</tspan> Supprimer toutes les respirations et hésitations (&gt; 0.3s).</text>
  <text x="340" y="420" fill="#94a3b8" font-size="11">2. <tspan fill="#fbbf24" font-weight="bold">Changement visuel :</tspan> Un nouveau plan ou zoom toutes les 2,5 à 4s.</text>
  <text x="680" y="420" fill="#94a3b8" font-size="11">3. <tspan fill="#fbbf24" font-weight="bold">SFX :</tspan> 1 bruitage à chaque texte.</text>
</svg>