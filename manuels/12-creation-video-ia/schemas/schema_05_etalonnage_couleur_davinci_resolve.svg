<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="auto" style="background: #09090b; border-radius: 12px; font-family: 'Figtree', sans-serif;">
  <defs>
    <linearGradient id="gradBg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#0a0808" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="900" height="480" fill="url(#gradBg5)" rx="12" />
  <rect x="15" y="15" width="870" height="450" fill="none" stroke="#f59e0b" stroke-width="1.5" rx="8" />
  <rect x="15" y="15" width="870" height="45" fill="#78350f" rx="8" />
  <text x="35" y="44" fill="#fde68a" font-size="16" font-weight="bold" letter-spacing="1">L'ÉTALONNAGE COULEUR PROFESSIONNEL AVEC DAVINCI RESOLVE · TEAM SAHÉLIA</text>

  <!-- 3 Cercles Chromatiques (Lift, Gamma, Gain) -->
  <g transform="translate(50, 80)">
    <!-- Lift / Noirs -->
    <circle cx="100" cy="90" r="65" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <circle cx="100" cy="90" r="8" fill="#38bdf8" />
    <text x="100" y="175" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="bold">LIFT (Tons Sombres)</text>
    <text x="100" y="195" text-anchor="middle" fill="#94a3b8" font-size="11">Ajuste le niveau des noirs.</text>
    <text x="100" y="210" text-anchor="middle" fill="#cbd5e1" font-size="10">Empêche de boucher les ombres.</text>

    <!-- Gamma / Médiums -->
    <circle cx="280" cy="90" r="65" fill="#1e293b" stroke="#10b981" stroke-width="2" />
    <circle cx="280" cy="90" r="8" fill="#10b981" />
    <text x="280" y="175" text-anchor="middle" fill="#10b981" font-size="14" font-weight="bold">GAMMA (Tons Moyens)</text>
    <text x="280" y="195" text-anchor="middle" fill="#94a3b8" font-size="11">Gère l'exposition de la peau,</text>
    <text x="280" y="210" text-anchor="middle" fill="#cbd5e1" font-size="10">de la végétation et du décor.</text>

    <!-- Gain / Blancs -->
    <circle cx="460" cy="90" r="65" fill="#1e293b" stroke="#f59e0b" stroke-width="2" />
    <circle cx="460" cy="90" r="8" fill="#f59e0b" />
    <text x="460" y="175" text-anchor="middle" fill="#f59e0b" font-size="14" font-weight="bold">GAIN (Hautes Lumières)</text>
    <text x="460" y="195" text-anchor="middle" fill="#94a3b8" font-size="11">Règle la luminosité du ciel,</text>
    <text x="460" y="210" text-anchor="middle" fill="#cbd5e1" font-size="10">évite de cramer le soleil sahélien.</text>

    <!-- Boîte Oscilloscope Waveform à droite -->
    <rect x="570" y="15" width="240" height="185" fill="#020617" stroke="#475569" stroke-width="1.5" rx="6" />
    <text x="585" y="38" fill="#94a3b8" font-size="12" font-weight="bold">OSCILLOSCOPE WAVEFORM</text>
    <line x1="585" y1="60" x2="795" y2="60" stroke="#ef4444" stroke-width="1" stroke-dasharray="2,2" />
    <text x="800" y="63" fill="#ef4444" font-size="9">1023 (Cramé)</text>
    <line x1="585" y1="160" x2="795" y2="160" stroke="#3b82f6" stroke-width="1" stroke-dasharray="2,2" />
    <text x="800" y="163" fill="#3b82f6" font-size="9">0 (Bouché)</text>
    <!-- Tracé de signal vert -->
    <path d="M 590,140 Q 620,110 650,130 T 710,90 T 780,120" fill="none" stroke="#22c55e" stroke-width="2" />
    <text x="585" y="185" fill="#22c55e" font-size="10">✓ Signal équilibré entre 128 et 896</text>
  </g>

  <!-- Chaîne des Nœuds DaVinci en bas -->
  <g transform="translate(50, 310)">
    <rect x="0" y="0" width="800" height="135" fill="#0f172a" stroke="#64748b" stroke-width="1.5" rx="8" />
    <text x="20" y="25" fill="#38bdf8" font-size="13" font-weight="bold">CHAÎNE DE NŒUDS CHROMATIQUES (NODE TREE) RECOMMANDÉE :</text>
    
    <!-- Nœud 1 -->
    <rect x="20" y="45" width="135" height="65" fill="#1e293b" stroke="#38bdf8" rx="4" />
    <text x="30" y="68" fill="#f8fafc" font-size="11" font-weight="bold">Nœud 1 : Balance</text>
    <text x="30" y="88" fill="#94a3b8" font-size="10">Temp / Tint &amp; Expo</text>

    <line x1="155" y1="77" x2="185" y2="77" stroke="#f59e0b" stroke-width="2" />

    <!-- Nœud 2 -->
    <rect x="185" y="45" width="135" height="65" fill="#1e293b" stroke="#10b981" rx="4" />
    <text x="195" y="68" fill="#f8fafc" font-size="11" font-weight="bold">Nœud 2 : Contraste</text>
    <text x="195" y="88" fill="#94a3b8" font-size="10">Courbe S &amp; Pivot</text>

    <line x1="320" y1="77" x2="350" y2="77" stroke="#f59e0b" stroke-width="2" />

    <!-- Nœud 3 -->
    <rect x="350" y="45" width="135" height="65" fill="#1e293b" stroke="#f59e0b" rx="4" />
    <text x="360" y="68" fill="#f8fafc" font-size="11" font-weight="bold">Nœud 3 : Teint Peau</text>
    <text x="360" y="88" fill="#94a3b8" font-size="10">Qualifier Teinte chair</text>

    <line x1="485" y1="77" x2="515" y2="77" stroke="#f59e0b" stroke-width="2" />

    <!-- Nœud 4 -->
    <rect x="515" y="45" width="135" height="65" fill="#1e293b" stroke="#ec4899" rx="4" />
    <text x="525" y="68" fill="#f8fafc" font-size="11" font-weight="bold">Nœud 4 : LUT / Look</text>
    <text x="525" y="88" fill="#94a3b8" font-size="10">Film Print Emulation</text>

    <line x1="650" y1="77" x2="680" y2="77" stroke="#f59e0b" stroke-width="2" />

    <!-- Nœud 5 -->
    <rect x="680" y="45" width="100" height="65" fill="#1e293b" stroke="#8b5cf6" rx="4" />
    <text x="690" y="68" fill="#f8fafc" font-size="11" font-weight="bold">Nœud 5</text>
    <text x="690" y="88" fill="#94a3b8" font-size="10">Grain Film</text>
  </g>
</svg>