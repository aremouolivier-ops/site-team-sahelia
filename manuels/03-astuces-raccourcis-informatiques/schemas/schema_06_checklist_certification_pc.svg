<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="auto" style="background: #06100c; border-radius: 12px; font-family: 'Figtree', sans-serif;">
  <defs>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2b24" />
      <stop offset="100%" stop-color="#051410" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="480" fill="url(#checkGrad)" rx="12" />
  <rect x="15" y="15" width="870" height="450" fill="none" stroke="#1b4d3e" stroke-width="1.5" rx="8" />

  <!-- Titre -->
  <rect x="15" y="15" width="870" height="45" fill="#0d352b" rx="8" />
  <text x="35" y="44" fill="#3fae7a" font-size="16" font-weight="bold" letter-spacing="1">CHECKLIST D'AUDIT & AUTOMATISATION PC PRO · TEAM SAHÉLIA</text>

  <!-- Colonne Gauche : Checklist des 20 Critères d'Évaluation -->
  <rect x="35" y="75" width="400" height="375" fill="#061a14" stroke="#3fae7a" stroke-width="1.5" rx="8" />
  <text x="50" y="105" fill="#3fae7a" font-size="15" font-weight="bold">Grille d'Audit du Poste de Travail</text>
  <text x="50" y="125" fill="#88b3a4" font-size="12">Score cible de certification : 80 / 100 points minimum</text>

  <!-- Piler 1 -->
  <rect x="50" y="145" width="370" height="65" fill="#0d352b" rx="6" />
  <text x="65" y="167" fill="#3fae7a" font-size="12" font-weight="bold">1. Hygiène Disque & Système (25 pts)</text>
  <text x="65" y="185" fill="#f4faf7" font-size="11">☑ Au moins 20% d'espace libre sur le lecteur C:\</text>
  <text x="65" y="201" fill="#88b3a4" font-size="10">☑ Dossiers %temp% et cache cleanmgr purgés</text>

  <!-- Piler 2 -->
  <rect x="50" y="218" width="370" height="65" fill="#0d352b" rx="6" />
  <text x="65" y="240" fill="#7fb0ee" font-size="12" font-weight="bold">2. Organisation & Sauvegarde (25 pts)</text>
  <text x="65" y="258" fill="#f4faf7" font-size="11">☑ Arborescence 4 piliers respectée sur le disque D:\</text>
  <text x="65" y="274" fill="#88b3a4" font-size="10">☑ Règle de sauvegarde 3-2-1 active (Cloud synchronisé)</text>

  <!-- Piler 3 -->
  <rect x="50" y="291" width="370" height="65" fill="#0d352b" rx="6" />
  <text x="65" y="313" fill="#e8946a" font-size="12" font-weight="bold">3. Sécurité & Clés USB (25 pts)</text>
  <text x="65" y="331" fill="#f4faf7" font-size="11">☑ Dossier de vaccination autorun.inf présent sur la clé</text>
  <text x="65" y="347" fill="#88b3a4" font-size="10">☑ Double authentification (2FA) active sur les emails</text>

  <!-- Piler 4 -->
  <rect x="50" y="364" width="370" height="65" fill="#0d352b" rx="6" />
  <text x="65" y="386" fill="#88b3a4" font-size="12" font-weight="bold">4. Vitesse & Productivité Clavier (25 pts)</text>
  <text x="65" y="404" fill="#f4faf7" font-size="11">☑ Historique presse-papier Win+V activé</text>
  <text x="65" y="420" fill="#88b3a4" font-size="10">☑ Applications inutiles au démarrage désactivées</text>

  <!-- Colonne Droite : Script d'Automatisation 1-Clic -->
  <rect x="465" y="75" width="400" height="375" fill="#061a14" stroke="#7fb0ee" stroke-width="1.5" rx="8" />
  <text x="480" y="105" fill="#7fb0ee" font-size="15" font-weight="bold">Automatisation en 1 Clic (Script Batch)</text>
  <text x="480" y="125" fill="#88b3a4" font-size="12">Fichier maintenance_sahelia.bat à exécuter chaque semaine</text>

  <!-- Code Script Box -->
  <rect x="480" y="145" width="370" height="185" fill="#06100c" stroke="#1b4d3e" rx="6" />
  <text x="495" y="168" fill="#e8946a" font-size="11" font-family="monospace">@echo off</text>
  <text x="495" y="188" fill="#88b3a4" font-size="11" font-family="monospace">echo TEAM SAHELIA - MAINTENANCE EXPRESS</text>
  <text x="495" y="208" fill="#3fae7a" font-size="11" font-family="monospace">del /q /f /s "%temp%\*.*" >nul 2>&amp;1</text>
  <text x="495" y="228" fill="#3fae7a" font-size="11" font-family="monospace">del /q /f /s "C:\Windows\Temp\*.*" >nul 2>&amp;1</text>
  <text x="495" y="248" fill="#7fb0ee" font-size="11" font-family="monospace">ipconfig /flushdns >nul</text>
  <text x="495" y="268" fill="#f4faf7" font-size="11" font-family="monospace">sfc /scannow</text>
  <text x="495" y="288" fill="#88b3a4" font-size="11" font-family="monospace">echo Nettoyage termine avec succes !</text>
  <text x="495" y="308" fill="#e8946a" font-size="11" font-family="monospace">pause</text>

  <!-- Encart Badge -->
  <rect x="480" y="340" width="370" height="95" fill="#0d352b" stroke="#3fae7a" rx="6" />
  <text x="495" y="363" fill="#3fae7a" font-size="12" font-weight="bold">Badge Officiel : TS-SKL-2026-003</text>
  <text x="495" y="383" fill="#f4faf7" font-size="11">Certificat "Productivité &amp; Maintenance PC Pro"</text>
  <text x="495" y="401" fill="#88b3a4" font-size="10">Délivré par le Conseil Académique de TEAM Sahélia</text>
  <text x="495" y="419" fill="#e8946a" font-size="10">Attribué après validation de la checklist d'audit à 80/100.</text>
</svg>
