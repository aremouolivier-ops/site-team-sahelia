<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="auto" style="background: #06100c; border-radius: 12px; font-family: 'Figtree', sans-serif;">
  <defs>
    <linearGradient id="techGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2b24" />
      <stop offset="100%" stop-color="#051410" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="480" fill="url(#techGrad)" rx="12" />
  <rect x="15" y="15" width="870" height="450" fill="none" stroke="#1b4d3e" stroke-width="1.5" rx="8" />

  <!-- Titre -->
  <rect x="15" y="15" width="870" height="45" fill="#0d352b" rx="8" />
  <text x="35" y="44" fill="#3fae7a" font-size="16" font-weight="bold" letter-spacing="1">LES TOUCHES DE PRODUCTIVITÉ ABSOLUE · TEAM SAHÉLIA</text>

  <!-- Bloc 1 : Presse-Papier Multiples (Win + V) -->
  <rect x="35" y="80" width="400" height="165" fill="#061a14" stroke="#3fae7a" stroke-width="1.5" rx="8" />
  <rect x="50" y="95" width="90" height="32" fill="#0d352b" stroke="#3fae7a" rx="4" />
  <text x="60" y="117" fill="#f4faf7" font-size="13" font-weight="bold">Win + V</text>
  <text x="155" y="116" fill="#3fae7a" font-size="14" font-weight="bold">Historique Presse-Papier</text>
  <text x="50" y="148" fill="#88b3a4" font-size="12">Garde en mémoire les 25 derniers éléments copiés.</text>
  <text x="50" y="172" fill="#88b3a4" font-size="12">Permet de coller du texte, des tableaux et des images</text>
  <text x="50" y="195" fill="#88b3a4" font-size="12">sans écraser la valeur précédente !</text>
  <text x="50" y="225" fill="#e8946a" font-size="11" font-weight="bold">✓ Activation obligatoire : Paramètres > Système > Presse-papiers</text>

  <!-- Bloc 2 : Capture d'Écran Pro (Win + Maj + S) -->
  <rect x="465" y="80" width="400" height="165" fill="#061a14" stroke="#7fb0ee" stroke-width="1.5" rx="8" />
  <rect x="480" y="95" width="135" height="32" fill="#0d352b" stroke="#7fb0ee" rx="4" />
  <text x="490" y="117" fill="#f4faf7" font-size="13" font-weight="bold">Win + Maj + S</text>
  <text x="630" y="116" fill="#7fb0ee" font-size="14" font-weight="bold">Capture de Zone Précise</text>
  <text x="480" y="148" fill="#88b3a4" font-size="12">Découpe un rectangle net sur l'écran en 1 seconde.</text>
  <text x="480" y="172" fill="#88b3a4" font-size="12">L'image va directement dans le presse-papier.</text>
  <text x="480" y="195" fill="#88b3a4" font-size="12">Collez avec Ctrl + V dans Word ou WhatsApp sans enregistrer.</text>
  <text x="480" y="225" fill="#e8946a" font-size="11" font-weight="bold">✓ Finies les photos floues d'écran prises au smartphone !</text>

  <!-- Bloc 3 : Gestionnaire de Tâches d'Urgence (Ctrl + Maj + Échap) -->
  <rect x="35" y="265" width="400" height="165" fill="#061a14" stroke="#e8946a" stroke-width="1.5" rx="8" />
  <rect x="50" y="280" width="160" height="32" fill="#0d352b" stroke="#e8946a" rx="4" />
  <text x="58" y="302" fill="#f4faf7" font-size="13" font-weight="bold">Ctrl + Maj + Échap</text>
  <text x="225" y="301" fill="#e8946a" font-size="14" font-weight="bold">Sortie de Bug Directe</text>
  <text x="50" y="333" fill="#88b3a4" font-size="12">Ouvre le Gestionnaire des tâches en accès prioritaire.</text>
  <text x="50" y="357" fill="#88b3a4" font-size="12">Tue une application bloquée (ex: Word ou QGIS figé).</text>
  <text x="50" y="380" fill="#88b3a4" font-size="12">Sans passer par l'écran bleu lent de Ctrl+Alt+Suppr.</text>
  <text x="50" y="410" fill="#3fae7a" font-size="11" font-weight="bold">✓ Sauve votre session lors des gros traitements de données</text>

  <!-- Bloc 4 : Verrouillage Rapide & Bureaux Virtuels -->
  <rect x="465" y="265" width="400" height="165" fill="#061a14" stroke="#1b4d3e" stroke-width="1.5" rx="8" />
  <rect x="480" y="280" width="80" height="32" fill="#0d352b" stroke="#88b3a4" rx="4" />
  <text x="495" y="302" fill="#f4faf7" font-size="13" font-weight="bold">Win + L</text>
  <text x="575" y="301" fill="#f4faf7" font-size="14" font-weight="bold">Verrouillage Instantané</text>
  <text x="480" y="333" fill="#88b3a4" font-size="12">Verrouille le PC dès que vous quittez votre bureau.</text>
  <text x="480" y="357" fill="#88b3a4" font-size="12">Vos fichiers restent ouverts et protégés des curieux.</text>
  <text x="480" y="380" fill="#7fb0ee" font-size="12">Win + Ctrl + D : Crée un deuxième écran virtuel indépendant.</text>
  <text x="480" y="410" fill="#e8946a" font-size="11" font-weight="bold">✓ Séparez vos études, recherches et détente en 1 clic</text>
</svg>