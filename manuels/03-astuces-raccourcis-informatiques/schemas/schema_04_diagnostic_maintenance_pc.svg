<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="auto" style="background: #06100c; border-radius: 12px; font-family: 'Figtree', sans-serif;">
  <defs>
    <linearGradient id="diagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2b24" />
      <stop offset="100%" stop-color="#051410" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="480" fill="url(#diagGrad)" rx="12" />
  <rect x="15" y="15" width="870" height="450" fill="none" stroke="#1b4d3e" stroke-width="1.5" rx="8" />

  <!-- Titre -->
  <rect x="15" y="15" width="870" height="45" fill="#0d352b" rx="8" />
  <text x="35" y="44" fill="#3fae7a" font-size="16" font-weight="bold" letter-spacing="1">DIAGNOSTIC, MAINTENANCE & ACCÉLÉRATION PC · TEAM SAHÉLIA</text>

  <!-- Colonne Gauche : Les 4 Piliers d'Accélération Sans Formater -->
  <rect x="35" y="75" width="400" height="375" fill="#061a14" stroke="#3fae7a" stroke-width="1.5" rx="8" />
  <text x="50" y="105" fill="#3fae7a" font-size="15" font-weight="bold">Les 4 Verrous d'un PC Lent</text>
  <text x="50" y="125" fill="#88b3a4" font-size="12">90% des lenteurs se règlent sans réinstaller Windows</text>

  <!-- Verrou 1 -->
  <rect x="50" y="145" width="370" height="68" fill="#0d352b" stroke="#3fae7a" rx="6" />
  <text x="65" y="168" fill="#f4faf7" font-size="13" font-weight="bold">1. Logiciels au Démarrage (Boot Asphyxié)</text>
  <text x="65" y="188" fill="#88b3a4" font-size="11">Ctrl+Maj+Échap > Onglet Démarrage > Désactiver Spotify, Teams, etc.</text>
  <text x="65" y="204" fill="#3fae7a" font-size="10" font-weight="bold">✓ Gain : Démarrage de Windows 3x plus rapide</text>

  <!-- Verrou 2 -->
  <rect x="50" y="221" width="370" height="68" fill="#0d352b" stroke="#7fb0ee" rx="6" />
  <text x="65" y="244" fill="#f4faf7" font-size="13" font-weight="bold">2. Fichiers Poubelles Invisibles (10 à 30 Go)</text>
  <text x="65" y="264" fill="#88b3a4" font-size="11">Win+R > Taper %temp% et cleanmgr > Vider le cache des mises à jour.</text>
  <text x="65" y="280" fill="#7fb0ee" font-size="10" font-weight="bold">✓ Gain : Libère instantanément le disque SSD C:\</text>

  <!-- Verrou 3 -->
  <rect x="50" y="297" width="370" height="68" fill="#0d352b" stroke="#e8946a" rx="6" />
  <text x="65" y="320" fill="#f4faf7" font-size="13" font-weight="bold">3. Fichiers Systèmes Windows Corrompus</text>
  <text x="65" y="340" fill="#88b3a4" font-size="11">CMD en Administrateur > Taper sfc /scannow</text>
  <text x="65" y="356" fill="#e8946a" font-size="10" font-weight="bold">✓ Gain : Répare les plantages d'écran bleu et freezes</text>

  <!-- Verrou 4 -->
  <rect x="50" y="373" width="370" height="65" fill="#0d352b" stroke="#88b3a4" rx="6" />
  <text x="65" y="394" fill="#f4faf7" font-size="12" font-weight="bold">4. Mode de Gestion d'Alimentation</text>
  <text x="65" y="412" fill="#88b3a4" font-size="11">Panneau de config > Options d'alimentation > Performances élevées.</text>
  <text x="65" y="428" fill="#3fae7a" font-size="10" font-weight="bold">✓ Gain : Débloque la vitesse maximale du processeur</text>

  <!-- Colonne Droite : Arbre Décisionnel des Urgences -->
  <rect x="465" y="75" width="400" height="375" fill="#061a14" stroke="#7fb0ee" stroke-width="1.5" rx="8" />
  <text x="480" y="105" fill="#7fb0ee" font-size="15" font-weight="bold">Arbre Décisionnel de Dépannage Immédiat</text>
  <text x="480" y="125" fill="#88b3a4" font-size="12">Que faire concrètement face à chaque situation ?</text>

  <!-- Cas 1 -->
  <rect x="480" y="145" width="370" height="75" fill="#08221a" stroke="#1b4d3e" rx="6" />
  <text x="495" y="168" fill="#ff7b72" font-size="12" font-weight="bold">PROBLÈME 1 : Un logiciel freeze ("Ne répond pas")</text>
  <text x="495" y="188" fill="#88b3a4" font-size="11">❌ Ne jamais appuyer sur le bouton d'alimentation du PC !</text>
  <text x="495" y="206" fill="#3fae7a" font-size="11" font-weight="bold">➜ Solution : Ctrl + Maj + Échap > Fin de tâche sur l'application.</text>

  <!-- Cas 2 -->
  <rect x="480" y="230" width="370" height="75" fill="#08221a" stroke="#1b4d3e" rx="6" />
  <text x="495" y="253" fill="#ff7b72" font-size="12" font-weight="bold">PROBLÈME 2 : La barre rouge du disque C: apparaît</text>
  <text x="495" y="273" fill="#88b3a4" font-size="11">❌ Ne jamais supprimer des fichiers au hasard dans Windows !</text>
  <text x="495" y="291" fill="#7fb0ee" font-size="11" font-weight="bold">➜ Solution : Win + R > cleanmgr > Nettoyer les fichiers système.</text>

  <!-- Cas 3 -->
  <rect x="480" y="315" width="370" height="75" fill="#08221a" stroke="#1b4d3e" rx="6" />
  <text x="495" y="338" fill="#ff7b72" font-size="12" font-weight="bold">PROBLÈME 3 : Clavier qui inverse A/Q ou W/Z (AZERTY/QWERTY)</text>
  <text x="495" y="358" fill="#88b3a4" font-size="11">Ce n'est pas un virus, la langue a sauté par inadvertance.</text>
  <text x="495" y="376" fill="#e8946a" font-size="11" font-weight="bold">➜ Solution : Pressez Alt + Maj ou Win + Espace pour rétablir.</text>

  <!-- Footer Astuce -->
  <rect x="480" y="400" width="370" height="40" fill="#0d352b" rx="6" />
  <text x="495" y="425" fill="#f4faf7" font-size="11" font-weight="bold">Commande santé disque dur : wmic diskdrive get status</text>
</svg>
