<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="auto" style="background: #06100c; border-radius: 12px; font-family: 'Figtree', sans-serif;">
  <defs>
    <linearGradient id="droneGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2b24" />
      <stop offset="100%" stop-color="#051410" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="480" fill="url(#droneGrad2)" rx="12" />
  <rect x="15" y="15" width="870" height="450" fill="none" stroke="#1b4d3e" stroke-width="1.5" rx="8" />

  <!-- Titre -->
  <rect x="15" y="15" width="870" height="45" fill="#0d352b" rx="8" />
  <text x="35" y="44" fill="#3fae7a" font-size="16" font-weight="bold" letter-spacing="1">RADIOCOMMANDE EN MODE 2 &amp; CINÉMATIQUE DE VOL DU DRONE · QGIS / PILOTAGE</text>

  <!-- Colonne Gauche : Manche Gauche (Throttle & Yaw) -->
  <rect x="35" y="75" width="400" height="375" fill="#061a14" stroke="#7fb0ee" stroke-width="1.5" rx="8" />
  <text x="50" y="105" fill="#7fb0ee" font-size="15" font-weight="bold">Manche Gauche : Altitude &amp; Pivot</text>
  <text x="50" y="125" fill="#88b3a4" font-size="12">Gère la hauteur sol et l'orientation cardinale du nez du drone</text>

  <!-- Simulation Joystick Gauche -->
  <rect x="50" y="145" width="370" height="150" fill="#0d2538" stroke="#7fb0ee" rx="6" />
  
  <circle cx="235" cy="220" r="50" fill="#06100c" stroke="#1b4d3e" stroke-width="2" />
  <!-- Croix joystick -->
  <line x1="235" y1="180" x2="235" y2="260" stroke="#7fb0ee" stroke-width="2" />
  <line x1="195" y1="220" x2="275" y2="220" stroke="#7fb0ee" stroke-width="2" />
  <!-- Pommeau joystick -->
  <circle cx="235" cy="220" r="14" fill="#3fae7a" stroke="#ffffff" stroke-width="1.5" />

  <!-- Flèches et étiquettes Gauche -->
  <text x="220" y="172" fill="#3fae7a" font-size="11" font-weight="bold">▲ MONTER</text>
  <text x="210" y="278" fill="#e86a6a" font-size="11" font-weight="bold">▼ DESCENDRE</text>
  <text x="70" y="215" fill="#7fb0ee" font-size="11" font-weight="bold">⮌ PIVOT GAUCHE</text>
  <text x="290" y="215" fill="#7fb0ee" font-size="11" font-weight="bold">PIVOT DROITE ⮎</text>
  <text x="70" y="232" fill="#88b3a4" font-size="10">(Lacet anti-horaire)</text>
  <text x="290" y="232" fill="#88b3a4" font-size="10">(Lacet horaire)</text>

  <!-- Descriptif Fonctionnel Gauche -->
  <rect x="50" y="305" width="370" height="130" fill="#06100c" stroke="#1b4d3e" rx="6" />
  <text x="65" y="328" fill="#7fb0ee" font-size="12" font-weight="bold">Les 2 Actions du Manche Gauche :</text>
  <text x="65" y="350" fill="#f4faf7" font-size="11">1. <tspan fill="#3fae7a" font-weight="bold">GAZ (Throttle) :</tspan> Plus de puissance ➔ le drone s'élève.</text>
  <text x="65" y="372" fill="#f4faf7" font-size="11">2. <tspan fill="#7fb0ee" font-weight="bold">LACET (Yaw) :</tspan> Fait pivoter la caméra vers le Nord, Sud,</text>
  <text x="65" y="392" fill="#f4faf7" font-size="11">   Est ou Ouest sans changer de position dans l'espace.</text>
  <text x="65" y="415" fill="#d89f3c" font-size="10" font-weight="bold">Au repos : Le joystick revient au centre = vol stationnaire.</text>

  <!-- Colonne Droite : Manche Droit (Pitch & Roll) -->
  <rect x="465" y="75" width="400" height="375" fill="#061a14" stroke="#3fae7a" stroke-width="1.5" rx="8" />
  <text x="480" y="105" fill="#3fae7a" font-size="15" font-weight="bold">Manche Droit : Déplacement Translationnel</text>
  <text x="480" y="125" fill="#88b3a4" font-size="12">Gère la trajectoire horizontale dans le plan de la parcelle</text>

  <!-- Simulation Joystick Droit -->
  <rect x="480" y="145" width="370" height="150" fill="#09291b" stroke="#3fae7a" stroke-width="1" rx="6" />
  
  <circle cx="665" cy="220" r="50" fill="#06100c" stroke="#1b4d3e" stroke-width="2" />
  <!-- Croix joystick -->
  <line x1="665" y1="180" x2="665" y2="260" stroke="#3fae7a" stroke-width="2" />
  <line x1="625" y1="220" x2="705" y2="220" stroke="#3fae7a" stroke-width="2" />
  <!-- Pommeau joystick -->
  <circle cx="665" cy="220" r="14" fill="#7fb0ee" stroke="#ffffff" stroke-width="1.5" />

  <!-- Flèches et étiquettes Droite -->
  <text x="645" y="172" fill="#3fae7a" font-size="11" font-weight="bold">▲ AVANCER</text>
  <text x="645" y="278" fill="#e86a6a" font-size="11" font-weight="bold">▼ RECULER</text>
  <text x="500" y="215" fill="#3fae7a" font-size="11" font-weight="bold">◄ GLISSER GAUCHE</text>
  <text x="720" y="215" fill="#3fae7a" font-size="11" font-weight="bold">GLISSER DROITE ►</text>
  <text x="500" y="232" fill="#88b3a4" font-size="10">(Roulis / Roll)</text>
  <text x="720" y="232" fill="#88b3a4" font-size="10">(Roulis / Roll)</text>

  <!-- Descriptif Fonctionnel Droite -->
  <rect x="480" y="305" width="370" height="130" fill="#06100c" stroke="#1b4d3e" rx="6" />
  <text x="495" y="328" fill="#3fae7a" font-size="12" font-weight="bold">Les 2 Actions du Manche Droit :</text>
  <text x="495" y="350" fill="#f4faf7" font-size="11">1. <tspan fill="#3fae7a" font-weight="bold">TANGAGE (Pitch) :</tspan> Penche le nez vers l'avant pour avancer</text>
  <text x="495" y="370" fill="#f4faf7" font-size="11">   ou vers l'arrière pour freiner et reculer.</text>
  <text x="495" y="390" fill="#7fb0ee" font-size="11">2. <tspan fill="#7fb0ee" font-weight="bold">ROULIS (Roll) :</tspan> Déplacement latéral en crabe (gauche/droite).</text>
  <text x="495" y="415" fill="#e8946a" font-size="10" font-weight="bold">Bouton RTH d'urgence : Le drone remonte et revient à vos pieds !</text>
</svg>