<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="auto" style="background: #06100c; border-radius: 12px; font-family: 'Figtree', sans-serif;">
  <defs>
    <linearGradient id="droneGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2b24" />
      <stop offset="100%" stop-color="#051410" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="480" fill="url(#droneGrad6)" rx="12" />
  <rect x="15" y="15" width="870" height="450" fill="none" stroke="#1b4d3e" stroke-width="1.5" rx="8" />

  <!-- Titre -->
  <rect x="15" y="15" width="870" height="45" fill="#0d352b" rx="8" />
  <text x="35" y="44" fill="#3fae7a" font-size="16" font-weight="bold" letter-spacing="1">BOUCLE INTÉGRÉE D'AGRICULTURE DE PRÉCISION PAR DRONE &amp; SIG · TEAM SAHÉLIA</text>

  <!-- Cycle en 4 Étapes Connectées -->

  <!-- Étape 1 : Diagnostic Drone Carto -->
  <rect x="35" y="80" width="195" height="230" fill="#061a14" stroke="#7fb0ee" stroke-width="1.5" rx="6" />
  <text x="45" y="105" fill="#7fb0ee" font-size="12" font-weight="bold">1. Vol de Diagnostic</text>
  <text x="45" y="122" fill="#88b3a4" font-size="10">Drone Multispectral (M3M)</text>
  
  <rect x="45" y="135" width="175" height="70" fill="#0d2538" rx="4" />
  <text x="55" y="155" fill="#f4faf7" font-size="10">• Vol à 80 m (GSD 2.1 cm)</text>
  <text x="55" y="175" fill="#f4faf7" font-size="10">• Capteurs RGB + NIR</text>
  <text x="55" y="195" fill="#3fae7a" font-size="10">• 100 ha audités en 40 min</text>

  <text x="45" y="225" fill="#7fb0ee" font-size="10" font-weight="bold">Livrable :</text>
  <text x="45" y="242" fill="#f4faf7" font-size="9">Photos brutes géoréférencées</text>
  <text x="45" y="258" fill="#f4faf7" font-size="9">avec métadonnées RTK</text>

  <!-- Flèche 1 -> 2 -->
  <polygon points="235,190 250,195 235,200" fill="#3fae7a" />

  <!-- Étape 2 : Traitement SIG & NDVI (QGIS 3) -->
  <rect x="255" y="80" width="195" height="230" fill="#061a14" stroke="#3fae7a" stroke-width="1.5" rx="6" />
  <text x="265" y="105" fill="#3fae7a" font-size="12" font-weight="bold">2. Analyse SIG &amp; NDVI</text>
  <text x="265" y="122" fill="#88b3a4" font-size="10">Traitement QGIS 3 &amp; WebODM</text>

  <rect x="265" y="135" width="175" height="70" fill="#09291b" rx="4" />
  <text x="275" y="155" fill="#f4faf7" font-size="10">• Calcul NDVI (NIR - Red)</text>
  <text x="275" y="175" fill="#f4faf7" font-size="10">• Détection foyers chenilles</text>
  <text x="275" y="195" fill="#d89f3c" font-size="10">• Cartographie des stress</text>

  <text x="265" y="225" fill="#3fae7a" font-size="10" font-weight="bold">Livrable :</text>
  <text x="265" y="242" fill="#f4faf7" font-size="9">Raster d'état sanitaire foliaire</text>
  <text x="265" y="258" fill="#f4faf7" font-size="9">résolution centimétrique</text>

  <!-- Flèche 2 -> 3 -->
  <polygon points="455,190 470,195 455,200" fill="#3fae7a" />

  <!-- Étape 3 : Carte de Prescription VRA -->
  <rect x="475" y="80" width="195" height="230" fill="#061a14" stroke="#d89f3c" stroke-width="1.5" rx="6" />
  <text x="485" y="105" fill="#d89f3c" font-size="12" font-weight="bold">3. Carte de Prescription</text>
  <text x="485" y="122" fill="#88b3a4" font-size="10">Application à Taux Variable (VRA)</text>

  <rect x="485" y="135" width="175" height="70" fill="#0d2e24" rx="4" />
  <text x="495" y="155" fill="#3fae7a" font-size="10">• Zone saine : 0 L/ha</text>
  <text x="495" y="175" fill="#d89f3c" font-size="10">• Zone moyenne : 15 L/ha</text>
  <text x="495" y="195" fill="#e86a6a" font-size="10">• Zone attaquée : 28 L/ha</text>

  <text x="485" y="225" fill="#d89f3c" font-size="10" font-weight="bold">Livrable :</text>
  <text x="485" y="242" fill="#f4faf7" font-size="9">Shapefile / KML de modulation</text>
  <text x="485" y="258" fill="#f4faf7" font-size="9">injecté dans la radiocommande</text>

  <!-- Flèche 3 -> 4 -->
  <polygon points="675,190 690,195 675,200" fill="#3fae7a" />

  <!-- Étape 4 : Traitement Ciblé Agras -->
  <rect x="695" y="80" width="170" height="230" fill="#061a14" stroke="#e86a6a" stroke-width="1.5" rx="6" />
  <text x="705" y="105" fill="#e86a6a" font-size="12" font-weight="bold">4. Pulvérisation Ciblée</text>
  <text x="705" y="122" fill="#88b3a4" font-size="10">Gros Porteur DJI Agras T40</text>

  <rect x="705" y="135" width="150" height="70" fill="#1f1113" rx="4" />
  <text x="715" y="155" fill="#f4faf7" font-size="10">• Guidage RTK cm</text>
  <text x="715" y="175" fill="#f4faf7" font-size="10">• Atomiseurs modulés</text>
  <text x="715" y="195" fill="#3fae7a" font-size="10">• Traite uniquement le foyer</text>

  <text x="705" y="225" fill="#e86a6a" font-size="10" font-weight="bold">Livrable :</text>
  <text x="705" y="242" fill="#f4faf7" font-size="9">Rapport d'application réel</text>
  <text x="705" y="258" fill="#f4faf7" font-size="9">horodaté et certifié</text>

  <!-- Bandeau Inférieur : Bilan de l'Impact Économique et Écologique -->
  <rect x="35" y="325" width="830" height="125" fill="#06100c" stroke="#3fae7a" stroke-width="1.5" rx="8" />
  <text x="50" y="350" fill="#3fae7a" font-size="14" font-weight="bold">BILAN COMPARATIF RÉEL SUR UN CHAMP COTONNIER DE 50 HECTARES (BORGOU) :</text>

  <rect x="50" y="365" width="375" height="70" fill="#1f1113" stroke="#e86a6a" rx="4" />
  <text x="60" y="385" fill="#e86a6a" font-size="11" font-weight="bold">Méthode Traditionnelle (Lance Manuelle) :</text>
  <text x="60" y="403" fill="#f4faf7" font-size="10">• 10 000 Litres d'eau pompés · 6 jours de travail pénible</text>
  <text x="60" y="420" fill="#e86a6a" font-size="10">• Intoxication des ouvriers · Traitement uniforme aveugle</text>

  <rect x="445" y="365" width="405" height="70" fill="#09291b" stroke="#3fae7a" rx="4" />
  <text x="455" y="385" fill="#3fae7a" font-size="11" font-weight="bold">Méthode Drone &amp; SIG TEAM Sahélia :</text>
  <text x="455" y="403" fill="#f4faf7" font-size="10">• 750 Litres d'eau seulement (-92 %) · Fait en 4 heures !</text>
  <text x="455" y="420" fill="#3fae7a" font-size="10" font-weight="bold">• -65 % d'insecticide consommé · Zéro paysan intoxiqué ✓</text>
</svg>