<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="auto" style="background: #06100c; border-radius: 12px; font-family: 'Figtree', sans-serif;">
  <defs>
    <linearGradient id="droneGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2b24" />
      <stop offset="100%" stop-color="#051410" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="480" fill="url(#droneGrad5)" rx="12" />
  <rect x="15" y="15" width="870" height="450" fill="none" stroke="#1b4d3e" stroke-width="1.5" rx="8" />

  <!-- Titre -->
  <rect x="15" y="15" width="870" height="45" fill="#0d352b" rx="8" />
  <text x="35" y="44" fill="#3fae7a" font-size="16" font-weight="bold" letter-spacing="1">PULVÉRISATION AGRICOLE : EFFET DOWNWASH &amp; ATOMISEURS ROTATIFS</text>

  <!-- Colonne Gauche : L'Effet Aérodynamique Downwash -->
  <rect x="35" y="75" width="400" height="375" fill="#061a14" stroke="#3fae7a" stroke-width="1.5" rx="8" />
  <text x="50" y="105" fill="#3fae7a" font-size="15" font-weight="bold">1. Aérodynamique du Souffle (Downwash)</text>
  <text x="50" y="125" fill="#88b3a4" font-size="12">Comment le vortex d'air rabat les gouttelettes sous la canopée</text>

  <!-- Schéma Visuel Downwash -->
  <rect x="50" y="145" width="370" height="150" fill="#06100c" stroke="#1b4d3e" rx="6" />
  
  <!-- Drone symbolique au-dessus -->
  <rect x="200" y="160" width="70" height="20" fill="#3fae7a" rx="4" />
  <ellipse cx="175" cy="160" rx="30" ry="5" fill="#7fb0ee" />
  <ellipse cx="295" cy="160" rx="30" ry="5" fill="#7fb0ee" />

  <!-- Vortex d'air descendant (flèches bleues) -->
  <path d="M 180 170 Q 150 210 160 250" fill="none" stroke="#7fb0ee" stroke-width="3" stroke-dasharray="4,2" />
  <path d="M 290 170 Q 320 210 310 250" fill="none" stroke="#7fb0ee" stroke-width="3" stroke-dasharray="4,2" />
  <path d="M 235 180 L 235 250" fill="none" stroke="#3fae7a" stroke-width="3" />

  <!-- Canopée de plantes au sol -->
  <polygon points="120,270 140,240 160,270" fill="#10b981" />
  <polygon points="180,270 205,235 230,270" fill="#10b981" />
  <polygon points="245,270 270,235 295,270" fill="#10b981" />
  <polygon points="310,270 330,240 350,270" fill="#10b981" />
  
  <text x="145" y="280" fill="#d89f3c" font-size="10" font-weight="bold">Recouvrement face inférieure des feuilles ✓</text>

  <!-- Avantages Downwash -->
  <rect x="50" y="305" width="370" height="130" fill="#09291b" stroke="#3fae7a" rx="6" />
  <text x="65" y="328" fill="#3fae7a" font-size="12" font-weight="bold">Pourquoi le drone surpasse la lance manuelle :</text>
  <text x="65" y="350" fill="#f4faf7" font-size="11">• <tspan fill="#7fb0ee" font-weight="bold">Pénétration du feuillage :</tspan> Les rotors ouvrent la canopée.</text>
  <text x="65" y="370" fill="#f4faf7" font-size="11">• <tspan fill="#3fae7a" font-weight="bold">Traitement sous-foliaire :</tspan> Atteint les pucerons cachés dessous.</text>
  <text x="65" y="390" fill="#f4faf7" font-size="11">• <tspan fill="#e86a6a" font-weight="bold">Zéro piétinement :</tspan> Aucune perte de récolte par écrasement.</text>
  <text x="65" y="412" fill="#d89f3c" font-size="10" font-weight="bold">Ultra-Bas Volume : 15 à 30 L/ha au lieu de 200 L/ha à la main !</text>

  <!-- Colonne Droite : Technologie des Atomiseurs Rotatifs -->
  <rect x="465" y="75" width="400" height="375" fill="#061a14" stroke="#d89f3c" stroke-width="1.5" rx="8" />
  <text x="480" y="105" fill="#d89f3c" font-size="15" font-weight="bold">2. Atomiseurs Rotatifs Centrifuges</text>
  <text x="480" y="125" fill="#88b3a4" font-size="12">Gérer la taille des gouttes (VMD) et éliminer la dérive</text>

  <!-- Schéma Atomiseur Rotatif -->
  <rect x="480" y="145" width="370" height="120" fill="#0d2538" stroke="#7fb0ee" rx="6" />
  <text x="495" y="168" fill="#7fb0ee" font-size="12" font-weight="bold">Réglage de la Gouttelette (Micromètres - µm) :</text>
  
  <text x="495" y="195" fill="#f4faf7" font-size="11">• <tspan fill="#e86a6a" font-weight="bold">50 à 120 µm (Fine) :</tspan> Insecticides foliaires (Attention au vent).</text>
  <text x="495" y="215" fill="#3fae7a" font-weight="bold">• 150 à 250 µm (Moyenne) : Fongicides et engrais foliaires.</text>
  <text x="495" y="235" fill="#d89f3c" font-size="11">• <tspan fill="#7fb0ee" font-weight="bold">250 à 400 µm (Grosse) :</tspan> Herbicides de contact (Zéro dérive).</text>
  <text x="495" y="255" fill="#88b3a4" font-size="10">Vitesse du disque rotatif : 3 000 à 15 000 tours/min modulable.</text>

  <!-- Paramètres de Mission et EPI -->
  <rect x="480" y="275" width="370" height="160" fill="#06100c" stroke="#1b4d3e" rx="6" />
  <text x="495" y="298" fill="#d89f3c" font-size="12" font-weight="bold">Paramètres de Vol &amp; Sécurité Opérateur :</text>
  <text x="495" y="320" fill="#f4faf7" font-size="11">• Hauteur de travail : <tspan fill="#3fae7a" font-weight="bold">2.5 m à 3.5 m</tspan> au-dessus des cultures.</text>
  <text x="495" y="340" fill="#f4faf7" font-size="11">• Vitesse d'avancement : <tspan fill="#7fb0ee" font-weight="bold">4.5 à 6.0 m/s (16 à 22 km/h)</tspan>.</text>
  <text x="495" y="360" fill="#f4faf7" font-size="11">• Largeur de passage (<tspan font-style="italic">Swath</tspan>) : <tspan fill="#3fae7a" font-weight="bold">7 à 9 mètres</tspan>.</text>
  <text x="495" y="385" fill="#e86a6a" font-size="11" font-weight="bold">EPI OBLIGATOIRES lors du chargement :</text>
  <text x="495" y="405" fill="#f4faf7" font-size="10">Masque respiratoire A2P3, gants nitrile, lunettes et combinaison.</text>
</svg>