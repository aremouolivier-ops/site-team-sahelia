<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="auto" style="background: #06100c; border-radius: 12px; font-family: 'Figtree', sans-serif;">
  <defs>
    <linearGradient id="mediaGrad10_3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2b24" />
      <stop offset="100%" stop-color="#051410" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="480" fill="url(#mediaGrad10_3)" rx="12" />
  <rect x="15" y="15" width="870" height="450" fill="none" stroke="#1b4d3e" stroke-width="1.5" rx="8" />

  <!-- Titre -->
  <rect x="15" y="15" width="870" height="45" fill="#0d352b" rx="8" />
  <text x="35" y="44" fill="#3fae7a" font-size="16" font-weight="bold" letter-spacing="1">DÉCODAGE DES TDR (TERMES DE RÉFÉRENCE) &amp; OFFRE TECHNIQUE GAGNANTE</text>

  <!-- Colonne Gauche : Décoder les TDR d'ONG (35 à 440) -->
  <rect x="35" y="75" width="410" height="375" fill="#061a14" stroke="#7fb0ee" stroke-width="1.5" rx="8" />
  <text x="50" y="105" fill="#7fb0ee" font-size="14" font-weight="bold">1. Grille de Lecture Rapide d'un TDR</text>
  <text x="50" y="125" fill="#88b3a4" font-size="11">Extraire les exigences vitales des bailleurs (GIZ, Enabel, FAO, BAD)</text>

  <!-- 4 Clés TDR -->
  <rect x="50" y="145" width="380" height="60" fill="#0d2538" stroke="#7fb0ee" rx="4" />
  <text x="65" y="168" fill="#7fb0ee" font-size="11" font-weight="bold">A. Les Objectifs Spécifiques &amp; Livrables Précis :</text>
  <text x="65" y="188" fill="#f4faf7" font-size="10">Ne lisez pas tout le blabla introductif : allez droit aux "Livrables attendus".</text>

  <rect x="50" y="215" width="380" height="60" fill="#06100c" stroke="#1b4d3e" rx="4" />
  <text x="65" y="238" fill="#3fae7a" font-size="11" font-weight="bold">B. Le Profil &amp; Critères Éliminatoires :</text>
  <text x="65" y="258" fill="#f4faf7" font-size="10">Diplôme exigé (Bac+3/5), années d'expérience et maîtrise obligatoire d'outils.</text>

  <rect x="50" y="285" width="380" height="60" fill="#06100c" stroke="#1b4d3e" rx="4" />
  <text x="65" y="308" fill="#d89f3c" font-size="11" font-weight="bold">C. La Pondération Technique / Financière :</text>
  <text x="65" y="328" fill="#f4faf7" font-size="10">Classique 70 % Technique / 30 % Financier ou 80 % / 20 %.</text>

  <rect x="50" y="355" width="380" height="80" fill="#2d1515" stroke="#e86a6a" rx="4" />
  <text x="65" y="378" fill="#e86a6a" font-size="11" font-weight="bold">D. Pièges de Conformité Administrative :</text>
  <text x="65" y="398" fill="#f4faf7" font-size="10">• Attestation fiscale IFU valide.</text>
  <text x="65" y="415" fill="#f4faf7" font-size="10">• Date et heure limites strictes (rejet automatique si 1 minute de retard).</text>

  <!-- Colonne Droite : L'Offre Technique en 5 Parties (465 à 865) -->
  <rect x="465" y="75" width="400" height="375" fill="#061a14" stroke="#3fae7a" stroke-width="1.5" rx="8" />
  <text x="480" y="105" fill="#3fae7a" font-size="14" font-weight="bold">2. L'Architecture de l'Offre Technique</text>
  <text x="480" y="125" fill="#88b3a4" font-size="11">Le plan universel qui convainc le comité de sélection</text>

  <!-- 5 Parties -->
  <rect x="480" y="145" width="370" height="50" fill="#0d352b" stroke="#3fae7a" rx="4" />
  <text x="495" y="167" fill="#3fae7a" font-size="11" font-weight="bold">1. Compréhension de la Mission (2-3 pages)</text>
  <text x="495" y="184" fill="#f4faf7" font-size="9">Reformuler les enjeux avec vos propres mots et ancrage local.</text>

  <rect x="480" y="202" width="370" height="55" fill="#0d2538" stroke="#7fb0ee" rx="4" />
  <text x="495" y="222" fill="#7fb0ee" font-size="11" font-weight="bold">2. Méthodologie &amp; Outils (Le Cœur du Dossier)</text>
  <text x="495" y="240" fill="#f4faf7" font-size="9">Protocole d'échantillonnage, formulaires KoboToolbox, scripts R, QGIS.</text>

  <rect x="480" y="264" width="370" height="50" fill="#06100c" stroke="#1b4d3e" rx="4" />
  <text x="495" y="284" fill="#d89f3c" font-size="11" font-weight="bold">3. Chronogramme &amp; Diagramme de Gantt</text>
  <text x="495" y="302" fill="#f4faf7" font-size="9">Phasage semaine par semaine des jalons et livrables contractuels.</text>

  <rect x="480" y="321" width="370" height="50" fill="#06100c" stroke="#1b4d3e" rx="4" />
  <text x="495" y="341" fill="#f4faf7" font-size="11" font-weight="bold">4. Profil de l'Expert &amp; Rôles</text>
  <text x="495" y="359" fill="#f4faf7" font-size="9">CV formaté bailleur avec mise en valeur des compétences clés.</text>

  <rect x="480" y="378" width="370" height="55" fill="#06100c" stroke="#3fae7a" rx="4" />
  <text x="495" y="398" fill="#3fae7a" font-size="11" font-weight="bold">5. Références Similaires &amp; Attestations</text>
  <text x="495" y="418" fill="#88b3a4" font-size="9">Preuves de missions réussies, extraits de cartes, attestations de bonne fin.</text>
</svg>