<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="auto" style="background: #06100c; border-radius: 12px; font-family: 'Figtree', sans-serif;">
  <defs>
    <linearGradient id="mediaGrad10_6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2b24" />
      <stop offset="100%" stop-color="#051410" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="480" fill="url(#mediaGrad10_6)" rx="12" />
  <rect x="15" y="15" width="870" height="450" fill="none" stroke="#1b4d3e" stroke-width="1.5" rx="8" />

  <!-- Titre -->
  <rect x="15" y="15" width="870" height="45" fill="#0d352b" rx="8" />
  <text x="35" y="44" fill="#3fae7a" font-size="16" font-weight="bold" letter-spacing="1">PROJET CAPSTONE : LE DOSSIER D'EXPERT DU CONSULTANT AGRONOME-NUMÉRICIEN</text>

  <!-- Colonne Gauche : Les 4 Livrables Professionnels (35 à 440) -->
  <rect x="35" y="75" width="410" height="375" fill="#061a14" stroke="#7fb0ee" stroke-width="1.5" rx="8" />
  <text x="50" y="105" fill="#7fb0ee" font-size="14" font-weight="bold">1. Le Classeur d'Affaires du Consultant (Portfolio)</text>
  <text x="50" y="125" fill="#88b3a4" font-size="11">Les 4 pièces maîtresses indispensables pour démarrer immédiatement</text>

  <!-- Pièce 1 : CV Expert -->
  <rect x="50" y="145" width="380" height="65" fill="#0d2538" stroke="#7fb0ee" rx="4" />
  <text x="65" y="168" fill="#7fb0ee" font-size="11" font-weight="bold">Livrable 1 : Le CV Standardisé Bailleurs (2 pages)</text>
  <text x="65" y="188" fill="#f4faf7" font-size="10">Structure UEMOA/GIZ avec missions chiffrées en hectares et FCFA.</text>
  <text x="65" y="202" fill="#88b3a4" font-size="8">Sections : Diplômes certifiés, compétences logicielles, 5 références vérifiables.</text>

  <!-- Pièce 2 : Grille Tarifaire -->
  <rect x="50" y="220" width="380" height="65" fill="#06100c" stroke="#1b4d3e" rx="4" />
  <text x="65" y="243" fill="#3fae7a" font-size="11" font-weight="bold">Livrable 2 : La Grille Tarifaire &amp; Catalogue de Services</text>
  <text x="65" y="263" fill="#f4faf7" font-size="10">TJM calculé (ex: 45 000 FCFA/jour) + Forfaits clés en main (Kobo, QGIS).</text>
  <text x="65" y="277" fill="#88b3a4" font-size="8">Barème transparent pour éviter tout marchandage dépréciatif.</text>

  <!-- Pièce 3 : Devis Type -->
  <rect x="50" y="295" width="380" height="65" fill="#06100c" stroke="#1b4d3e" rx="4" />
  <text x="65" y="318" fill="#d89f3c" font-size="11" font-weight="bold">Livrable 3 : Le Modèle de Devis Contractuel &amp; IFU</text>
  <text x="65" y="338" fill="#f4faf7" font-size="10">Gabarit Word/PDF aux normes avec clause de verrouillage 50-30-20.</text>
  <text x="65" y="352" fill="#88b3a4" font-size="8">N° IFU, validité 30 jours, réserve de propriété jusqu'au solde.</text>

  <!-- Pièce 4 : Réponse TDR -->
  <rect x="50" y="370" width="380" height="65" fill="#0d352b" stroke="#3fae7a" rx="4" />
  <text x="65" y="393" fill="#3fae7a" font-size="11" font-weight="bold">Livrable 4 : Le Dossier de Soumission TDR Complet</text>
  <text x="65" y="413" fill="#f4faf7" font-size="10">Offre technique (5 sections) + Offre financière ventilée H/J.</text>
  <text x="65" y="427" fill="#88b3a4" font-size="8">Cas pratique d'évaluation d'un projet de développement rural au Bénin.</text>

  <!-- Colonne Droite : L'Écosystème Global TEAM Sahélia (465 à 865) -->
  <rect x="465" y="75" width="400" height="375" fill="#061a14" stroke="#3fae7a" stroke-width="1.5" rx="8" />
  <text x="480" y="105" fill="#3fae7a" font-size="14" font-weight="bold">2. L'Accomplissement des 4 Pôles Sahélia</text>
  <text x="480" y="125" fill="#88b3a4" font-size="11">Le profil complet d'un agronome prêt pour l'Afrique de demain</text>

  <!-- 4 Pôles -->
  <rect x="480" y="145" width="370" height="50" fill="#06100c" stroke="#1b4d3e" rx="4" />
  <text x="495" y="167" fill="#3fae7a" font-size="11" font-weight="bold">PÔLE 1 : Bureautique &amp; Productivité (Manuels 01, 02, 03)</text>
  <text x="495" y="184" fill="#88b3a4" font-size="9">Rapports d'impact Word, Modélisation financière Excel &amp; Slides Bailleurs.</text>

  <rect x="480" y="202" width="370" height="50" fill="#06100c" stroke="#1b4d3e" rx="4" />
  <text x="495" y="222" fill="#7fb0ee" font-size="11" font-weight="bold">PÔLE 2 : Agronomie, Données &amp; Cartographie (04, 05, 06, 11)</text>
  <text x="495" y="239" fill="#88b3a4" font-size="9">Enquêtes KoboToolbox, Cartographie QGIS, R &amp; Drones agricoles.</text>

  <rect x="480" y="259" width="370" height="50" fill="#06100c" stroke="#1b4d3e" rx="4" />
  <text x="495" y="279" fill="#d89f3c" font-size="11" font-weight="bold">PÔLE 3 : Code, IA &amp; Vibe Coding (Manuels 07, 08)</text>
  <text x="495" y="296" fill="#88b3a4" font-size="9">Applications web modernes et développement accéléré par IA responsable.</text>

  <rect x="480" y="316" width="370" height="50" fill="#0d352b" stroke="#3fae7a" rx="4" />
  <text x="495" y="336" fill="#3fae7a" font-size="11" font-weight="bold">PÔLE 4 : Création Multimédia &amp; Carrière Freelance (09, 10)</text>
  <text x="495" y="353" fill="#88b3a4" font-size="9">Infographies, montage vidéo smartphone et posture de consultant indépendant.</text>

  <!-- Cachet de Clôture -->
  <rect x="480" y="375" width="370" height="60" fill="#06100c" stroke="#d89f3c" stroke-width="1.5" rx="6" />
  <text x="495" y="398" fill="#d89f3c" font-size="12" font-weight="bold">CERTIFICATION OFFICIELLE TEAM SAHÉLIA</text>
  <text x="495" y="415" fill="#f4faf7" font-size="10">Direction Académique : Sègla Bio KPEROU &amp; Olivier AREMOU</text>
  <text x="495" y="428" fill="#3fae7a" font-size="9">Devise : TEAM Sahélia · Apprendre. Créer. Innover.</text>
</svg>