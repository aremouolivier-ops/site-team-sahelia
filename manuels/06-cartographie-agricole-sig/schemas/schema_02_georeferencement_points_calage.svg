<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="auto" style="background: #06100c; border-radius: 12px; font-family: 'Figtree', sans-serif;">
  <defs>
    <linearGradient id="sigGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2b24" />
      <stop offset="100%" stop-color="#051410" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="480" fill="url(#sigGrad2)" rx="12" />
  <rect x="15" y="15" width="870" height="450" fill="none" stroke="#1b4d3e" stroke-width="1.5" rx="8" />

  <!-- Titre -->
  <rect x="15" y="15" width="870" height="45" fill="#0d352b" rx="8" />
  <text x="35" y="44" fill="#3fae7a" font-size="16" font-weight="bold" letter-spacing="1">GÉORÉFÉRENCEMENT, POINTS DE CALAGE (GCP) &amp; IMPORT GPS · QGIS 3</text>

  <!-- Colonne Gauche : Importation des Coordonnées GPS Smartphone -->
  <rect x="35" y="75" width="400" height="375" fill="#061a14" stroke="#7fb0ee" stroke-width="1.5" rx="8" />
  <text x="50" y="105" fill="#7fb0ee" font-size="15" font-weight="bold">1. Import Texte Délimité (CSV Kobo)</text>
  <text x="50" y="125" fill="#88b3a4" font-size="12">Ancrer les points d'enquêtes sur le globe terrestre</text>

  <rect x="50" y="145" width="370" height="130" fill="#0a2538" stroke="#7fb0ee" stroke-width="1" rx="6" />
  <text x="65" y="170" fill="#7fb0ee" font-size="13" font-weight="bold">Attribution des Axes (Attention au piège !) :</text>
  <text x="65" y="195" fill="#f4faf7" font-size="12">Champ <tspan fill="#3fae7a" font-weight="bold">X = Longitude</tspan> (Axe Est-Ouest : ~ 2.6° au Bénin)</text>
  <text x="65" y="218" fill="#f4faf7" font-size="12">Champ <tspan fill="#3fae7a" font-weight="bold">Y = Latitude</tspan>  (Axe Nord-Sud : ~ 9.3° à Parakou)</text>
  <text x="65" y="242" fill="#d89f3c" font-size="11">SCR de la géométrie : <tspan font-weight="bold">EPSG:4326 - WGS 84</tspan></text>
  <text x="65" y="262" fill="#88b3a4" font-size="10">Si inversé, les parcelles se retrouvent dans l'Océan Indien !</text>

  <!-- Export en GeoPackage -->
  <rect x="50" y="290" width="370" height="145" fill="#06100c" stroke="#1b4d3e" rx="6" />
  <text x="65" y="315" fill="#3fae7a" font-size="12" font-weight="bold">Sauvegarder en couche permanente :</text>
  <text x="65" y="338" fill="#f4faf7" font-size="11">Un CSV importé n'est qu'une vue temporaire en mémoire.</text>
  <text x="65" y="360" fill="#f4faf7" font-size="11">Faire : Clic droit > <tspan fill="#3fae7a" font-weight="bold">Exporter > Sauvegarder les entités sous...</tspan></text>
  <text x="65" y="382" fill="#f4faf7" font-size="11">Format : <tspan fill="#7fb0ee" font-weight="bold">GeoPackage (.gpkg)</tspan> standard moderne OGC.</text>
  <text x="65" y="405" fill="#d89f3c" font-size="11" font-weight="bold">Reprojeter directement en EPSG:32631 (UTM Zone 31N) ✓</text>

  <!-- Colonne Droite : Le Géoréférencement d'un Plan Papier / Drone -->
  <rect x="465" y="75" width="400" height="375" fill="#061a14" stroke="#3fae7a" stroke-width="1.5" rx="8" />
  <text x="480" y="105" fill="#3fae7a" font-size="15" font-weight="bold">2. Calage d'un Plan Cadastral ou Drone</text>
  <text x="480" y="125" fill="#88b3a4" font-size="12">Transformer une image JPG/PNG scannée en carte géolocalisée</text>

  <rect x="480" y="145" width="370" height="155" fill="#09291b" stroke="#3fae7a" stroke-width="1" rx="6" />
  <text x="495" y="170" fill="#3fae7a" font-size="13" font-weight="bold">Fenêtre 'Géoréférenceur' (Raster > Géoréférencer) :</text>
  <text x="495" y="195" fill="#f4faf7" font-size="11">• Poser au minimum <tspan fill="#d89f3c" font-weight="bold">4 Points de Contrôle au Sol (GCP)</tspan>.</text>
  <text x="495" y="215" fill="#f4faf7" font-size="11">• Cliquer sur un carrefour ou borne visible sur le croquis.</text>
  <text x="495" y="235" fill="#f4faf7" font-size="11">• Choisir : <tspan fill="#7fb0ee" font-weight="bold">'Depuis le canevas de carte'</tspan> et cliquer le repère.</text>
  <text x="495" y="258" fill="#e8946a" font-size="11">Type de transformation : <tspan font-weight="bold">Polynomiale 1 ou Helmert</tspan></text>
  <text x="495" y="278" fill="#3fae7a" font-size="10" font-weight="bold">Vérifier l'erreur moyenne : Résidu &lt; 1.5 mètre requis.</text>

  <!-- Simulation Résultat Superposition -->
  <rect x="480" y="315" width="370" height="120" fill="#06100c" stroke="#1b4d3e" rx="6" />
  <text x="495" y="338" fill="#7fb0ee" font-size="12" font-weight="bold">Résultat dans QGIS :</text>
  <text x="495" y="360" fill="#f4faf7" font-size="11">Le fichier GeoTIFF calé s'adapte parfaitement par-dessus</text>
  <text x="495" y="380" fill="#f4faf7" font-size="11">les photos satellites Google, à l'échelle métrique exacte.</text>
  <text x="495" y="405" fill="#3fae7a" font-size="11" font-weight="bold">Prêt pour la digitalisation des limites de parcelles !</text>
</svg>