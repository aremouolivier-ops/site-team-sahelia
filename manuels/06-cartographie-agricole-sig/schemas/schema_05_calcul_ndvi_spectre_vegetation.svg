<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="auto" style="background: #06100c; border-radius: 12px; font-family: 'Figtree', sans-serif;">
  <defs>
    <linearGradient id="sigGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2b24" />
      <stop offset="100%" stop-color="#051410" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="480" fill="url(#sigGrad5)" rx="12" />
  <rect x="15" y="15" width="870" height="450" fill="none" stroke="#1b4d3e" stroke-width="1.5" rx="8" />

  <!-- Titre -->
  <rect x="15" y="15" width="870" height="45" fill="#0d352b" rx="8" />
  <text x="35" y="44" fill="#3fae7a" font-size="16" font-weight="bold" letter-spacing="1">TÉLÉDÉTECTION OPTIQUE, SENTINEL-2 &amp; CALCUL DE L'INDICE NDVI · QGIS 3</text>

  <!-- Colonne Gauche : Signature Spectrale de la Plante -->
  <rect x="35" y="75" width="400" height="375" fill="#061a14" stroke="#3fae7a" stroke-width="1.5" rx="8" />
  <text x="50" y="105" fill="#3fae7a" font-size="15" font-weight="bold">1. Signature Spectrale Végétale</text>
  <text x="50" y="125" fill="#88b3a4" font-size="12">Pourquoi la plante vivante réfléchit l'infrarouge</text>

  <!-- Schéma Feuille vs Rayons Solaires -->
  <rect x="50" y="145" width="370" height="150" fill="#06100c" stroke="#1b4d3e" rx="6" />
  
  <!-- Lumière Rouge absorbée -->
  <line x1="80" y1="160" x2="140" y2="210" stroke="#e86a6a" stroke-width="3" />
  <polygon points="140,210 130,202 135,215" fill="#e86a6a" />
  <text x="70" y="155" fill="#e86a6a" font-size="11" font-weight="bold">Lumière Rouge (0.66 µm)</text>
  <text x="70" y="240" fill="#e86a6a" font-size="10">Fortement absorbée par</text>
  <text x="70" y="255" fill="#e86a6a" font-size="10">la chlorophylle (photosynthèse)</text>

  <!-- Proche Infrarouge réfléchi -->
  <line x1="260" y1="160" x2="320" y2="210" stroke="#7fb0ee" stroke-width="3" />
  <line x1="320" y1="210" x2="370" y2="160" stroke="#7fb0ee" stroke-width="3" />
  <polygon points="370,160 360,165 372,172" fill="#7fb0ee" />
  <text x="270" y="155" fill="#7fb0ee" font-size="11" font-weight="bold">Proche Infrarouge - NIR (0.84 µm)</text>
  <text x="250" y="240" fill="#7fb0ee" font-size="10">Fortement réfléchi par les</text>
  <text x="250" y="255" fill="#7fb0ee" font-size="10">cellules spongieuses saines</text>

  <!-- Bandes Sentinel-2 -->
  <rect x="50" y="305" width="370" height="130" fill="#09291b" stroke="#3fae7a" stroke-width="1" rx="6" />
  <text x="65" y="328" fill="#3fae7a" font-size="12" font-weight="bold">Les 2 Bandes Clés du Satellite Sentinel-2 :</text>
  <text x="65" y="350" fill="#f4faf7" font-size="11">• <tspan fill="#e86a6a" font-weight="bold">Bande 4 (Red / Rouge) :</tspan> Résolution spatiale 10 mètres.</text>
  <text x="65" y="372" fill="#f4faf7" font-size="11">• <tspan fill="#7fb0ee" font-weight="bold">Bande 8 (NIR / Proche Infrarouge) :</tspan> Résolution 10 mètres.</text>
  <text x="65" y="395" fill="#d89f3c" font-size="11" font-weight="bold">Disponibles gratuitement tous les 5 jours sur Copernicus !</text>
  <text x="65" y="415" fill="#88b3a4" font-size="10">Idéal pour le suivi phénologique des cultures au Bénin.</text>

  <!-- Colonne Droite : Formule NDVI & Interprétation Agronomique -->
  <rect x="465" y="75" width="400" height="375" fill="#061a14" stroke="#d89f3c" stroke-width="1.5" rx="8" />
  <text x="480" y="105" fill="#d89f3c" font-size="15" font-weight="bold">2. Calcul Raster &amp; Échelle NDVI</text>
  <text x="480" y="125" fill="#88b3a4" font-size="12">Diagnostiquer la vigueur végétative et le stress hydrique</text>

  <!-- Formule mathématique NDVI -->
  <rect x="480" y="145" width="370" height="90" fill="#0d2e24" stroke="#3fae7a" stroke-width="1" rx="6" />
  <text x="495" y="168" fill="#3fae7a" font-size="13" font-weight="bold">Calculatrice Raster QGIS :</text>
  <rect x="495" y="178" width="340" height="25" fill="#06100c" rx="4" />
  <text x="505" y="195" fill="#f4faf7" font-size="11" font-family="monospace">( "B08@1" - "B04@1" ) / ( "B08@1" + "B04@1" )</text>
  <text x="495" y="222" fill="#d89f3c" font-size="11">Résultat : un raster flottant compris entre -1.0 et +1.0.</text>

  <!-- Grille d'interprétation agronomique -->
  <rect x="480" y="245" width="370" height="190" fill="#06100c" stroke="#1b4d3e" rx="6" />
  <text x="495" y="268" fill="#7fb0ee" font-size="12" font-weight="bold">Interprétation Agronomique des Valeurs :</text>

  <rect x="495" y="280" width="18" height="18" fill="#1e40af" rx="2" />
  <text x="525" y="294" fill="#f4faf7" font-size="11">&lt; 0.0 : Eau libre, fleuves (Okpara, Ouémé), retenues</text>

  <rect x="495" y="305" width="18" height="18" fill="#d97706" rx="2" />
  <text x="525" y="319" fill="#f4faf7" font-size="11">0.0 à 0.20 : Sols nus préparés, carrières, toits en tôle</text>

  <rect x="495" y="330" width="18" height="18" fill="#84cc16" rx="2" />
  <text x="525" y="344" fill="#f4faf7" font-size="11">0.20 à 0.45 : Début de levée, savane herbeuse, stress</text>

  <rect x="495" y="355" width="18" height="18" fill="#15803d" rx="2" />
  <text x="525" y="369" fill="#f4faf7" font-size="11">0.45 à 0.70 : Maïs/coton en pleine floraison, vergers sains</text>

  <rect x="495" y="380" width="18" height="18" fill="#064e3b" rx="2" />
  <text x="525" y="394" fill="#f4faf7" font-size="11">&gt; 0.70 : Forêt dense, canopée fermée, forêt galerie</text>

  <text x="495" y="422" fill="#3fae7a" font-size="10" font-weight="bold">Un creux de NDVI en pleine saison = Attaque parasitaire ou sécheresse.</text>
</svg>