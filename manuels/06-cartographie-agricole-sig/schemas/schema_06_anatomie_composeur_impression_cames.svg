<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="auto" style="background: #06100c; border-radius: 12px; font-family: 'Figtree', sans-serif;">
  <defs>
    <linearGradient id="sigGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2b24" />
      <stop offset="100%" stop-color="#051410" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="480" fill="url(#sigGrad6)" rx="12" />
  <rect x="15" y="15" width="870" height="450" fill="none" stroke="#1b4d3e" stroke-width="1.5" rx="8" />

  <!-- Titre -->
  <rect x="15" y="15" width="870" height="45" fill="#0d352b" rx="8" />
  <text x="35" y="44" fill="#3fae7a" font-size="16" font-weight="bold" letter-spacing="1">ANATOMIE D'UNE CARTE DE SOUTENANCE CAMES · COMPOSEUR QGIS 3</text>

  <!-- Simulation Mise en Page Carte Professionnelle -->
  <rect x="35" y="75" width="530" height="375" fill="#0d1f19" stroke="#3fae7a" stroke-width="1.5" rx="8" />

  <!-- 1. Bandeau Titre Carte -->
  <rect x="45" y="85" width="510" height="35" fill="#06100c" stroke="#1b4d3e" rx="4" />
  <text x="55" y="105" fill="#f4faf7" font-size="11" font-weight="bold">RÉPARTITION SPATIALE DU RENDEMENT DU MAÏS DANS LA COMMUNE DE N'DALI (2026)</text>
  <text x="55" y="116" fill="#88b3a4" font-size="9">Enquêtes de terrain auprès de 80 exploitations familiales · Pôle Borgou-Nord</text>

  <!-- 2. Corps de Carte avec Grille -->
  <rect x="45" y="125" width="370" height="280" fill="#061a14" stroke="#1b4d3e" />
  
  <!-- Coordonnées en bordure -->
  <text x="50" y="137" fill="#88b3a4" font-size="8" font-family="monospace">1 045 000 m N</text>
  <text x="50" y="398" fill="#88b3a4" font-size="8" font-family="monospace">1 015 000 m N</text>
  <text x="315" y="402" fill="#88b3a4" font-size="8" font-family="monospace">475 000 m E</text>

  <!-- Polygones symboliques -->
  <polygon points="120,150 260,140 320,220 280,310 140,290" fill="#10b981" fill-opacity="0.3" stroke="#10b981" stroke-width="2" />
  <polygon points="160,190 230,185 240,240 170,245" fill="#3b82f6" fill-opacity="0.5" stroke="#3b82f6" stroke-width="1.5" />
  <text x="180" y="215" fill="#ffffff" font-size="10" font-weight="bold">P-01 (4.2 ha)</text>

  <!-- Flèche Nord Stylisée -->
  <circle cx="90" cy="180" r="16" fill="#06100c" stroke="#3fae7a" stroke-width="1.5" />
  <polygon points="90,168 95,182 85,182" fill="#3fae7a" />
  <text x="86" y="193" fill="#ffffff" font-size="9" font-weight="bold">N</text>

  <!-- Échelle Graphique -->
  <rect x="55" y="365" width="120" height="6" fill="#f4faf7" stroke="#333" />
  <rect x="55" y="365" width="60" height="6" fill="#3fae7a" />
  <text x="55" y="360" fill="#f4faf7" font-size="8">0</text>
  <text x="110" y="360" fill="#f4faf7" font-size="8">2.5 km</text>
  <text x="165" y="360" fill="#f4faf7" font-size="8">5 km</text>
  <text x="55" y="380" fill="#88b3a4" font-size="8">Échelle 1 : 50 000</text>

  <!-- 3. Carton de Situation (Bénin) -->
  <rect x="420" y="125" width="135" height="110" fill="#06100c" stroke="#1b4d3e" rx="4" />
  <text x="428" y="140" fill="#d89f3c" font-size="9" font-weight="bold">Localisation Nationale</text>
  <!-- Silhouette approximative Bénin -->
  <polygon points="460,148 485,152 495,190 470,225 450,225 452,180" fill="#0a2b24" stroke="#88b3a4" stroke-width="1" />
  <!-- Point zone étude -->
  <circle cx="475" cy="175" r="4" fill="#e86a6a" />
  <text x="483" y="178" fill="#e86a6a" font-size="8" font-weight="bold">N'Dali</text>

  <!-- 4. Légende Nettoyée -->
  <rect x="420" y="240" width="135" height="165" fill="#06100c" stroke="#1b4d3e" rx="4" />
  <text x="428" y="255" fill="#7fb0ee" font-size="10" font-weight="bold">LÉGENDE</text>
  
  <rect x="428" y="265" width="12" height="10" fill="#10b981" />
  <text x="445" y="274" fill="#f4faf7" font-size="8">Limite Commune</text>

  <rect x="428" y="282" width="12" height="10" fill="#3b82f6" />
  <text x="445" y="291" fill="#f4faf7" font-size="8">Parcelles d'Essais</text>

  <text x="428" y="310" fill="#d89f3c" font-size="8" font-weight="bold">Rendement Maïs :</text>
  <rect x="428" y="318" width="10" height="8" fill="#f7fcf5" />
  <text x="442" y="325" fill="#88b3a4" font-size="7">&lt; 1 500 kg/ha</text>
  <rect x="428" y="330" width="10" height="8" fill="#74c476" />
  <text x="442" y="337" fill="#88b3a4" font-size="7">1 500 - 3 000 kg/ha</text>
  <rect x="428" y="342" width="10" height="8" fill="#005a32" />
  <text x="442" y="349" fill="#88b3a4" font-size="7">&gt; 3 000 kg/ha</text>

  <!-- 5. Cartouche Auteur & Métadonnées (Bas de page) -->
  <rect x="45" y="410" width="510" height="30" fill="#06100c" stroke="#1b4d3e" rx="3" />
  <text x="52" y="423" fill="#88b3a4" font-size="8">Projection : <tspan fill="#f4faf7">WGS 84 / UTM Zone 31N (EPSG:32631)</tspan> · Sources : IGN Bénin, Enquêtes Kobo 2026, ESA Sentinel-2</text>
  <text x="52" y="434" fill="#3fae7a" font-size="8" font-weight="bold">Réalisation : Sègla Bio KPEROU &amp; Olivier AREMOU · Université de Parakou · TEAM Sahélia</text>

  <!-- Colonne Droite : Les 7 Règles Sacrées du CAMES -->
  <rect x="580" y="75" width="285" height="375" fill="#061a14" stroke="#d89f3c" stroke-width="1.5" rx="8" />
  <text x="595" y="105" fill="#d89f3c" font-size="14" font-weight="bold">Les 7 Règles Sacrées du CAMES</text>
  <text x="595" y="125" fill="#88b3a4" font-size="11">Ce que les membres du jury vérifient en 30s :</text>

  <rect x="595" y="140" width="255" height="295" fill="#0d2538" stroke="#7fb0ee" stroke-width="1" rx="6" />
  <text x="605" y="165" fill="#3fae7a" font-size="11" font-weight="bold">1. Le Titre Tridimensionnel :</text>
  <text x="605" y="180" fill="#f4faf7" font-size="10">Quoi ? Où ? Quand ? (Indispensable)</text>

  <text x="605" y="205" fill="#3fae7a" font-size="11" font-weight="bold">2. L'Orientation (Flèche Nord) :</text>
  <text x="605" y="220" fill="#f4faf7" font-size="10">Toujours vers le haut de la feuille.</text>

  <text x="605" y="245" fill="#3fae7a" font-size="11" font-weight="bold">3. L'Échelle Graphique :</text>
  <text x="605" y="260" fill="#f4faf7" font-size="10">Reste juste même si le jury rétroprojette.</text>

  <text x="605" y="285" fill="#3fae7a" font-size="11" font-weight="bold">4. La Légende Explicite :</text>
  <text x="605" y="300" fill="#f4faf7" font-size="10">Zéro nom de fichier (.shp, .csv) visible !</text>

  <text x="605" y="325" fill="#3fae7a" font-size="11" font-weight="bold">5. Les Sources &amp; la Date :</text>
  <text x="605" y="340" fill="#f4faf7" font-size="10">Traçabilité scientifique des données.</text>

  <text x="605" y="365" fill="#3fae7a" font-size="11" font-weight="bold">6. Le SCR Projeté (UTM 31N) :</text>
  <text x="605" y="380" fill="#f4faf7" font-size="10">Preuve que les calculs sont métriques.</text>

  <text x="605" y="405" fill="#3fae7a" font-size="11" font-weight="bold">7. Le Carton de Situation :</text>
  <text x="605" y="420" fill="#f4faf7" font-size="10">Situer la commune dans le pays.</text>
</svg>