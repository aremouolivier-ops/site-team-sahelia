<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="auto" style="background: #06100c; border-radius: 12px; font-family: 'Figtree', sans-serif;">
  <defs>
    <linearGradient id="sigGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2b24" />
      <stop offset="100%" stop-color="#051410" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="480" fill="url(#sigGrad4)" rx="12" />
  <rect x="15" y="15" width="870" height="450" fill="none" stroke="#1b4d3e" stroke-width="1.5" rx="8" />

  <!-- Titre -->
  <rect x="15" y="15" width="870" height="45" fill="#0d352b" rx="8" />
  <text x="35" y="44" fill="#3fae7a" font-size="16" font-weight="bold" letter-spacing="1">JOINTURE ATTRIBUTAIRE &amp; CARTOGRAPHIE CHOROPLÈTHE THÉMATIQUE · QGIS 3</text>

  <!-- Colonne Gauche : La Jointure Attributaire (Table Join) -->
  <rect x="35" y="75" width="400" height="375" fill="#061a14" stroke="#7fb0ee" stroke-width="1.5" rx="8" />
  <text x="50" y="105" fill="#7fb0ee" font-size="15" font-weight="bold">1. Jointure de Tables (Clé Commune)</text>
  <text x="50" y="125" fill="#88b3a4" font-size="12">Associer un tableau Excel d'enquêtes aux polygones de carte</text>

  <!-- Schéma des deux tables reliées par une clé -->
  <rect x="50" y="145" width="165" height="120" fill="#0d2538" stroke="#7fb0ee" rx="4" />
  <text x="60" y="165" fill="#7fb0ee" font-size="11" font-weight="bold">Couche SIG (Communes)</text>
  <line x1="50" y1="175" x2="215" y2="175" stroke="#7fb0ee" stroke-width="1" />
  <text x="60" y="195" fill="#3fae7a" font-size="10" font-family="monospace">CODE_COM (Clé)</text>
  <text x="60" y="215" fill="#f4faf7" font-size="10">BEN-BOR-01 (Parakou)</text>
  <text x="60" y="235" fill="#f4faf7" font-size="10">BEN-BOR-02 (N'Dali)</text>
  <text x="60" y="255" fill="#f4faf7" font-size="10">BEN-BOR-03 (Bembèrèkè)</text>

  <!-- Ligne de liaison -->
  <path d="M 215 190 L 255 190" stroke="#d89f3c" stroke-width="2" stroke-dasharray="4,2" />

  <rect x="255" y="145" width="165" height="120" fill="#0a2b24" stroke="#3fae7a" rx="4" />
  <text x="265" y="165" fill="#3fae7a" font-size="11" font-weight="bold">Tableau Enquêtes (Excel)</text>
  <line x1="255" y1="175" x2="420" y2="175" stroke="#3fae7a" stroke-width="1" />
  <text x="265" y="195" fill="#3fae7a" font-size="10" font-family="monospace">ID_COMMUNE | Rdt_kg</text>
  <text x="265" y="215" fill="#f4faf7" font-size="10">BEN-BOR-01 | 3 150</text>
  <text x="265" y="235" fill="#f4faf7" font-size="10">BEN-BOR-02 | 2 420</text>
  <text x="265" y="255" fill="#f4faf7" font-size="10">BEN-BOR-03 | 2 890</text>

  <!-- Panneau Procédure Jointure -->
  <rect x="50" y="280" width="370" height="155" fill="#06100c" stroke="#1b4d3e" rx="6" />
  <text x="65" y="303" fill="#7fb0ee" font-size="12" font-weight="bold">Configuration dans Propriétés de la couche :</text>
  <text x="65" y="325" fill="#f4faf7" font-size="11">1. Onglet <tspan fill="#3fae7a" font-weight="bold">Jointures</tspan> > Bouton <tspan fill="#3fae7a" font-weight="bold">'+'</tspan> vert.</text>
  <text x="65" y="345" fill="#f4faf7" font-size="11">2. Couche à joindre : `enquetes_agronomiques_2026`.</text>
  <text x="65" y="365" fill="#f4faf7" font-size="11">3. Champ de jointure : `ID_COMMUNE`.</text>
  <text x="65" y="385" fill="#f4faf7" font-size="11">4. Champ cible : `CODE_COM`.</text>
  <text x="65" y="410" fill="#d89f3c" font-size="10" font-weight="bold">Les chiffres Excel deviennent immédiatement cartographiables !</text>

  <!-- Colonne Droite : Cartographie Thématique Graduée (Choroplèthe) -->
  <rect x="465" y="75" width="400" height="375" fill="#061a14" stroke="#3fae7a" stroke-width="1.5" rx="8" />
  <text x="480" y="105" fill="#3fae7a" font-size="15" font-weight="bold">2. Sémiologie Graphique &amp; Découpage</text>
  <text x="480" y="125" fill="#88b3a4" font-size="12">Choisir la palette et la méthode de discrétisation statistique</text>

  <!-- Palette de dégradé vert choroplèthe -->
  <rect x="480" y="145" width="370" height="135" fill="#09291b" stroke="#3fae7a" stroke-width="1" rx="6" />
  <text x="495" y="168" fill="#3fae7a" font-size="13" font-weight="bold">Classes de Rendement du Maïs (kg/ha) :</text>
  
  <rect x="495" y="180" width="30" height="18" fill="#f7fcf5" stroke="#333" />
  <text x="535" y="194" fill="#f4faf7" font-size="11">&lt; 1 500 kg/ha (Faible / Déficitaire)</text>

  <rect x="495" y="202" width="30" height="18" fill="#a1d99b" stroke="#333" />
  <text x="535" y="216" fill="#f4faf7" font-size="11">1 500 - 2 500 kg/ha (Moyenne régionale)</text>

  <rect x="495" y="224" width="30" height="18" fill="#41ab5d" stroke="#333" />
  <text x="535" y="238" fill="#f4faf7" font-size="11">2 500 - 3 500 kg/ha (Bon niveau technique)</text>

  <rect x="495" y="246" width="30" height="18" fill="#005a32" stroke="#333" />
  <text x="535" y="260" fill="#f4faf7" font-size="11">&gt; 3 500 kg/ha (Haut potentiel / Irrigation)</text>

  <!-- Panneau Méthodes de Discrétisation -->
  <rect x="480" y="295" width="370" height="140" fill="#06100c" stroke="#1b4d3e" rx="6" />
  <text x="495" y="320" fill="#d89f3c" font-size="12" font-weight="bold">Quelle méthode statistique choisir ?</text>
  <text x="495" y="342" fill="#f4faf7" font-size="11">• <tspan fill="#3fae7a" font-weight="bold">Seuils naturels (Jenks) :</tspan> Maximise l'homogénéité interne.</text>
  <text x="495" y="362" fill="#f4faf7" font-size="11">• <tspan fill="#7fb0ee" font-weight="bold">Quantiles (Effectifs égaux) :</tspan> Même nombre de communes.</text>
  <text x="495" y="382" fill="#f4faf7" font-size="11">• <tspan fill="#e8946a" font-weight="bold">Intervalles égaux :</tspan> Pour des échelles standardisées.</text>
  <text x="495" y="405" fill="#d89f3c" font-size="10" font-weight="bold">Règle CAMES : Préférer Jenks avec 4 à 5 classes lisibles.</text>
</svg>