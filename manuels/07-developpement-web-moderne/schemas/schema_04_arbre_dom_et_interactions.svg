<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="auto" style="background: #06100c; border-radius: 12px; font-family: 'Figtree', sans-serif;">
  <defs>
    <linearGradient id="webGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2b24" />
      <stop offset="100%" stop-color="#051410" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="480" fill="url(#webGrad4)" rx="12" />
  <rect x="15" y="15" width="870" height="450" fill="none" stroke="#1b4d3e" stroke-width="1.5" rx="8" />

  <!-- Titre -->
  <rect x="15" y="15" width="870" height="45" fill="#0d352b" rx="8" />
  <text x="35" y="44" fill="#3fae7a" font-size="16" font-weight="bold" letter-spacing="1">L'ARBRE DU DOM &amp; CONTRÔLE DYNAMIQUE DES FORMULAIRES · JAVASCRIPT</text>

  <!-- Colonne Gauche : L'Arbre Hiérarchique du DOM -->
  <rect x="35" y="75" width="400" height="375" fill="#061a14" stroke="#7fb0ee" stroke-width="1.5" rx="8" />
  <text x="50" y="105" fill="#7fb0ee" font-size="15" font-weight="bold">1. L'Arbre DOM (Document Object Model)</text>
  <text x="50" y="125" fill="#88b3a4" font-size="12">Comment JavaScript navigue et modifie le code HTML en direct</text>

  <!-- Schéma Arborescent DOM -->
  <rect x="50" y="145" width="370" height="150" fill="#0d2538" stroke="#7fb0ee" rx="6" />
  
  <!-- Racine Document -->
  <rect x="180" y="155" width="110" height="25" fill="#06100c" stroke="#7fb0ee" rx="4" />
  <text x="200" y="172" fill="#7fb0ee" font-size="11" font-weight="bold">document</text>

  <line x1="235" y1="180" x2="235" y2="195" stroke="#7fb0ee" stroke-width="1.5" />

  <!-- html -->
  <rect x="195" y="195" width="80" height="22" fill="#06100c" stroke="#3fae7a" rx="4" />
  <text x="215" y="210" fill="#3fae7a" font-size="10" font-weight="bold">&lt;html&gt;</text>

  <!-- Branches head et body -->
  <line x1="235" y1="217" x2="130" y2="235" stroke="#3fae7a" stroke-width="1.5" />
  <line x1="235" y1="217" x2="340" y2="235" stroke="#3fae7a" stroke-width="1.5" />

  <rect x="90" y="235" width="80" height="22" fill="#06100c" stroke="#88b3a4" rx="4" />
  <text x="110" y="250" fill="#88b3a4" font-size="10">&lt;head&gt;</text>

  <rect x="300" y="235" width="80" height="22" fill="#1b4d3e" stroke="#3fae7a" rx="4" />
  <text x="320" y="250" fill="#ffffff" font-size="10" font-weight="bold">&lt;body&gt;</text>

  <!-- Feuilles sous body -->
  <line x1="340" y1="257" x2="290" y2="272" stroke="#3fae7a" stroke-width="1.5" />
  <line x1="340" y1="257" x2="380" y2="272" stroke="#3fae7a" stroke-width="1.5" />

  <rect x="250" y="272" width="70" height="18" fill="#06100c" rx="2" />
  <text x="260" y="285" fill="#d89f3c" font-size="9">&lt;form&gt;</text>

  <rect x="350" y="272" width="60" height="18" fill="#06100c" rx="2" />
  <text x="360" y="285" fill="#d89f3c" font-size="9">&lt;div#res&gt;</text>

  <!-- Méthodes de Sélection -->
  <rect x="50" y="305" width="370" height="130" fill="#06100c" stroke="#1b4d3e" rx="6" />
  <text x="65" y="328" fill="#7fb0ee" font-size="12" font-weight="bold">Sélectionner &amp; Modifier en 1 Ligne :</text>
  <text x="65" y="350" fill="#3fae7a" font-size="11" font-family="monospace">const titre = document.querySelector('h1');</text>
  <text x="65" y="370" fill="#7fb0ee" font-size="11" font-family="monospace">titre.textContent = "Nouveau Titre Dynamique";</text>
  <text x="65" y="390" fill="#d89f3c" font-size="11" font-family="monospace">element.classList.toggle('actif');</text>
  <text x="65" y="415" fill="#88b3a4" font-size="10">Pas besoin de jQuery ou bibliothèques lourdes : le JS natif fait tout.</text>

  <!-- Colonne Droite : Formulaires & e.preventDefault() -->
  <rect x="465" y="75" width="400" height="375" fill="#061a14" stroke="#3fae7a" stroke-width="1.5" rx="8" />
  <text x="480" y="105" fill="#3fae7a" font-size="15" font-weight="bold">2. Gestion de Formulaire &amp; Validation</text>
  <text x="480" y="125" fill="#88b3a4" font-size="12">Intercepter la soumission et créer une expérience fluide sans rechargement</text>

  <!-- Bloc e.preventDefault() -->
  <rect x="480" y="145" width="370" height="135" fill="#09291b" stroke="#3fae7a" stroke-width="1" rx="6" />
  <text x="495" y="168" fill="#e86a6a" font-size="12" font-weight="bold">⚠️ La Règle d'Or : event.preventDefault()</text>
  <text x="495" y="190" fill="#f4faf7" font-size="11">Par défaut, un formulaire recharge toute la page lors du clic.</text>
  <text x="495" y="210" fill="#f4faf7" font-size="11"><tspan fill="#3fae7a" font-weight="bold">preventDefault()</tspan> bloque ce comportement brutal et permet</text>
  <text x="495" y="228" fill="#f4faf7" font-size="11">d'exécuter vos calculs en direct dans la page instantanément !</text>

  <rect x="495" y="240" width="340" height="30" fill="#06100c" rx="4" />
  <text x="505" y="260" fill="#3fae7a" font-size="10" font-family="monospace">formulaire.addEventListener('submit', (e) => e.preventDefault());</text>

  <!-- Validation & Injection -->
  <rect x="480" y="290" width="370" height="145" fill="#06100c" stroke="#1b4d3e" rx="6" />
  <text x="495" y="315" fill="#d89f3c" font-size="12" font-weight="bold">Validation &amp; Création Dynamique :</text>
  <text x="495" y="338" fill="#f4faf7" font-size="11">1. Récupérer la valeur : <tspan fill="#7fb0ee" font-family="monospace">champ.value.trim()</tspan></text>
  <text x="495" y="358" fill="#f4faf7" font-size="11">2. Bloquer si vide : <tspan fill="#e86a6a" font-family="monospace">if (!valeur) alert('Erreur');</tspan></text>
  <text x="495" y="378" fill="#f4faf7" font-size="11">3. Injecter la carte résultat dans le DOM :</text>
  <text x="495" y="398" fill="#3fae7a" font-size="10" font-family="monospace">container.innerHTML += `&lt;div class="carte"&gt;${data}&lt;/div&gt;`;</text>
  <text x="495" y="420" fill="#88b3a4" font-size="10">Le visiteur voit son résultat apparaître sans attendre le serveur.</text>
</svg>