<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="auto" style="background: #06100c; border-radius: 12px; font-family: 'Figtree', sans-serif;">
  <defs>
    <linearGradient id="webGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2b24" />
      <stop offset="100%" stop-color="#051410" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="480" fill="url(#webGrad2)" rx="12" />
  <rect x="15" y="15" width="870" height="450" fill="none" stroke="#1b4d3e" stroke-width="1.5" rx="8" />

  <!-- Titre -->
  <rect x="15" y="15" width="870" height="45" fill="#0d352b" rx="8" />
  <text x="35" y="44" fill="#3fae7a" font-size="16" font-weight="bold" letter-spacing="1">DESIGN RESPONSIVE CSS3 : BOX MODEL, FLEXBOX &amp; CSS GRID · TEAM SAHÉLIA</text>

  <!-- Colonne Gauche : Flexbox (1D - Flux Ligne ou Colonne) -->
  <rect x="35" y="75" width="400" height="375" fill="#061a14" stroke="#7fb0ee" stroke-width="1.5" rx="8" />
  <text x="50" y="105" fill="#7fb0ee" font-size="15" font-weight="bold">1. Flexbox : L'Alignement Unidimensionnel</text>
  <text x="50" y="125" fill="#88b3a4" font-size="12">Idéal pour barres de navigation, boutons et cartes horizontales</text>

  <!-- Simulation Flex Container -->
  <rect x="50" y="145" width="370" height="130" fill="#0d2538" stroke="#7fb0ee" stroke-width="1" rx="6" />
  <text x="60" y="165" fill="#7fb0ee" font-size="10" font-family="monospace">display: flex; justify-content: space-between;</text>
  
  <!-- 3 éléments flex -->
  <rect x="60" y="180" width="95" height="75" fill="#1b4d3e" stroke="#3fae7a" stroke-width="1.5" rx="4" />
  <text x="75" y="215" fill="#ffffff" font-size="11" font-weight="bold">Carte 1</text>
  <text x="70" y="235" fill="#88b3a4" font-size="9">flex: 1;</text>

  <rect x="185" y="180" width="95" height="75" fill="#1b4d3e" stroke="#3fae7a" stroke-width="1.5" rx="4" />
  <text x="200" y="215" fill="#ffffff" font-size="11" font-weight="bold">Carte 2</text>
  <text x="195" y="235" fill="#88b3a4" font-size="9">flex: 1;</text>

  <rect x="310" y="180" width="95" height="75" fill="#1b4d3e" stroke="#3fae7a" stroke-width="1.5" rx="4" />
  <text x="325" y="215" fill="#ffffff" font-size="11" font-weight="bold">Carte 3</text>
  <text x="320" y="235" fill="#88b3a4" font-size="9">flex: 1;</text>

  <!-- Propriétés Clés Flexbox -->
  <rect x="50" y="290" width="370" height="145" fill="#06100c" stroke="#1b4d3e" rx="6" />
  <text x="65" y="315" fill="#7fb0ee" font-size="12" font-weight="bold">Les 4 Propriétés Flexbox Vitales :</text>
  <text x="65" y="338" fill="#f4faf7" font-size="11">• <tspan fill="#3fae7a" font-weight="bold">flex-direction :</tspan> row (ligne) ou column (colonne mobile).</text>
  <text x="65" y="360" fill="#f4faf7" font-size="11">• <tspan fill="#7fb0ee" font-weight="bold">justify-content :</tspan> center | space-between | space-around.</text>
  <text x="65" y="382" fill="#f4faf7" font-size="11">• <tspan fill="#d89f3c" font-weight="bold">align-items :</tspan> center (aligne verticalement au centre).</text>
  <text x="65" y="405" fill="#e8946a" font-size="11">• <tspan font-weight="bold">gap : 1rem</tspan> (crée l'espacement parfait entre blocs).</text>

  <!-- Colonne Droite : CSS Grid & Auto-Responsive -->
  <rect x="465" y="75" width="400" height="375" fill="#061a14" stroke="#3fae7a" stroke-width="1.5" rx="8" />
  <text x="480" y="105" fill="#3fae7a" font-size="15" font-weight="bold">2. CSS Grid : La Grille Magique 2D</text>
  <text x="480" y="125" fill="#88b3a4" font-size="12">Gérer les lignes et colonnes sans calcul manuel de pourcentages</text>

  <!-- Simulation Grid Magique -->
  <rect x="480" y="145" width="370" height="130" fill="#09291b" stroke="#3fae7a" stroke-width="1" rx="6" />
  <text x="490" y="165" fill="#3fae7a" font-size="10" font-family="monospace">grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));</text>

  <!-- 4 cellules de grille -->
  <rect x="495" y="180" width="75" height="40" fill="#06100c" stroke="#d89f3c" rx="4" />
  <text x="508" y="205" fill="#d89f3c" font-size="10">Élément 1</text>

  <rect x="580" y="180" width="75" height="40" fill="#06100c" stroke="#d89f3c" rx="4" />
  <text x="593" y="205" fill="#d89f3c" font-size="10">Élément 2</text>

  <rect x="665" y="180" width="75" height="40" fill="#06100c" stroke="#d89f3c" rx="4" />
  <text x="678" y="205" fill="#d89f3c" font-size="10">Élément 3</text>

  <rect x="750" y="180" width="75" height="40" fill="#06100c" stroke="#d89f3c" rx="4" />
  <text x="763" y="205" fill="#d89f3c" font-size="10">Élément 4</text>

  <text x="495" y="250" fill="#f4faf7" font-size="11">S'adapte sur PC (4 col), Tablette (2 col) et Téléphone (1 col)</text>
  <text x="495" y="268" fill="#3fae7a" font-size="10" font-weight="bold">Zéro media query requise pour ce comportement !</text>

  <!-- Box Model & Media Queries -->
  <rect x="480" y="290" width="370" height="145" fill="#06100c" stroke="#1b4d3e" rx="6" />
  <text x="495" y="315" fill="#d89f3c" font-size="12" font-weight="bold">La Règle d'Or Universelle du Box-Sizing :</text>
  <rect x="495" y="325" width="340" height="28" fill="#1b2a22" rx="4" />
  <text x="505" y="344" fill="#3fae7a" font-size="11" font-family="monospace">* { box-sizing: border-box; margin: 0; }</text>
  
  <text x="495" y="375" fill="#f4faf7" font-size="11">Empêche les paddings et bordures d'agrandir les boîtes et</text>
  <text x="495" y="393" fill="#f4faf7" font-size="11">de briser la mise en page sur petit écran de smartphone.</text>
  <text x="495" y="418" fill="#7fb0ee" font-size="10" font-weight="bold">Media Query Breakpoint standard : @media (max-width: 768px)</text>
</svg>