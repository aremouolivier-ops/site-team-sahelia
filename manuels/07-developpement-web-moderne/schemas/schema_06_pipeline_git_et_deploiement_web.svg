<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="auto" style="background: #06100c; border-radius: 12px; font-family: 'Figtree', sans-serif;">
  <defs>
    <linearGradient id="webGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2b24" />
      <stop offset="100%" stop-color="#051410" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="480" fill="url(#webGrad6)" rx="12" />
  <rect x="15" y="15" width="870" height="450" fill="none" stroke="#1b4d3e" stroke-width="1.5" rx="8" />

  <!-- Titre -->
  <rect x="15" y="15" width="870" height="45" fill="#0d352b" rx="8" />
  <text x="35" y="44" fill="#3fae7a" font-size="16" font-weight="bold" letter-spacing="1">PIPELINE DE VERSIONING GIT &amp; HÉBERGEMENT GRATUIT GITHUB PAGES</text>

  <!-- Cycle en 4 Étapes Connectées -->

  <!-- Étape 1 : Code Local -->
  <rect x="35" y="80" width="195" height="230" fill="#061a14" stroke="#7fb0ee" stroke-width="1.5" rx="6" />
  <text x="45" y="105" fill="#7fb0ee" font-size="12" font-weight="bold">1. Développement Local</text>
  <text x="45" y="122" fill="#88b3a4" font-size="10">VS Code &amp; Navigateur</text>
  
  <rect x="45" y="135" width="175" height="70" fill="#0d2538" rx="4" />
  <text x="55" y="155" fill="#f4faf7" font-size="10">• index.html (Squelette)</text>
  <text x="55" y="175" fill="#f4faf7" font-size="10">• style.css (Responsive)</text>
  <text x="55" y="195" fill="#3fae7a" font-size="10">• app.js (Logique &amp; Store)</text>

  <text x="45" y="225" fill="#7fb0ee" font-size="10" font-weight="bold">Action :</text>
  <text x="45" y="242" fill="#f4faf7" font-size="9">Tester le rendu mobile</text>
  <text x="45" y="258" fill="#f4faf7" font-size="9">avec F12 DevTools</text>

  <!-- Flèche 1 -> 2 -->
  <polygon points="235,190 250,195 235,200" fill="#3fae7a" />

  <!-- Étape 2 : Versioning Git -->
  <rect x="255" y="80" width="195" height="230" fill="#061a14" stroke="#3fae7a" stroke-width="1.5" rx="6" />
  <text x="265" y="105" fill="#3fae7a" font-size="12" font-weight="bold">2. Versioning Git</text>
  <text x="265" y="122" fill="#88b3a4" font-size="10">Historique local infalsifiable</text>

  <rect x="265" y="135" width="175" height="70" fill="#09291b" rx="4" />
  <text x="275" y="155" fill="#3fae7a" font-size="10" font-family="monospace">git init</text>
  <text x="275" y="175" fill="#3fae7a" font-size="10" font-family="monospace">git add .</text>
  <text x="275" y="195" fill="#3fae7a" font-size="10" font-family="monospace">git commit -m "v1.0"</text>

  <text x="265" y="225" fill="#3fae7a" font-size="10" font-weight="bold">Bénéfice :</text>
  <text x="265" y="242" fill="#f4faf7" font-size="9">Zéro risque de perdre</text>
  <text x="265" y="258" fill="#f4faf7" font-size="9">son code source</text>

  <!-- Flèche 2 -> 3 -->
  <polygon points="455,190 470,195 455,200" fill="#3fae7a" />

  <!-- Étape 3 : Dépôt GitHub -->
  <rect x="475" y="80" width="195" height="230" fill="#061a14" stroke="#d89f3c" stroke-width="1.5" rx="6" />
  <text x="485" y="105" fill="#d89f3c" font-size="12" font-weight="bold">3. Dépôt Cloud GitHub</text>
  <text x="485" y="122" fill="#88b3a4" font-size="10">Sauvegarde &amp; Collaboration</text>

  <rect x="485" y="135" width="175" height="70" fill="#0d2e24" rx="4" />
  <text x="495" y="155" fill="#d89f3c" font-size="9" font-family="monospace">git branch -M main</text>
  <text x="495" y="175" fill="#d89f3c" font-size="9" font-family="monospace">git remote add origin</text>
  <text x="495" y="195" fill="#d89f3c" font-size="9" font-family="monospace">git push -u origin main</text>

  <text x="485" y="225" fill="#d89f3c" font-size="10" font-weight="bold">Bénéfice :</text>
  <text x="485" y="242" fill="#f4faf7" font-size="9">Code accessible en ligne</text>
  <text x="485" y="258" fill="#f4faf7" font-size="9">depuis n'importe quel PC</text>

  <!-- Flèche 3 -> 4 -->
  <polygon points="675,190 690,195 675,200" fill="#3fae7a" />

  <!-- Étape 4 : Déploiement GitHub Pages -->
  <rect x="695" y="80" width="170" height="230" fill="#061a14" stroke="#e86a6a" stroke-width="1.5" rx="6" />
  <text x="705" y="105" fill="#e86a6a" font-size="12" font-weight="bold">4. Mise en Ligne Mondiale</text>
  <text x="705" y="122" fill="#88b3a4" font-size="10">GitHub Pages (100% Gratuit)</text>

  <rect x="705" y="135" width="150" height="70" fill="#1f1113" rx="4" />
  <text x="715" y="155" fill="#f4faf7" font-size="9">Settings &gt; Pages</text>
  <text x="715" y="175" fill="#f4faf7" font-size="9">Source : Branch main</text>
  <text x="715" y="195" fill="#3fae7a" font-size="9">HTTPS Sécurisé ✓</text>

  <text x="705" y="225" fill="#e86a6a" font-size="10" font-weight="bold">URL Finale :</text>
  <text x="705" y="242" fill="#3fae7a" font-size="8" font-family="monospace">pseudo.github.io/app</text>
  <text x="705" y="258" fill="#88b3a4" font-size="8">Partageable sur CV / LinkedIn</text>

  <!-- Bandeau Inférieur : Les 3 Règles d'Or du Déploiement Web -->
  <rect x="35" y="325" width="830" height="125" fill="#06100c" stroke="#3fae7a" stroke-width="1.5" rx="8" />
  <text x="50" y="350" fill="#3fae7a" font-size="14" font-weight="bold">LES 3 RÈGLES D'OR DU DÉPLOIEMENT STATIQUE SANS BUDGET :</text>

  <text x="50" y="375" fill="#f4faf7" font-size="11">1. <tspan fill="#7fb0ee" font-weight="bold">Nom de fichier obligatoire :</tspan> Le fichier racine doit impérativement s'appeler <tspan fill="#3fae7a" font-family="monospace">index.html</tspan> (en minuscules).</text>
  <text x="50" y="398" fill="#f4faf7" font-size="11">2. <tspan fill="#d89f3c" font-weight="bold">Chemins relatifs :</tspan> Utilisez toujours des liens relatifs (<tspan font-family="monospace">href="style.css"</tspan>, <tspan font-family="monospace">src="app.js"</tspan>) et jamais de chemins absolus Windows (<tspan font-family="monospace">C:\Users\...</tspan>).</text>
  <text x="50" y="420" fill="#f4faf7" font-size="11">3. <tspan fill="#3fae7a" font-weight="bold">Certificat SSL automatique :</tspan> GitHub Pages fournit gratuitement un cadenas vert HTTPS valide dans le monde entier.</text>
</svg>