<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="auto" style="background: #06100c; border-radius: 12px; font-family: 'Figtree', sans-serif;">
  <defs>
    <linearGradient id="dplyrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2b24" />
      <stop offset="100%" stop-color="#051410" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="480" fill="url(#dplyrGrad)" rx="12" />
  <rect x="15" y="15" width="870" height="450" fill="none" stroke="#1b4d3e" stroke-width="1.5" rx="8" />

  <!-- Titre -->
  <rect x="15" y="15" width="870" height="45" fill="#0d352b" rx="8" />
  <text x="35" y="44" fill="#3fae7a" font-size="16" font-weight="bold" letter-spacing="1">LE PIPELINE DPLYR &amp; MANIPULATION DE DONNÉES AGRONOMIQUES · TEAM SAHÉLIA</text>

  <!-- Colonne Gauche : Les 5 Verbes Maîtres -->
  <rect x="35" y="75" width="400" height="375" fill="#061a14" stroke="#3fae7a" stroke-width="1.5" rx="8" />
  <text x="50" y="105" fill="#3fae7a" font-size="15" font-weight="bold">Les 5 Verbes Clés du Tidyverse</text>
  <text x="50" y="125" fill="#88b3a4" font-size="12">L'enchaînement fluide grâce à l'opérateur Pipe (%&gt;% ou |&gt;)</text>

  <!-- Verbe 1 : filter -->
  <rect x="50" y="145" width="370" height="50" fill="#0d352b" rx="6" />
  <text x="65" y="167" fill="#7fb0ee" font-size="12" font-family="monospace" font-weight="bold">filter(Culture == "Maïs")</text>
  <text x="65" y="185" fill="#88b3a4" font-size="11">Filtre les lignes selon des conditions agronomiques.</text>

  <!-- Verbe 2 : select -->
  <rect x="50" y="202" width="370" height="50" fill="#0d352b" rx="6" />
  <text x="65" y="224" fill="#7fb0ee" font-size="12" font-family="monospace" font-weight="bold">select(ID, Commune, Rendement)</text>
  <text x="65" y="242" fill="#88b3a4" font-size="11">Isole les colonnes d'intérêt en éliminant le superflu.</text>

  <!-- Verbe 3 : mutate -->
  <rect x="50" y="259" width="370" height="50" fill="#0d352b" rx="6" />
  <text x="65" y="281" fill="#e8946a" font-size="12" font-family="monospace" font-weight="bold">mutate(Rdt_t_ha = Rendement / 1000)</text>
  <text x="65" y="299" fill="#88b3a4" font-size="11">Crée de nouvelles variables calculées sans écraser la base.</text>

  <!-- Verbe 4 : group_by + summarise -->
  <rect x="50" y="316" width="370" height="60" fill="#0d352b" rx="6" />
  <text x="65" y="338" fill="#3fae7a" font-size="12" font-family="monospace" font-weight="bold">group_by(Commune) %&gt;% summarise()</text>
  <text x="65" y="356" fill="#88b3a4" font-size="11">Agrège les parcelles pour calculer Moyenne et Écart-Type.</text>

  <text x="50" y="405" fill="#3fae7a" font-size="12" font-weight="bold">Raccourci Pipe : Ctrl + Maj + M</text>
  <text x="50" y="425" fill="#88b3a4" font-size="11">Écrit automatiquement %&gt;% sans taper au kilomètre.</text>

  <!-- Colonne Droite : Cas d'Usage Réel -->
  <rect x="465" y="75" width="400" height="375" fill="#061a14" stroke="#7fb0ee" stroke-width="1.5" rx="8" />
  <text x="480" y="105" fill="#7fb0ee" font-size="15" font-weight="bold">Exemple Réel : Essais Maïs Parakou</text>
  <text x="480" y="125" fill="#88b3a4" font-size="12">Script complet de transformation et synthèse</text>

  <!-- Code Box -->
  <rect x="480" y="145" width="370" height="175" fill="#06100c" stroke="#1b4d3e" rx="6" />
  <text x="495" y="168" fill="#e8946a" font-size="11" font-family="monospace">library(dplyr)</text>
  <text x="495" y="190" fill="#f4faf7" font-size="11" font-family="monospace">bilan_mais &lt;- parcelles %&gt;%</text>
  <text x="515" y="210" fill="#7fb0ee" font-size="11" font-family="monospace">filter(Culture == "Maïs") %&gt;%</text>
  <text x="515" y="230" fill="#7fb0ee" font-size="11" font-family="monospace">mutate(Rdt_t_ha = Rendement_kg_ha / 1000) %&gt;%</text>
  <text x="515" y="250" fill="#3fae7a" font-size="11" font-family="monospace">group_by(Traitement) %&gt;%</text>
  <text x="515" y="270" fill="#3fae7a" font-size="11" font-family="monospace">summarise(</text>
  <text x="535" y="290" fill="#88b3a4" font-size="10" font-family="monospace">Moyenne = mean(Rdt_t_ha),</text>
  <text x="535" y="308" fill="#88b3a4" font-size="10" font-family="monospace">EcartType = sd(Rdt_t_ha)</text>
  <text x="515" y="325" fill="#f4faf7" font-size="11" font-family="monospace">)</text>

  <!-- Résultat Visuel -->
  <rect x="480" y="335" width="370" height="100" fill="#09291b" stroke="#3fae7a" rx="6" />
  <text x="495" y="358" fill="#3fae7a" font-size="12" font-weight="bold">Tableau de Sortie Généré en 0.05 seconde :</text>
  <text x="495" y="380" fill="#f4faf7" font-size="11" font-family="monospace">Traitement  | Moyenne (t/ha) | EcartType</text>
  <text x="495" y="400" fill="#88b3a4" font-size="11" font-family="monospace">T0 (Témoin) | 1.25           | 0.18</text>
  <text x="495" y="420" fill="#3fae7a" font-size="11" font-family="monospace">T2 (Compost)| 2.85           | 0.22</text>
</svg>
