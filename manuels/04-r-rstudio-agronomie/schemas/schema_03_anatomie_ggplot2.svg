<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="auto" style="background: #06100c; border-radius: 12px; font-family: 'Figtree', sans-serif;">
  <defs>
    <linearGradient id="ggGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2b24" />
      <stop offset="100%" stop-color="#051410" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="480" fill="url(#ggGrad)" rx="12" />
  <rect x="15" y="15" width="870" height="450" fill="none" stroke="#1b4d3e" stroke-width="1.5" rx="8" />

  <!-- Titre -->
  <rect x="15" y="15" width="870" height="45" fill="#0d352b" rx="8" />
  <text x="35" y="44" fill="#3fae7a" font-size="16" font-weight="bold" letter-spacing="1">LA GRAMMAIRE DE VISUALISATION GGPLOT2 &amp; BOXPLOTS · TEAM SAHÉLIA</text>

  <!-- Colonne Gauche : Les 5 Couches de ggplot2 -->
  <rect x="35" y="75" width="400" height="375" fill="#061a14" stroke="#7fb0ee" stroke-width="1.5" rx="8" />
  <text x="50" y="105" fill="#7fb0ee" font-size="15" font-weight="bold">La Grammaire en 5 Couches Superposées</text>
  <text x="50" y="125" fill="#88b3a4" font-size="12">Chaque élément s'additionne avec le signe +</text>

  <!-- Couche 1 -->
  <rect x="50" y="145" width="370" height="45" fill="#0d352b" rx="6" />
  <text x="65" y="167" fill="#f4faf7" font-size="12" font-family="monospace" font-weight="bold">1. ggplot(data = essai)</text>
  <text x="65" y="182" fill="#88b3a4" font-size="10">Initialise la toile vierge avec le jeu de données.</text>

  <!-- Couche 2 -->
  <rect x="50" y="198" width="370" height="45" fill="#0d352b" rx="6" />
  <text x="65" y="220" fill="#7fb0ee" font-size="12" font-family="monospace" font-weight="bold">2. + aes(x = Traitement, y = Rdt)</text>
  <text x="65" y="235" fill="#88b3a4" font-size="10">Assigne les variables aux axes (Esthétique spatiale).</text>

  <!-- Couche 3 -->
  <rect x="50" y="251" width="370" height="45" fill="#0d352b" rx="6" />
  <text x="65" y="273" fill="#3fae7a" font-size="12" font-family="monospace" font-weight="bold">3. + geom_boxplot() + geom_jitter()</text>
  <text x="65" y="288" fill="#88b3a4" font-size="10">Dessine la forme géométrique et affiche les points réels.</text>

  <!-- Couche 4 -->
  <rect x="50" y="304" width="370" height="45" fill="#0d352b" rx="6" />
  <text x="65" y="326" fill="#e8946a" font-size="12" font-family="monospace" font-weight="bold">4. + labs(title = "...", y = "kg/ha")</text>
  <text x="65" y="341" fill="#88b3a4" font-size="10">Titres normés, axes scientifiques et sources.</text>

  <!-- Couche 5 -->
  <rect x="50" y="357" width="370" height="45" fill="#0d352b" rx="6" />
  <text x="65" y="379" fill="#f4faf7" font-size="12" font-family="monospace" font-weight="bold">5. + theme_minimal(base_size = 14)</text>
  <text x="65" y="394" fill="#88b3a4" font-size="10">Nettoie le fond gris et optimise la police pour l'impression.</text>

  <text x="50" y="425" fill="#3fae7a" font-size="11" font-weight="bold">Exportation Pro : ggsave("mon_graphe.png", dpi = 300)</text>

  <!-- Colonne Droite : Anatomie d'un Boxplot Scientifique -->
  <rect x="465" y="75" width="400" height="375" fill="#061a14" stroke="#3fae7a" stroke-width="1.5" rx="8" />
  <text x="480" y="105" fill="#3fae7a" font-size="15" font-weight="bold">Décryptage d'une Boîte à Moustaches</text>
  <text x="480" y="125" fill="#88b3a4" font-size="12">Les 5 repères mathématiques indispensables</text>

  <!-- Zone Graphique Boxplot -->
  <rect x="480" y="145" width="370" height="200" fill="#09261f" stroke="#1b4d3e" rx="6" />

  <!-- Traitement T0 -->
  <line x1="560" y1="210" x2="560" y2="180" stroke="#7fb0ee" stroke-width="2" />
  <line x1="560" y1="270" x2="560" y2="300" stroke="#7fb0ee" stroke-width="2" />
  <rect x="535" y="210" width="50" height="60" fill="#0d352b" stroke="#7fb0ee" stroke-width="2" rx="2" />
  <line x1="535" y1="240" x2="585" y2="240" stroke="#f4faf7" stroke-width="3" />
  <text x="545" y="325" fill="#88b3a4" font-size="11">T0 (Témoin)</text>

  <!-- Traitement T2 Gagnant -->
  <line x1="710" y1="170" x2="710" y2="155" stroke="#3fae7a" stroke-width="2" />
  <line x1="710" y1="230" x2="710" y2="255" stroke="#3fae7a" stroke-width="2" />
  <rect x="685" y="170" width="50" height="60" fill="#0d352b" stroke="#3fae7a" stroke-width="2.5" rx="2" />
  <line x1="685" y1="195" x2="735" y2="195" stroke="#e8946a" stroke-width="3" />
  <text x="690" y="325" fill="#3fae7a" font-size="11" font-weight="bold">T2 (Compost)</text>

  <!-- Flèches d'explications Boxplot -->
  <text x="745" y="160" fill="#88b3a4" font-size="10">← Max (Q3 + 1.5 IQR)</text>
  <text x="745" y="175" fill="#7fb0ee" font-size="10">← 3ème Quartile (Q3 : 75%)</text>
  <text x="745" y="198" fill="#e8946a" font-size="10" font-weight="bold">← MÉDIANE (50%)</text>
  <text x="745" y="233" fill="#7fb0ee" font-size="10">← 1er Quartile (Q1 : 25%)</text>
  <text x="745" y="260" fill="#88b3a4" font-size="10">← Min (Q1 - 1.5 IQR)</text>

  <!-- Points outliers -->
  <circle cx="560" cy="165" r="3.5" fill="#e05252" />
  <text x="570" y="168" fill="#ff7b72" font-size="9">Valeur aberrante (Outlier)</text>

  <!-- Conclusion -->
  <text x="480" y="375" fill="#3fae7a" font-size="12" font-weight="bold">Pourquoi le Boxplot est supérieur à la simple moyenne ?</text>
  <text x="480" y="395" fill="#88b3a4" font-size="11">Il révèle la dispersion réelle et la symétrie sans masquer les échecs.</text>
  <text x="480" y="415" fill="#e8946a" font-size="11">La ligne médiane montre la tendance centrale insensible aux extrêmes.</text>
</svg>
