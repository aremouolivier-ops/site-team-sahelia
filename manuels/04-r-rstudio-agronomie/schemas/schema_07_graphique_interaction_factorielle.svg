<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="auto" style="background: #06100c; border-radius: 12px; font-family: 'Figtree', sans-serif;">
  <defs>
    <linearGradient id="factGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2b24" />
      <stop offset="100%" stop-color="#051410" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="480" fill="url(#factGrad)" rx="12" />
  <rect x="15" y="15" width="870" height="450" fill="none" stroke="#1b4d3e" stroke-width="1.5" rx="8" />

  <!-- Titre -->
  <rect x="15" y="15" width="870" height="45" fill="#0d352b" rx="8" />
  <text x="35" y="44" fill="#3fae7a" font-size="16" font-weight="bold" letter-spacing="1">ANOVA À 2 FACTEURS &amp; GRAPHIQUE D'INTERACTION · TEAM SAHÉLIA</text>

  <!-- Colonne Gauche : Modèle à 2 Facteurs -->
  <rect x="35" y="75" width="400" height="375" fill="#061a14" stroke="#7fb0ee" stroke-width="1.5" rx="8" />
  <text x="50" y="105" fill="#7fb0ee" font-size="15" font-weight="bold">Le Modèle Linéaire Factoriel</text>
  <text x="50" y="125" fill="#88b3a4" font-size="12">Tester 2 variables et leur synergie simultanément</text>

  <!-- Formule -->
  <rect x="50" y="145" width="370" height="70" fill="#0d352b" rx="6" />
  <text x="65" y="172" fill="#3fae7a" font-size="14" font-family="monospace" font-weight="bold">Y = μ + Variété + Engrais + (Variété × Engrais) + ε</text>
  <text x="65" y="198" fill="#88b3a4" font-size="11">R commande : aov(Rendement ~ Variete * Engrais, data = tab)</text>

  <!-- Les 3 Lignes du Tableau ANOVA -->
  <rect x="50" y="225" width="370" height="135" fill="#06100c" stroke="#1b4d3e" rx="6" />
  <text x="65" y="248" fill="#f4faf7" font-size="12" font-weight="bold">1. Effet Principal Variété :</text>
  <text x="65" y="266" fill="#88b3a4" font-size="11">Y a-t-il une variété intrinsèquement supérieure ?</text>

  <text x="65" y="290" fill="#f4faf7" font-size="12" font-weight="bold">2. Effet Principal Engrais :</text>
  <text x="65" y="308" fill="#88b3a4" font-size="11">La fertilisation augmente-t-elle globalement la récolte ?</text>

  <text x="65" y="332" fill="#e8946a" font-size="12" font-weight="bold">3. L'Effet d'Interaction (Variété : Engrais) :</text>
  <text x="65" y="350" fill="#88b3a4" font-size="11">Une variété réagit-elle mieux à un engrais particulier ?</text>

  <text x="50" y="390" fill="#e8946a" font-size="12" font-weight="bold">Règle de Décision Majeure :</text>
  <text x="50" y="410" fill="#f4faf7" font-size="11">Si l'interaction est significative (p &lt; 0.05), il est interdit</text>
  <text x="50" y="428" fill="#88b3a4" font-size="11">d'interpréter les effets principaux séparément !</text>

  <!-- Colonne Droite : Lecture Visuelle de l'Interaction -->
  <rect x="465" y="75" width="400" height="375" fill="#061a14" stroke="#3fae7a" stroke-width="1.5" rx="8" />
  <text x="480" y="105" fill="#3fae7a" font-size="15" font-weight="bold">Détection Visuelle de l'Interaction</text>
  <text x="480" y="125" fill="#88b3a4" font-size="12">R commande : interaction.plot()</text>

  <!-- Graphe A : Lignes Parallèles (Pas d'interaction) -->
  <rect x="480" y="145" width="370" height="135" fill="#09261f" stroke="#1b4d3e" rx="6" />
  <text x="495" y="167" fill="#7fb0ee" font-size="12" font-weight="bold">CAS A : Courbes Parallèles (Pas d'Interaction)</text>
  <!-- Ligne 1 -->
  <line x1="520" y1="240" x2="640" y2="200" stroke="#3fae7a" stroke-width="2.5" />
  <line x1="640" y1="200" x2="760" y2="180" stroke="#3fae7a" stroke-width="2.5" />
  <!-- Ligne 2 -->
  <line x1="520" y1="260" x2="640" y2="220" stroke="#e8946a" stroke-width="2.5" />
  <line x1="640" y1="220" x2="760" y2="200" stroke="#e8946a" stroke-width="2.5" />
  <text x="770" y="185" fill="#3fae7a" font-size="10">DMR</text>
  <text x="770" y="205" fill="#e8946a" font-size="10">EVDT</text>
  <text x="495" y="272" fill="#88b3a4" font-size="10">Les 2 variétés réagissent identiquement. Pas d'interaction.</text>

  <!-- Graphe B : Lignes qui se Croisent (Interaction Forte) -->
  <rect x="480" y="290" width="370" height="145" fill="#241508" stroke="#e8946a" stroke-width="1.2" rx="6" />
  <text x="495" y="312" fill="#e8946a" font-size="12" font-weight="bold">CAS B : Courbes qui se Croisent (INTERACTION !)</text>
  <!-- Ligne 1 croisée -->
  <line x1="520" y1="400" x2="640" y2="350" stroke="#3fae7a" stroke-width="3" />
  <line x1="640" y1="350" x2="760" y2="320" stroke="#3fae7a" stroke-width="3" />
  <!-- Ligne 2 croisée -->
  <line x1="520" y1="340" x2="640" y2="360" stroke="#e8946a" stroke-width="2.5" />
  <line x1="640" y1="360" x2="760" y2="410" stroke="#e8946a" stroke-width="2.5" />
  <text x="770" y="325" fill="#3fae7a" font-size="10">DMR</text>
  <text x="770" y="415" fill="#e8946a" font-size="10">EVDT</text>
  <text x="495" y="418" fill="#f4faf7" font-size="10">EVDT est meilleure sans engrais, mais DMR explose avec engrais !</text>
</svg>
