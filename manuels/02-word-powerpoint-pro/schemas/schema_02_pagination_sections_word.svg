<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="auto" style="background: #06100c; border-radius: 12px; font-family: 'Figtree', sans-serif;">
  <defs>
    <linearGradient id="wordGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2b24" />
      <stop offset="100%" stop-color="#051410" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="480" fill="url(#wordGrad)" rx="12" />
  <rect x="15" y="15" width="870" height="450" fill="none" stroke="#1b4d3e" stroke-width="1.5" rx="8" />

  <!-- En-tête -->
  <rect x="15" y="15" width="870" height="45" fill="#0d352b" rx="8" />
  <text x="35" y="44" fill="#3fae7a" font-size="16" font-weight="bold" letter-spacing="1">PAGINATION MULTIPLE & SAUTS DE SECTION SOUS WORD · TEAM SAHÉLIA</text>

  <!-- 3 Colonnes : Section 1, Section 2, Section 3 -->
  
  <!-- SECTION 1 -->
  <rect x="35" y="80" width="255" height="340" fill="#061a14" stroke="#25604d" stroke-width="1" rx="8" />
  <rect x="50" y="95" width="225" height="32" fill="#0a2b24" rx="4" />
  <text x="60" y="116" fill="#e8946a" font-size="13" font-weight="bold">SECTION 1 : COUVERTURE</text>
  
  <rect x="65" y="145" width="195" height="180" fill="#09261f" stroke="#1b4d3e" rx="6" />
  <text x="85" y="180" fill="#88b3a4" font-size="11" font-weight="bold">Page de Garde Officielle</text>
  <rect x="85" y="200" width="155" height="8" fill="#1b4d3e" rx="2" />
  <rect x="85" y="215" width="120" height="8" fill="#1b4d3e" rx="2" />
  <rect x="85" y="230" width="140" height="8" fill="#1b4d3e" rx="2" />
  
  <rect x="65" y="340" width="195" height="40" fill="#1f130e" stroke="#e8946a" stroke-width="1" rx="4" />
  <text x="75" y="365" fill="#e8946a" font-size="11" font-weight="bold">PIED DE PAGE : AUCUN</text>
  <text x="75" y="395" fill="#88b3a4" font-size="10">Page comptée mais sans chiffre</text>

  <!-- Flèche Saut de section 1 -> 2 -->
  <path d="M 295 240 L 320 240 M 312 232 L 320 240 L 312 248" stroke="#3fae7a" stroke-width="2" stroke-linecap="round" />

  <!-- SECTION 2 -->
  <rect x="325" y="80" width="255" height="340" fill="#061a14" stroke="#25604d" stroke-width="1" rx="8" />
  <rect x="340" y="95" width="225" height="32" fill="#0a2b24" rx="4" />
  <text x="350" y="116" fill="#7fb0ee" font-size="13" font-weight="bold">SECTION 2 : LIMINAIRES</text>

  <rect x="355" y="145" width="195" height="180" fill="#09261f" stroke="#1b4d3e" rx="6" />
  <text x="375" y="175" fill="#88b3a4" font-size="11">Sommaire, Dédicaces, Sigles</text>
  <text x="375" y="195" fill="#88b3a4" font-size="11">Résumé & Abstract (Fr/En)</text>
  <rect x="375" y="215" width="155" height="6" fill="#1b4d3e" rx="2" />
  <rect x="375" y="230" width="130" height="6" fill="#1b4d3e" rx="2" />

  <rect x="355" y="340" width="195" height="40" fill="#0a233a" stroke="#7fb0ee" stroke-width="1" rx="4" />
  <text x="365" y="365" fill="#7fb0ee" font-size="11" font-weight="bold">PIED : CHIFFRES ROMAINS</text>
  <text x="365" y="395" fill="#7fb0ee" font-size="12" font-weight="bold">i, ii, iii, iv, v...</text>

  <!-- Flèche Saut de section 2 -> 3 -->
  <path d="M 585 240 L 610 240 M 602 232 L 610 240 L 602 248" stroke="#3fae7a" stroke-width="2" stroke-linecap="round" />

  <!-- SECTION 3 -->
  <rect x="615" y="80" width="255" height="340" fill="#061a14" stroke="#3fae7a" stroke-width="1.5" rx="8" />
  <rect x="630" y="95" width="225" height="32" fill="#0a2b24" rx="4" />
  <text x="640" y="116" fill="#3fae7a" font-size="13" font-weight="bold">SECTION 3 : CORPS DU MÉMOIRE</text>

  <rect x="645" y="145" width="195" height="180" fill="#09261f" stroke="#1b4d3e" rx="6" />
  <text x="660" y="175" fill="#3fae7a" font-size="11" font-weight="bold">Introduction Générale</text>
  <text x="660" y="195" fill="#88b3a4" font-size="11">Revue, Matériel & Méthodes</text>
  <text x="660" y="215" fill="#88b3a4" font-size="11">Résultats, Discussion, Concl.</text>
  <rect x="660" y="235" width="165" height="6" fill="#1b4d3e" rx="2" />

  <rect x="645" y="340" width="195" height="40" fill="#09261f" stroke="#3fae7a" stroke-width="1" rx="4" />
  <text x="655" y="365" fill="#3fae7a" font-size="11" font-weight="bold">PIED : CHIFFRES ARABES</text>
  <text x="655" y="395" fill="#3fae7a" font-size="13" font-weight="bold">Page 1, 2, 3... (Recommencer à 1)</text>

  <!-- Encart d'avertissement en bas -->
  <rect x="35" y="430" width="835" height="25" fill="#1a140a" stroke="#f59e0b" stroke-width="1" rx="4" />
  <text x="50" y="447" fill="#f59e0b" font-size="11" font-weight="bold">⚡ LA CLÉ INDISPENSABLE : Double-cliquer sur le pied de page de la Section suivante et DÉSACTIVER « Lier au précédent » !</text>
</svg>
