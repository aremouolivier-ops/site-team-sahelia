<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="auto" style="background: #06100c; border-radius: 12px; font-family: 'Figtree', sans-serif;">
  <defs>
    <linearGradient id="wordGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2b24" />
      <stop offset="100%" stop-color="#051410" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="900" height="480" fill="url(#wordGrad)" rx="12" />
  <rect x="15" y="15" width="870" height="450" fill="none" stroke="#1b4d3e" stroke-width="1.5" rx="8" />

  <!-- En-tête -->
  <rect x="15" y="15" width="870" height="45" fill="#0d352b" rx="8" />
  <text x="35" y="44" fill="#3fae7a" font-size="16" font-weight="bold" letter-spacing="1">CITATIONS DANS LE TEXTE & BIBLIOGRAPHIE APA 7e / CAMES · TEAM SAHÉLIA</text>

  <!-- Colonne 1 : Citation dans le corps du texte -->
  <rect x="35" y="80" width="405" height="320" fill="#061a14" stroke="#25604d" stroke-width="1" rx="8" />
  <rect x="50" y="95" width="375" height="30" fill="#0a2b24" rx="4" />
  <text x="60" y="115" fill="#7fb0ee" font-size="13" font-weight="bold">1. CITATION DANS LE CORPS DU TEXTE</text>

  <!-- Cas 1 Auteur -->
  <rect x="50" y="140" width="375" height="70" fill="#09261f" stroke="#1b4d3e" rx="6" />
  <text x="65" y="162" fill="#e8946a" font-size="11" font-weight="bold">A. Un ou Deux auteurs :</text>
  <text x="65" y="185" fill="#d1e2d8" font-size="11">« Selon </text>
  <text x="110" y="185" fill="#3fae7a" font-size="11" font-weight="bold">Kperou et Aguin (2024)</text>
  <text x="250" y="185" fill="#d1e2d8" font-size="11">, le déficit hydrique... »</text>
  <text x="65" y="200" fill="#88b3a4" font-size="10">OU parenthétique : </text>
  <text x="170" y="200" fill="#3fae7a" font-size="10" font-weight="bold">(Kperou &amp; Aguin, 2024)</text>

  <!-- Cas 3+ Auteurs -->
  <rect x="50" y="225" width="375" height="80" fill="#09261f" stroke="#1b4d3e" rx="6" />
  <text x="65" y="247" fill="#e8946a" font-size="11" font-weight="bold">B. Trois auteurs ou plus (Règle et al.) :</text>
  <text x="65" y="270" fill="#d1e2d8" font-size="11">« La fertilisation raisonnée </text>
  <text x="210" y="270" fill="#3fae7a" font-size="11" font-weight="bold">(Bio et al., 2025)</text>
  <text x="295" y="270" fill="#d1e2d8" font-size="11"> permet... »</text>
  <text x="65" y="292" fill="#88b3a4" font-size="10">« et al. » s'écrit en italique avec un point après al.</text>

  <!-- Appel Zotero -->
  <rect x="50" y="320" width="375" height="65" fill="#0b2c3d" stroke="#7fb0ee" stroke-width="1" rx="6" />
  <text x="65" y="342" fill="#7fb0ee" font-size="11" font-weight="bold">⚡ Synchronisation Zotero dans Word :</text>
  <text x="65" y="365" fill="#d1e2d8" font-size="11">Onglet Zotero > « Add/Edit Citation » (`Ctrl + Alt + A`)</text>

  <!-- Colonne 2 : Bibliographie finale ordonnée -->
  <rect x="460" y="80" width="405" height="320" fill="#061a14" stroke="#25604d" stroke-width="1" rx="8" />
  <rect x="475" y="95" width="375" height="30" fill="#0a2b24" rx="4" />
  <text x="485" y="115" fill="#3fae7a" font-size="13" font-weight="bold">2. LISTE FINALE : ALINÉA NÉGATIF (1.25 cm)</text>

  <rect x="475" y="140" width="375" height="245" fill="#09261f" stroke="#1b4d3e" rx="6" />
  
  <!-- Entrée 1 -->
  <text x="490" y="165" fill="#ffffff" font-size="11" font-weight="bold">Bio, S. K., Aguin, O., &amp; Tossou, F. (2025).</text>
  <text x="510" y="182" fill="#88b3a4" font-size="10.5">Impact du compost de cotonnier sur le rendement du maïs</text>
  <text x="510" y="197" fill="#7fb0ee" font-size="10.5" font-style="italic">Revue Agronomique Béninoise, 14(2), 45-58.</text>
  <text x="510" y="212" fill="#3fae7a" font-size="10">https://doi.org/10.1234/rab.2025.02</text>

  <!-- Ligne séparatrice -->
  <line x1="490" y1="225" x2="830" y2="225" stroke="#1b4d3e" stroke-width="1" />

  <!-- Entrée 2 -->
  <text x="490" y="245" fill="#ffffff" font-size="11" font-weight="bold">FAO. (2024).</text>
  <text x="510" y="262" fill="#88b3a4" font-size="10.5">Directives pour la cartographie des sols agricoles</text>
  <text x="510" y="277" fill="#7fb0ee" font-size="10.5" font-style="italic">Publications Techniques des Nations Unies, Rome.</text>

  <!-- Ligne séparatrice -->
  <line x1="490" y1="290" x2="830" y2="290" stroke="#1b4d3e" stroke-width="1" />

  <!-- Entrée 3 -->
  <text x="490" y="310" fill="#ffffff" font-size="11" font-weight="bold">Kperou, S. B. (2024).</text>
  <text x="510" y="327" fill="#88b3a4" font-size="10.5">Diagnostic agronomique des systèmes culturaux à Parakou</text>
  <text x="510" y="342" fill="#7fb0ee" font-size="10.5" font-style="italic">Mémoire d’Ingénieur Agronome, FA-UP, Bénin.</text>

  <!-- Avertissement bas -->
  <rect x="35" y="420" width="830" height="35" fill="#132b20" stroke="#3fae7a" stroke-width="1" rx="6" />
  <text x="50" y="442" fill="#a7f3d0" font-size="11.5">✓ Tri alphabétique A-Z strict · Toujours renseigner le DOI ou l'URL de consultation quand disponible.</text>
</svg>
