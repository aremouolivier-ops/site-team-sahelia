<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vérification Officielle de Badge · TEAM Sahélia</title>
  <meta name="description" content="Portail officiel d'authentification et de contrôle de conformité des badges de membres, formations et compétences TEAM Sahélia.">
  <link rel="icon" type="image/svg+xml" href="assets/logo-sahelia.svg">
  <meta name="theme-color" content="#06120e">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/controle-acces.js"></script>
  <script>
    // Sécurité stricte : La vérification des badges est réservée exclusivement à l'administrateur
    (function () {
      try {
        const session = window.SaheliaSecurite ? window.SaheliaSecurite.obtenirSessionValide() : null;
        if (!session || !session.isSuperAdmin) {
          window.location.replace('index.html');
        }
      } catch (e) {
        window.location.replace('index.html');
      }
    })();
  </script>
  <style>
    .page-verif {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at 50% 0%, rgba(23, 112, 74, 0.25), transparent 60%), #06120e;
    }
    .carte-verif {
      background: var(--surface);
      border: 1px solid var(--bordure);
      border-radius: 20px;
      padding: clamp(1.5rem, 4vw, 2.5rem);
      box-shadow: 0 25px 60px rgba(0,0,0,0.6);
      margin: 2rem auto;
      max-width: 780px;
      width: 100%;
    }
    .badge-statut-bandeau {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.2rem 1.5rem;
      border-radius: 12px;
      margin-bottom: 2rem;
    }
    .statut-valide {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #4ade80;
    }
    .statut-encours {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fbbf24;
    }
    .statut-inscrit {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.4);
      color: #60a5fa;
    }
    .statut-revoque {
      background: rgba(239, 68, 68, 0.2);
      border: 2px solid #ef4444;
      color: #f87171;
    }
    .ligne-info {
      display: grid;
      grid-template-columns: minmax(140px, 190px) 1fr;
      gap: 1rem;
      padding: 0.85rem 0;
      border-bottom: 1px solid var(--bordure);
      font-size: 0.92rem;
    }
    .ligne-info:last-child {
      border-bottom: none;
    }
    .label-info {
      color: var(--texte-3);
      font-family: var(--police-mono);
      font-size: 0.82rem;
      text-transform: uppercase;
      font-weight: 600;
    }
    .valeur-info {
      color: var(--texte);
      font-weight: 600;
    }
    @media (max-width: 600px) {
      .ligne-info {
        grid-template-columns: 1fr;
        gap: 0.25rem;
      }
    }
  </style>
</head>
<body class="page-verif">

  <!-- En-tête fluide & scrollable -->
  <header class="site-entete">
    <div class="enveloppe site-entete-rang">
      <a href="admin.html" class="logo-lien" style="display: flex; align-items: center; gap: 0.75rem;">
        <img src="assets/logo-sahelia.svg" alt="TEAM Sahélia" style="height: 38px; width: auto;">
      </a>

      <nav class="site-nav" aria-label="Navigation principale">
        <a href="admin.html" style="color: var(--marque); font-weight: 700;">👑 ← Retour Console Admin</a>
        <a href="index.html">Accueil Vitrine</a>
        <a href="formation.html">📚 Espace Formation</a>
      </nav>

      <div class="site-entete-actions">
        <a href="admin.html#tab-securite" class="v-btn v-btn--fantome" style="min-height: 36px; padding: 0 0.9rem; font-size: 0.8rem;">
          🔐 Sécurité
        </a>
      </div>
    </div>
  </header>

  <!-- Contenu Principal -->
  <main class="enveloppe" style="flex: 1; padding: 2rem 0;">
    <div id="conteneur-resultat">
      <!-- Rempli dynamiquement -->
    </div>

    <!-- Outil de recherche et d'audit pour l'Administrateur -->
    <div style="max-width: 780px; margin: 1.5rem auto 3rem; background: var(--surface-2); border: 1px solid var(--bordure); border-radius: 14px; padding: 1.25rem;">
      <h4 style="font-size: 0.85rem; font-family: var(--police-mono); text-transform: uppercase; color: var(--texte-3); margin-bottom: 0.75rem;">
        🔍 Auditer un identifiant officiel de badge dans le registre central :
      </h4>

      <form id="form-recherche-id" style="display: flex; flex-wrap: wrap; gap: 0.6rem;">
        <input type="text" id="input-search-id" placeholder="Entrez un identifiant (ex: TS-MBR-... ou TS-FOR-...)" class="champ-saisie" style="font-family: var(--police-mono); flex: 1 1 220px;">
        <button type="submit" class="v-btn v-btn--vert" style="min-height: 42px; font-size: 0.85rem; padding: 0 1.2rem; flex: 0 0 auto;">
          Vérifier l’authenticité
        </button>
      </form>
    </div>
  </main>

  <!-- Pied de page -->
  <footer style="padding: 2rem 0; border-top: 1px solid var(--bordure); background: #040a08; font-size: 0.82rem; color: var(--texte-3); text-align: center;">
    <div class="enveloppe">
      <p>© 2026 TEAM Sahélia · Système Officiel de Vérification d’Identité & de Certifications · République du Bénin</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/qrcode.min.js"></script>
  <script src="js/badge-data.js"></script>
  <script src="js/badge-engine.js"></script>
  <script>
    (function () {
      const conteneur = document.getElementById('conteneur-resultat');
      const inputSearch = document.getElementById('input-search-id');

      // Assainissement XSS strict de toute donnée interpolée
      function escapeHTML(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function obtenirIdDepuisUrl() {
        const params = new URLSearchParams(window.location.search);
        return params.get('id') || '';
      }

      function afficherVerification(badgeId) {
        if (!badgeId) {
          conteneur.innerHTML = `
            <div class="carte-verif" style="text-align: center;">
              <h2 style="font-size: 1.5rem; margin-bottom: 1rem; color: var(--texte);">Aucun identifiant fourni</h2>
              <p style="color: var(--texte-2);">Veuillez scanner un QR code ou entrer un identifiant officiel.</p>
            </div>`;
          return;
        }

        const cleanId = String(badgeId).trim().toUpperCase();
        if (inputSearch) inputSearch.value = cleanId;

        const badge = window.SaheliaDB ? window.SaheliaDB.trouverBadgeParId(cleanId) : null;

        if (!badge) {
          conteneur.innerHTML = `
            <div class="carte-verif" role="alert">
              <div class="badge-statut-bandeau statut-revoque">
                <span style="font-size: 2.2rem;">⚠️</span>
                <div>
                  <h2 style="font-size: 1.35rem; font-weight: 800; margin-bottom: 0.25rem;">IDENTIFIANT INTROUVABLE DANS LE REGISTRE</h2>
                  <p style="font-size: 0.88rem;">Le numéro <strong>${escapeHTML(cleanId)}</strong> n'est associé à aucun badge actif ou enregistré par TEAM Sahélia.</p>
                </div>
              </div>
              <p style="color: var(--texte-2); font-size: 0.95rem; line-height: 1.6;">
                Si ce badge vous a été remis physiquement ou en ligne, il s'agit potentiellement d'une contrefaçon ou d'une erreur de saisie.
              </p>
            </div>`;
          return;
        }

        const estRevoque = badge.statut === 'revoque';
        const estTermine = badge.statut === 'termine' || badge.statut === 'valide' || badge.statut === 'actif';
        const estEnCours = badge.statut === 'en_cours';

        let bandeauClass = 'statut-valide';
        let iconeStatut = '✓';
        let titreStatut = 'BADGE OFFICIEL AUTHENTIFIÉ & CONFORME';
        let descStatut = 'Ce titre est officiellement reconnu et certifié dans le registre central de TEAM Sahélia.';

        if (estRevoque) {
          bandeauClass = 'statut-revoque';
          iconeStatut = '✕';
          titreStatut = 'BADGE RÉVOQUÉ / INVALIDÉ';
          descStatut = badge.motifRevocation || 'Ce badge a été invalidé par les autorités de TEAM Sahélia.';
        } else if (estEnCours) {
          bandeauClass = 'statut-encours';
          iconeStatut = '⏳';
          titreStatut = 'PARTICIPATION EN COURS D’ACQUISITION';
          descStatut = 'Le participant est régulièrement inscrit et poursuit les modules du programme.';
        } else if (badge.statut === 'inscrit') {
          bandeauClass = 'statut-inscrit';
          iconeStatut = '•';
          titreStatut = 'INSCRIPTION ADMINISTRATIVE CONFIRMÉE';
          descStatut = 'La participation a été enregistrée pour les prochaines sessions.';
        }

        let typeLabel = 'Badge de Membre Officiel';
        if (badge.type === 'formation') typeLabel = 'Badge de Formation Académique & Cohorte';
        if (badge.type === 'competence') typeLabel = 'Attestation de Compétence Évaluée sur Projet Réel';

        conteneur.innerHTML = `
          <div class="carte-verif" ${estRevoque ? 'role="alert"' : ''}>
            
            <!-- Bandeau de Statut -->
            <div class="badge-statut-bandeau ${bandeauClass}">
              <span style="font-size: 2.2rem; font-weight: 900; line-height: 1;">${iconeStatut}</span>
              <div>
                <h2 style="font-size: 1.25rem; font-weight: 800; margin-bottom: 0.2rem;">${escapeHTML(titreStatut)}</h2>
                <p style="font-size: 0.88rem; line-height: 1.4;">${escapeHTML(descStatut)}</p>
              </div>
            </div>

            <!-- Titre et Type -->
            <div style="margin-bottom: 1.8rem; border-bottom: 1px solid var(--bordure); padding-bottom: 1.2rem;">
              <span class="etiquette etiquette--or" style="font-size: 0.7rem; margin-bottom: 0.5rem;">${escapeHTML(typeLabel)}</span>
              <h1 style="font-size: clamp(1.4rem, 3.5vw, 1.9rem); font-weight: 800; color: var(--texte); margin-top: 0.3rem;">
                ${escapeHTML(badge.titre)}
              </h1>
              ${badge.niveau ? `<p style="font-size: 0.95rem; font-weight: 700; color: var(--marque); margin-top: 0.4rem;">NIVEAU OFFICIELLEMENT VALIDÉ : ${escapeHTML(String(badge.niveau).toUpperCase())}</p>` : ''}
            </div>

            <!-- Données Officielles Autorisées -->
            <div style="margin-bottom: 2rem;">
              <div class="ligne-info">
                <span class="label-info">Identifiant Unique</span>
                <span class="valeur-info" style="font-family: var(--police-mono); color: var(--marque);">${escapeHTML(badge.id)}</span>
              </div>

              <div class="ligne-info">
                <span class="label-info">Titulaire du Badge</span>
                <span class="valeur-info" style="font-size: 1.05rem;">${escapeHTML(badge.beneficiaireNom)}</span>
              </div>

              <div class="ligne-info">
                <span class="label-info">Rôle / Statut</span>
                <span class="valeur-info">${escapeHTML(badge.beneficiaireRole || 'Membre de la Communauté')}</span>
              </div>

              ${badge.institution ? `
                <div class="ligne-info">
                  <span class="label-info">Institution</span>
                  <span class="valeur-info">${escapeHTML(badge.institution)}</span>
                </div>` : ''}

              ${badge.cohorteNom ? `
                <div class="ligne-info">
                  <span class="label-info">Cohorte</span>
                  <span class="valeur-info">${escapeHTML(badge.cohorteNom)}</span>
                </div>` : ''}

              ${badge.periode ? `
                <div class="ligne-info">
                  <span class="label-info">Période & Lieu</span>
                  <span class="valeur-info">${escapeHTML(badge.periode)} (${escapeHTML(badge.lieu || 'Bénin')})</span>
                </div>` : ''}

              ${badge.formateur ? `
                <div class="ligne-info">
                  <span class="label-info">Formateur Référent</span>
                  <span class="valeur-info">${escapeHTML(badge.formateur)}</span>
                </div>` : ''}

              ${badge.validePar ? `
                <div class="ligne-info">
                  <span class="label-info">Validé par</span>
                  <span class="valeur-info">${escapeHTML(badge.validePar)}</span>
                </div>` : ''}

              ${badge.dateEmission ? `
                <div class="ligne-info">
                  <span class="label-info">Date d’Attribution</span>
                  <span class="valeur-info">${escapeHTML(badge.dateEmission)}</span>
                </div>` : ''}

              ${badge.preuveProjet ? `
                <div class="ligne-info">
                  <span class="label-info">Projet Réel Contrôlé</span>
                  <span class="valeur-info" style="color: var(--texte-2); font-weight: normal; font-size: 0.88rem;">${escapeHTML(badge.preuveProjet)}</span>
                </div>` : ''}
            </div>

            <!-- Critères validés (si badge de compétence) -->
            ${badge.criteres && badge.criteres.length ? `
              <div style="background: var(--fond); border: 1px solid var(--bordure); border-radius: 12px; padding: 1.25rem; margin-bottom: 2rem;">
                <h4 style="font-size: 0.85rem; font-family: var(--police-mono); text-transform: uppercase; color: var(--marque); margin-bottom: 0.75rem;">
                  ✓ Critères d'Évaluation Rigoureusement Vérifiés :
                </h4>
                <ul style="list-style: none; display: flex; flex-direction: column; gap: 0.6rem;">
                  ${badge.criteres.map(c => `
                    <li style="display: flex; align-items: flex-start; gap: 0.6rem; font-size: 0.85rem; color: var(--texte-2); line-height: 1.4;">
                      <span style="color: var(--marque); font-weight: bold;">•</span>
                      <span>${escapeHTML(c)}</span>
                    </li>
                  `).join('')}
                </ul>
              </div>` : ''}

            <!-- Aperçu Visuel Officiel du Badge -->
            <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 1.5rem 0 2rem; background: var(--fond); padding: 1.5rem; border-radius: 14px; border: 1px solid var(--bordure);">
              <span style="font-size: 0.72rem; font-family: var(--police-mono); text-transform: uppercase; color: var(--texte-3); margin-bottom: 0.8rem;">
                Visualisation Officielle du Titre Détenu :
              </span>
              <div style="max-width: 480px; width: 100%; border-radius: 14px; overflow: hidden; border: 2px solid var(--bordure); box-shadow: 0 15px 35px rgba(0,0,0,0.5); background: #000;">
                <canvas id="canvas-mini-apercu" style="width: 100%; height: auto; display: block;"></canvas>
              </div>
            </div>

            <!-- Signature & Actions -->
            <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem; padding-top: 1.5rem; border-top: 1px solid var(--bordure);">
              <div style="font-size: 0.78rem; font-family: var(--police-mono); color: var(--texte-3);">
                Signé numériquement par : <strong>Conseil Académique TEAM Sahélia</strong><br>
                TEAM Sahélia · Communauté Panafricaine
              </div>
              <div style="display: flex; gap: 0.6rem;">
                <button type="button" id="btn-copier-lien-verif" class="v-btn v-btn--fantome" style="min-height: 40px; font-size: 0.82rem;">
                  📋 Copier le lien
                </button>
              </div>
            </div>

          </div>
        `;

        // Bouton Copier le lien avec feedback
        const btnCopier = document.getElementById('btn-copier-lien-verif');
        if (btnCopier) {
          btnCopier.addEventListener('click', () => {
            navigator.clipboard.writeText(window.location.href).then(() => {
              const prevText = btnCopier.innerText;
              btnCopier.innerText = '✓ Lien copié !';
              btnCopier.style.borderColor = 'var(--marque)';
              btnCopier.style.color = 'var(--marque)';
              setTimeout(() => {
                btnCopier.innerText = prevText;
                btnCopier.style.borderColor = '';
                btnCopier.style.color = '';
              }, 2000);
            }).catch(() => {
              prompt('Copiez ce lien officiel :', window.location.href);
            });
          });
        }

        function dessinerMiniBadge() {
          const cvsMini = document.getElementById('canvas-mini-apercu');
          if (cvsMini && window.BadgeEngine) {
            window.BadgeEngine.genererBadgeSurCanvas(cvsMini, {
              type: badge.type,
              format: 'paysage',
              data: badge
            });
          }
        }

        setTimeout(dessinerMiniBadge, 50);
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(dessinerMiniBadge);
        }
      }

      // Initialisation
      const idInitial = obtenirIdDepuisUrl();
      if (idInitial) {
        afficherVerification(idInitial);
      } else {
        conteneur.innerHTML = `
          <div class="carte-verif" style="text-align: center;">
            <h2 style="font-size: 1.4rem; margin-bottom: 0.8rem; color: var(--texte);">Module de Contrôle des Titres</h2>
            <p style="color: var(--texte-2); font-size: 0.95rem;">Veuillez saisir un identifiant officiel de badge ci-dessous pour contrôler son authenticité et son statut.</p>
          </div>`;
      }

      // Recherche par formulaire
      const form = document.getElementById('form-recherche-id');
      if (form) {
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const id = inputSearch.value.trim();
          if (id) {
            window.history.pushState({}, '', '?id=' + encodeURIComponent(id));
            afficherVerification(id);
          }
        });
      }
    })();
  </script>
</body>
</html>
