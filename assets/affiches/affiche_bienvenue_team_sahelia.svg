<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" style="background: #050d0a; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#081812" />
      <stop offset="50%" stop-color="#050e0a" />
      <stop offset="100%" stop-color="#020604" />
    </linearGradient>

    <radialGradient id="topGlow" cx="50%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="bottomGold" cx="10%" cy="95%" r="45%">
      <stop offset="0%" stop-color="#d89f3c" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#d89f3c" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="bottomGreen" cx="90%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#d89f3c" />
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d251c" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#061510" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Fond -->
  <rect width="1080" height="1350" fill="url(#bgGrad)" />
  <rect width="1080" height="1350" fill="url(#topGlow)" />
  <rect width="1080" height="1350" fill="url(#bottomGold)" />
  <rect width="1080" height="1350" fill="url(#bottomGreen)" />

  <!-- Cadre et coins dorés -->
  <rect x="35" y="35" width="1010" height="1280" rx="32" fill="none" stroke="#d89f3c" stroke-width="1.5" stroke-opacity="0.4" />
  
  <path d="M 45 65 L 45 45 L 65 45" fill="none" stroke="#d89f3c" stroke-width="3" stroke-linecap="round" />
  <path d="M 1035 65 L 1035 45 L 1015 45" fill="none" stroke="#d89f3c" stroke-width="3" stroke-linecap="round" />
  <path d="M 45 1285 L 45 1305 L 65 1305" fill="none" stroke="#d89f3c" stroke-width="3" stroke-linecap="round" />
  <path d="M 1035 1285 L 1035 1305 L 1015 1305" fill="none" stroke="#d89f3c" stroke-width="3" stroke-linecap="round" />

  <!-- Badge Communauté -->
  <g transform="translate(380, 80)">
    <rect width="320" height="42" rx="21" fill="#0d2b20" stroke="#3fae7a" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="24" cy="21" r="5" fill="#3fae7a" />
    <text x="40" y="27" fill="#3fae7a" font-size="13" font-weight="bold" letter-spacing="2">TEAM SAHÉLIA · OFFICIEL</text>
  </g>

  <!-- Titre Principal -->
  <text x="540" y="195" text-anchor="middle" fill="#ffffff" font-size="52" font-weight="900" letter-spacing="1">
    BIENVENUE AUX <tspan fill="url(#goldGrad)">NOUVEAUX</tspan>
  </text>
  <text x="540" y="260" text-anchor="middle" fill="url(#greenGrad)" font-size="52" font-weight="900" letter-spacing="1">
    BÂTISSEURS D'AVENIR !
  </text>

  <!-- Sous-titre -->
  <text x="540" y="315" text-anchor="middle" fill="#cbd5e1" font-size="19" font-weight="500">
    Le carrefour béninois &amp; sahélien des compétences d'avenir : agronomie,
  </text>
  <text x="540" y="342" text-anchor="middle" fill="#cbd5e1" font-size="19" font-weight="500">
    données, numérique, esprit d'entreprise et solidarité panafricaine.
  </text>

  <!-- Grille des 4 Piliers -->
  <!-- Carte 1 : Compétences -->
  <g transform="translate(85, 385)">
    <rect width="435" height="230" rx="18" fill="url(#cardGrad)" stroke="#1b4d3e" stroke-width="1.2" />
    <rect x="0" y="0" width="5" height="230" rx="2" fill="#3fae7a" />
    <rect x="25" y="22" width="44" height="44" rx="10" fill="#082218" stroke="#3fae7a" stroke-width="1" />
    <text x="47" y="51" text-anchor="middle" font-size="22">💡</text>
    <text x="82" y="42" fill="#ffffff" font-size="20" font-weight="bold">Compétences de Pointe</text>
    <text x="82" y="65" fill="#88b3a4" font-size="12" font-weight="600">THÉORIE MINIME · PRATIQUE TOTALE</text>
    <text x="25" y="105" fill="#94a3b8" font-size="14">SIG (QGIS), enquêtes de terrain KoboToolbox,</text>
    <text x="25" y="128" fill="#94a3b8" font-size="14">analyse sous R &amp; Excel, pilotage de drones</text>
    <text x="25" y="151" fill="#94a3b8" font-size="14">agricoles et Vibe Coding assisté par l'IA.</text>
    
    <!-- Tags -->
    <rect x="25" y="175" width="115" height="28" rx="6" fill="#0b241b" stroke="#3fae7a" stroke-width="1" />
    <text x="82" y="194" text-anchor="middle" fill="#3fae7a" font-size="11" font-weight="bold">Agronomie &amp; SIG</text>
    <rect x="150" y="175" width="95" height="28" rx="6" fill="#081e28" stroke="#38bdf8" stroke-width="1" />
    <text x="197" y="194" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="bold">Code &amp; IA</text>
    <rect x="255" y="175" width="105" height="28" rx="6" fill="#261b07" stroke="#d89f3c" stroke-width="1" />
    <text x="307" y="194" text-anchor="middle" fill="#d89f3c" font-size="11" font-weight="bold">16 Formations</text>
  </g>

  <!-- Carte 2 : Revenus & Impact -->
  <g transform="translate(560, 385)">
    <rect width="435" height="230" rx="18" fill="url(#cardGrad)" stroke="#1b4d3e" stroke-width="1.2" />
    <rect x="0" y="0" width="5" height="230" rx="2" fill="#d89f3c" />
    <rect x="25" y="22" width="44" height="44" rx="10" fill="#231908" stroke="#d89f3c" stroke-width="1" />
    <text x="47" y="51" text-anchor="middle" font-size="22">📈</text>
    <text x="82" y="42" fill="#ffffff" font-size="20" font-weight="bold">Impact &amp; Revenus Réels</text>
    <text x="82" y="65" fill="#d89f3c" font-size="12" font-weight="600">VALORISATION PROFESSIONNELLE</text>
    <text x="25" y="105" fill="#94a3b8" font-size="14">Appliquez vos acquis dans vos études et</text>
    <text x="25" y="128" fill="#94a3b8" font-size="14">votre métier. Répondez aux TDR d'ONG,</text>
    <text x="25" y="151" fill="#94a3b8" font-size="14">rédigez des devis et facturez en FCFA.</text>
    
    <!-- Tags -->
    <rect x="25" y="175" width="115" height="28" rx="6" fill="#261b07" stroke="#d89f3c" stroke-width="1" />
    <text x="82" y="194" text-anchor="middle" fill="#d89f3c" font-size="11" font-weight="bold">Tarifs en FCFA</text>
    <rect x="150" y="175" width="105" height="28" rx="6" fill="#0b241b" stroke="#3fae7a" stroke-width="1" />
    <text x="202" y="194" text-anchor="middle" fill="#3fae7a" font-size="11" font-weight="bold">Consulting Pro</text>
    <rect x="265" y="175" width="110" height="28" rx="6" fill="#081e28" stroke="#38bdf8" stroke-width="1" />
    <text x="320" y="194" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="bold">Dossiers Bailleurs</text>
  </g>

  <!-- Carte 3 : Devenez Formateur -->
  <g transform="translate(85, 645)">
    <rect width="435" height="230" rx="18" fill="url(#cardGrad)" stroke="#1b4d3e" stroke-width="1.2" />
    <rect x="0" y="0" width="5" height="230" rx="2" fill="#3fae7a" />
    <rect x="25" y="22" width="44" height="44" rx="10" fill="#082218" stroke="#3fae7a" stroke-width="1" />
    <text x="47" y="51" text-anchor="middle" font-size="22">🎓</text>
    <text x="82" y="42" fill="#ffffff" font-size="20" font-weight="bold">Formez vos Pairs</text>
    <text x="82" y="65" fill="#88b3a4" font-size="12" font-weight="600">ORGANISATION &amp; PARTENARIATS</text>
    <text x="25" y="105" fill="#94a3b8" font-size="14">Vous avez une compétence reconnue ?</text>
    <text x="25" y="128" fill="#94a3b8" font-size="14">TEAM Sahélia structure l'atelier, mobilise</text>
    <text x="25" y="151" fill="#94a3b8" font-size="14">le réseau et vous propulse formateur.</text>
    
    <!-- Tags -->
    <rect x="25" y="175" width="125" height="28" rx="6" fill="#0b241b" stroke="#3fae7a" stroke-width="1" />
    <text x="87" y="194" text-anchor="middle" fill="#3fae7a" font-size="11" font-weight="bold">Ateliers Dédiés</text>
    <rect x="160" y="175" width="115" height="28" rx="6" fill="#261b07" stroke="#d89f3c" stroke-width="1" />
    <text x="217" y="194" text-anchor="middle" fill="#d89f3c" font-size="11" font-weight="bold">Reconnaissance</text>
    <rect x="285" y="175" width="90" height="28" rx="6" fill="#081e28" stroke="#38bdf8" stroke-width="1" />
    <text x="330" y="194" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="bold">Leadership</text>
  </g>

  <!-- Carte 4 : Entraide & Solidarité -->
  <g transform="translate(560, 645)">
    <rect width="435" height="230" rx="18" fill="url(#cardGrad)" stroke="#1b4d3e" stroke-width="1.2" />
    <rect x="0" y="0" width="5" height="230" rx="2" fill="#d89f3c" />
    <rect x="25" y="22" width="44" height="44" rx="10" fill="#231908" stroke="#d89f3c" stroke-width="1" />
    <text x="47" y="51" text-anchor="middle" font-size="22">🤝</text>
    <text x="82" y="42" fill="#ffffff" font-size="20" font-weight="bold">Synergie &amp; Croissance</text>
    <text x="82" y="65" fill="#d89f3c" font-size="12" font-weight="600">FAMILLE PROFESSIONNELLE</text>
    <text x="25" y="105" fill="#94a3b8" font-size="14">Partage quotidien d'opportunités de stages,</text>
    <text x="25" y="128" fill="#94a3b8" font-size="14">d'emplois, de bourses d'études et</text>
    <text x="25" y="151" fill="#94a3b8" font-size="14">d'appels d'offres en Afrique de l'Ouest.</text>
    
    <!-- Tags -->
    <rect x="25" y="175" width="105" height="28" rx="6" fill="#081e28" stroke="#38bdf8" stroke-width="1" />
    <text x="77" y="194" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="bold">Stages &amp; Jobs</text>
    <rect x="140" y="175" width="115" height="28" rx="6" fill="#0b241b" stroke="#3fae7a" stroke-width="1" />
    <text x="197" y="194" text-anchor="middle" fill="#3fae7a" font-size="11" font-weight="bold">Entraide 24/7</text>
    <rect x="265" y="175" width="115" height="28" rx="6" fill="#261b07" stroke="#d89f3c" stroke-width="1" />
    <text x="322" y="194" text-anchor="middle" fill="#d89f3c" font-size="11" font-weight="bold">Bénin &amp; Sahel</text>
  </g>

  <!-- Bannière Action & Badge -->
  <g transform="translate(85, 915)">
    <rect width="910" height="150" rx="22" fill="#0a2319" stroke="#d89f3c" stroke-width="1.5" />
    <text x="45" y="62" fill="#ffffff" font-size="26" font-weight="800">Prenez place dans la communauté !</text>
    <text x="45" y="95" fill="#a7f3d0" font-size="16">Activez votre Badge Officiel nominatif avec photo et QR Code sécurisé.</text>
    <text x="45" y="122" fill="#d89f3c" font-size="13" font-weight="bold">Gratuit et vérifiable en ligne sur la plateforme.</text>

    <!-- Bouton Badge -->
    <g transform="translate(635, 48)">
      <rect width="235" height="56" rx="28" fill="url(#goldGrad)" />
      <text x="40" y="36" font-size="20">🪪</text>
      <text x="75" y="35" fill="#06100c" font-size="15" font-weight="800" letter-spacing="0.5">MON BADGE PRO</text>
    </g>
  </g>

  <!-- Pied de page -->
  <line x1="85" y1="1135" x2="995" y2="1135" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
  
  <text x="85" y="1178" fill="#d89f3c" font-size="19" font-weight="800" letter-spacing="2">TEAM SAHÉLIA · APPRENDRE. CRÉER. INNOVER.</text>
  <text x="85" y="1208" fill="#88b3a4" font-size="14">Initiative dirigée par Sègla Bio KPEROU &amp; Olivier AREMOU</text>

  <!-- URL -->
  <g transform="translate(565, 1160)">
    <rect width="430" height="46" rx="10" fill="#0d2b38" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
    <text x="215" y="29" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="bold" font-family="monospace">
      aremouolivier-ops.github.io/site-team-sahelia
    </text>
  </g>

</svg>
